  ];
  // Worlds group the levels on the map; each ends with a finale.
  const WORLDS = [
    { name: 'Basics', from: 1, to: 24 },
    { name: 'Stone Quarry', from: 25, to: 36 },
    { name: 'Frost Peaks', from: 37, to: 48 },
  ];
  const worldOf = n => WORLDS.find(w => n >= w.from && n <= w.to) || WORLDS[0];
  // Difficulty tiers, as in Candy Crush / Royal Match: normal levels carry no
  // label; Hard and Super Hard are flagged loudly and pay more.
  const TIERS = {
    hard:  { name: 'Hard level', icon: '🔥', mult: 2, frame: '#ff6b4a' },
    super: { name: 'Super Hard level', icon: '💀', mult: 3, frame: '#b46cff' },
  };
  const levelTier = L => (L && TIERS[L.tier]) || null;
  // First-clear coins: 30 a level (×2 Hard, ×3 Super Hard), 150 for a world
  // finale or graduation, plus 2 per shot left over.
  const BASE_WIN = 30, FINALE_WIN = 150, PER_SHOT_LEFT = 2;
  function winCoins(L, n) {
    const t = levelTier(L);
    const base = L.grad || (n && n === worldOf(n).to) ? FINALE_WIN : BASE_WIN * (t ? t.mult : 1);
    return base + (lv.shots ? Math.max(0, lv.shotsLeft) * PER_SHOT_LEFT : 0);
  }
  const levelDef = () => (mode === 'daily' ? dailyDef(lv.day) : LEVELS[lv.n - 1]);
  let levelPerks = '';                 // streak bonus text for the level intro

  function loadProgress() {
    try {
      const p = JSON.parse(store.get(PROGRESS_KEY) || 'null');
      if (p && typeof p.stars === 'object') return { stars: p.stars, fails: p.fails || {}, cleared: p.cleared || {}, streak: p.streak || 0, gifts: p.gifts || {} };
    } catch (e) {}
    return { stars: {}, fails: {}, cleared: {}, streak: 0 };
  }
  const saveProgress = pr => store.set(PROGRESS_KEY, JSON.stringify(pr));
  // level n is open once the previous one is cleared (or skipped, stored as 0 stars)
  const unlocked = (n, pr = loadProgress()) => n === 1 || pr.stars[n - 1] !== undefined;
  // Win streak: each new level cleared in a row adds a step (max 5); losing a
  // new level costs 2 steps, never the whole ladder. Replays don't count.
  const STREAK_MAX = 5;
  const streakPerks = s => ({ hammer: s >= 3 ? 1 : 0, swap: s >= 5 ? 1 : 0 });
  function perkText(s) {
    const p = streakPerks(s);
    return [p.hammer && 'free Hammer', p.swap && 'free Swap'].filter(Boolean).join(' + ');
  }
  // what the next step of the ladder gives, for the win screen
  function streakLine(s) {
    const now = perkText(s);
    if (now) return `🔥 Streak ${s}: next level starts with a ${now}`;
    return `🔥 Streak ${s} — ${3 - s} more win${3 - s === 1 ? '' : 's'} for a free Hammer`;
  }
  const totalStars = pr => Object.values(pr.stars).reduce((a, b) => a + b, 0);

  function goalText(L, withProgress) {
    const [type, v] = L.goal;
    const pr = withProgress && lv;
    switch (type) {
      case 'make': return `Make ${fmt(v)[0] === '8' ? 'an' : 'a'} <b>${fmt(v)}</b>`;
      case 'score': return `Score <b>${v.toLocaleString()}</b>` + (pr ? ` (${score.toLocaleString()})` : '');
      case 'combo': return `Make a <b>${v}-merge combo</b> in one shot`;
      case 'merge': return `Merge <b>${v} blocks</b> at once`;
      case 'leave': return `Leave <b>${v} or fewer</b> blocks` + (pr ? ` (now ${countTiles()})` : '');
      case 'survive': return `Survive <b>${v} shots</b> without filling up`;
      case 'break': return `Break <b>${v} stone${v === 1 ? '' : 's'}</b>` + (pr ? ` (${Math.min(v, lv.broken || 0)}/${v})` : '');
      case 'thaw': return `Thaw <b>${v} frozen block${v === 1 ? '' : 's'}</b>` + (pr ? ` (${Math.min(v, lv.thawed || 0)}/${v})` : '');
    }
    return '';
  }

  function goalMet() {
    const [type, v] = levelDef().goal;
    switch (type) {
      case 'make': return maxV >= v;
      case 'score': return score >= v;
      case 'combo': return lv.bestCombo >= v;
      case 'merge': return lv.bestMerge >= v;
      case 'leave': return lv.used > 0 && countTiles() <= v;
      case 'survive': return lv.shots > 0 && lv.shotsLeft <= 0;
      case 'break': return (lv.broken || 0) >= v;
      case 'thaw': return (lv.thawed || 0) >= v;
    }
    return false;
  }

  function levelRoll() {
    const L = levelDef();
    if (L.queue && lv.qi < L.queue.length) return L.queue[lv.qi++];
    return drawFromBag(1, L.spawn || 3);
  }

  function startLevel(n) {
    const L = LEVELS[n - 1], pr = loadProgress();
    if (L.gift && !(pr.gifts || {})[n]) {   // a one-time free sample of a new booster
      for (const k in L.gift) inv[k] = (inv[k] || 0) + L.gift[k];
      saveInv();
      pr.gifts = { ...(pr.gifts || {}), [n]: true };
      saveProgress(pr);
    }
    beginAttempt(L, 'level', { n });
  }

  // ---------- Daily challenge ----------
  // One board a day, the same for everyone: the date seeds the start board and
  // the whole tile queue. The goal type rotates day by day. First win of the
  // day pays coins; there's no daily streak to lose (see the design rules).
  const DAILY_KEY = 'mergeQuest.daily.v1';    // { won: { 'YYYY-MM-DD': stars } }
  const DAILY_REWARD = 60;
  const DAILY_GOALS = [
    { goal: ['score', 500], shots: 30, spawn: 5 },
    { goal: ['break', 4], shots: 20, spawn: 4, stones: 5 },
    { goal: ['make', 256], shots: 60, spawn: 5 },
    { goal: ['combo', 4], shots: 16, spawn: 4 },
    { goal: ['score', 380], shots: 26, spawn: 4, stones: 3, stoneEvery: 7 },
    { goal: ['merge', 3], shots: 12, spawn: 4 },
    { goal: ['make', 128], shots: 30, spawn: 4, stones: 2 },
  ];
  const pad2 = n => String(n).padStart(2, '0');
  const todayKey = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const dayNumber = key => { const [y, m, d] = key.split('-').map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };
  const dayLabel = key => { const [, m, d] = key.split('-').map(Number); return `${d} ${'JanFebMarAprMayJunJulAugSepOctNovDec'.substr((m - 1) * 3, 3)}`; };
  function seeded(seed) {                     // mulberry32
    return () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  let dailyCache = null;
  function dailyDef(key) {
    if (dailyCache && dailyCache.key === key) return dailyCache.L;
    const dn = dayNumber(key), rnd = seeded(dn * 2654435761);
    const T = DAILY_GOALS[((dn % DAILY_GOALS.length) + DAILY_GOALS.length) % DAILY_GOALS.length];
    const cols = 5, rows = T.goal[0] === 'make' && T.goal[1] >= 256 ? 7 : 6;
    const pick = () => Math.pow(2, 1 + Math.floor(rnd() * Math.min(T.spawn, 4)));
    // start board: 0-3 tiles per column, no equal neighbours, stones mixed in
    const g = Array.from({ length: cols }, () => Array(rows).fill(0));
    for (let c = 0; c < cols; c++) {
      const h = Math.floor(rnd() * 4);
      for (let r = 0; r < h; r++) {
        let v = 0;
        for (let k = 0; k < 12 && !v; k++) {
          const cand = pick();
          if (g[c][r - 1] !== cand && (c === 0 || g[c - 1][r] !== cand)) v = cand;
        }
        if (!v) break;                  // no safe value: keep the column shorter
        g[c][r] = v;
      }
    }
    for (let k = 0; k < (T.stones || 0); k++) {
      const c = Math.floor(rnd() * cols), r = g[c].indexOf(0);
      if (r >= 0 && r < rows - 2) g[c][r] = STONE;
    }
    // the queue: the same weighted bags as random levels, but seeded
    const queue = [];
    while (queue.length < 400) {
      const bagQ = [];
      let total = 0;
      for (let e = 1; e <= T.spawn; e++) total += Math.pow(0.6, e - 1);
      for (let e = 1; e <= T.spawn; e++) {
        const n = Math.max(1, Math.round(Math.pow(0.6, e - 1) / total * 40));
        for (let k = 0; k < n; k++) bagQ.push(Math.pow(2, e));
      }
      for (let i = bagQ.length - 1; i > 0; i--) {
        const j = Math.floor(rnd() * (i + 1));
        [bagQ[i], bagQ[j]] = [bagQ[j], bagQ[i]];
      }
      queue.push(...bagQ);
    }
    const L = { cols, rows, goal: T.goal, shots: T.shots, spawn: T.spawn, stoneEvery: T.stoneEvery,
      start: g.map(col => col.filter(Boolean)), queue, reward: DAILY_REWARD };
    dailyCache = { key, L };
    return L;
  }
  function loadDaily() {
    try { const d = JSON.parse(store.get(DAILY_KEY) || 'null'); if (d && d.won) return d; } catch (e) {}
    return { won: {} };
  }
  // today's unfinished daily attempt, if there is one
  function savedDaily() {
    try {
      const d = JSON.parse(store.get(DAILY_SAVE_KEY) || 'null');
      return !!(d && d.lv && !d.lv.result && d.lv.day === todayKey());
    } catch (e) { return false; }
  }
  function startDaily(day = todayKey()) { beginAttempt(dailyDef(day), 'daily', { n: 0, day }); }
  function playDaily() {
    if (levelish() && lv && !lv.result) save();
    else if (mode === 'endless') save();
    if (savedDaily() && load('daily') && lv && !lv.result) { mode = 'daily'; hideHome(); hideOverlay(); updateHud(); return; }
    startDaily();
  }

  function dailyWon() {
    const day = lv.day, stars = starsFor(), d = loadDaily();
    const first = d.won[day] === undefined;
    const reward = first ? DAILY_REWARD : Math.max(0, stars - d.won[day]) * 10;
    d.won[day] = Math.max(stars, d.won[day] || 0);
    store.set(DAILY_KEY, JSON.stringify(d));
    store.del(DAILY_SAVE_KEY);
    if (reward) { setCoins(coins + reward); launchCoins(reward); }
    banner = { text: 'Daily complete!', life: 2 };
    const total = Object.keys(d.won).length;
    showOverlay(`
      <div class="tag">Daily challenge · ${dayLabel(day)}</div>
      <h2>Daily complete!</h2>
      ${starHtml(stars)}
      ${reward ? `<p><span class="coin"></span> <b>+${reward}</b> coins</p>` : '<p>Already claimed today. Replay for more stars!</p>'}
      <p>📅 Dailies won: <b>${total}</b>. A new board arrives tomorrow.</p>
      <button class="primary" id="homeBtn2">🏠 Home</button>
      <button id="replayBtn">↻ Replay</button>`, '', { close: showHome });
    $('homeBtn2').onclick = showHome;
    $('replayBtn').onclick = () => startDaily(day);
  }
  function dailyLost(why) {
    save();
    const canUndo = snap && coins - lastEarned >= priceOf('undo');
    showOverlay(`
      <div class="tag">Daily challenge · ${dayLabel(lv.day)}</div>
      <h2>${why}</h2>
      <p>${goalText(levelDef())}</p>
      ${continueHtml(why)}
      <button class="${canContinue(why) ? '' : 'primary'}" id="retryBtn">↻ Try again</button>
      ${canUndo ? `<button id="goUndo">↶ Undo last shot${priceOf('undo') ? ` <span class="coin"></span> ${COST.undo}` : ' (free)'}</button>` : ''}
      <button id="homeBtn2">🏠 Home</button>`, '', { close: showHome });
    $('homeBtn2').onclick = showHome;
    wireContinue(why);
    $('retryBtn').onclick = () => startDaily(lv.day);
    if (canUndo) $('goUndo').onclick = undo;
  }

  // Sets up a level or daily attempt from its definition.
  function beginAttempt(L, m, extra) {
    mode = m;
    cols = L.cols; rows = L.rows;
    layout();
    const start = L.start || [];
    setGrid(Array.from({ length: cols }, (_, c) => {
      const col = start[c] || [];
      return Array.from({ length: rows }, (_, r) => col[r] || 0);
    }));
    lv = { ...extra, shots: L.shots, shotsLeft: L.shots, used: 0, qi: 0, bestCombo: 0, bestMerge: 0, broken: 0, result: null };
    score = 0; minE = 1; oldStart = 0; over = false; busy = false;
    maxV = Math.max(2, ...allTiles().map(t => t.v));
    ghosts = []; floaters = []; flyers = []; bubbles = []; banner = null; praise = null;
    tool = null; sel = null; snap = null; lastEarned = 0;
    clearCoinFlights();
    bag = []; bagKey = ''; rescueUsed = true;
    freeUses = { hammer: 0, swap: 0, undo: 0, ...L.free };
    const streaky = m === 'level' && !L.noHelpers;   // the win streak belongs to Levels
    const perks = streaky ? streakPerks(loadProgress().streak) : {};
    for (const k in perks) freeUses[k] += perks[k];
    levelPerks = streaky ? perkText(loadProgress().streak) : '';
    cur = rollValue(); nxt = rollValue(); nxt2 = rollValue();
    gameId = (m === 'daily' ? 'D' + extra.day : 'L' + extra.n) + '-' + Date.now().toString(36);
    aim = L.hint !== undefined ? L.hint : Math.floor(cols / 2);
    resetShooter();
    save();
    updateHud();
    hideHome();
    showLevelIntro();
  }

  // ---------- pre-level boosters (picked on the start screen) ----------
  // Paid from stock bought in the Shop first, otherwise with coins when Play is pressed.
  const BOOSTERS = [
    { id: 'shots', icon: '➕', name: '+3 Shots', price: 150 },
    { id: 'wild', icon: '🌈', name: 'Wild Tile', price: 300 },
    { id: 'hammer', icon: '🔨', name: 'Hammer', price: 250 },
    { id: 'heater', icon: '🔥', name: 'Heater', price: 250, ice: true },
  ];
  let picked = new Set();
  // Why a booster can't be picked here ('' = it can).
  function boosterBlock(b, L) {
    if (b.id === 'shots' && !L.shots) return 'No shot limit';
    if (b.id === 'hammer' && freeCount('hammer') > 0) return `Ready ×${freeCount('hammer')}`;
    if (b.id === 'heater' && L.goal[0] === 'thaw') return 'Not here';   // would skip the level
    if (b.id === 'heater' && !allTiles().some(t => isFrozen(t.v))) return 'No ice yet';
    return '';
  }
  const boosterCost = () => BOOSTERS.filter(b => picked.has(b.id) && !(inv[b.id] > 0 && b.id !== 'hammer'))
    .reduce((a, b) => a + b.price, 0);
  function boosterHtml(L) {
    if (L.queue) return '';            // scripted tutorial levels (fixed tiles): no boosters
    if (L.noHelpers) return '<p class="tier-note">🚫 No boosters or helpers on this level.</p>';
    const icy = L.snowEvery || allTiles().some(t => isFrozen(t.v));
    return `<div class="boost-head">Boosters</div><div class="boost-row">${BOOSTERS.filter(b => !b.ice || icy).map(b => {
      const block = boosterBlock(b, L), own = b.id !== 'hammer' && inv[b.id] > 0;
      return `<button class="boost${picked.has(b.id) ? ' on' : ''}" data-b="${b.id}" ${block ? 'disabled' : ''}>
        <span class="bi">${b.icon}</span><span class="bn">${b.name}</span>
        <span class="bp">${block || (own ? `×${inv[b.id]} owned` : `<span class="coin"></span> ${b.price}`)}</span></button>`;
    }).join('')}</div>`;
  }
  function wireBoosters(L) {
    for (const el of document.querySelectorAll('.boost[data-b]')) el.onclick = () => {
      const id = el.dataset.b, b = BOOSTERS.find(x => x.id === id);
      if (picked.has(id)) picked.delete(id);
      else {
        picked.add(id);
        if (coins < boosterCost()) { picked.delete(id); toast(`Not enough coins for ${b.name}`); return; }
      }
      el.classList.toggle('on', picked.has(id));
      $('playBtn').innerHTML = picked.size ? `Play${boosterCost() ? ` · <span class="coin"></span> ${boosterCost()}` : ''}` : 'Play';
    };
    $('playBtn').onclick = () => {
      if (coins < boosterCost()) return;
      for (const b of BOOSTERS) {
        if (!picked.has(b.id) || boosterBlock(b, L)) continue;
        if (b.id !== 'hammer' && inv[b.id] > 0) { inv[b.id]--; saveInv(); } else setCoins(coins - b.price);
        if (b.id === 'shots') { lv.shots += 3; lv.shotsLeft += 3; }
        if (b.id === 'hammer') freeUses.hammer++;
        if (b.id === 'wild') { nxt2 = nxt; nxt = cur; cur = WILD; resetShooter(); }
        if (b.id === 'heater') for (const t of allTiles()) if (isFrozen(t.v)) thaw(t);
      }
      if (picked.size) toast('🚀 Boosters ready!');
      if (picked.has('heater')) setTimeout(() => { if (!busy) { busy = true; resolve(allTiles().map(t => find(t))).then(cb => { rewardCombo(cb); finishTurn(); }); } }, 250);
      picked = new Set();
      hideOverlay(); save(); updateHud();
    };
  }

  // How far the current attempt is toward its goal: { now, target, text }.
  function goalProgress(L) {
    const [type, v] = L.goal;
    switch (type) {
      case 'make': return { now: maxV, target: v, text: `Biggest block: <b>${fmt(maxV)}</b>` };
      case 'score': return { now: score, target: v, text: `<b>${score.toLocaleString()}</b> / ${v.toLocaleString()}` };
      case 'combo': return { now: lv.bestCombo, target: v, text: `Best combo: <b>${lv.bestCombo}</b> / ${v}` };
      case 'merge': return { now: lv.bestMerge, target: v, text: `Biggest merge: <b>${lv.bestMerge}</b> / ${v} blocks` };
      case 'leave': return { now: 0, target: 0, text: `Blocks now: <b>${countTiles()}</b> (need ${v} or fewer)` };
      case 'survive': return { now: lv.used, target: v, text: `<b>${lv.used}</b> / ${v} shots survived` };
      case 'break': return { now: lv.broken || 0, target: v, text: `<b>${lv.broken || 0}</b> / ${v} stones broken` };
      case 'thaw': return { now: lv.thawed || 0, target: v, text: `<b>${lv.thawed || 0}</b> / ${v} thawed` };
    }
    return { now: 0, target: 0, text: '' };
  }
  function showGoal() {
    if (!levelish() || !lv || over) return;
    const L = levelDef(), tr = levelTier(L), g = goalProgress(L);
    lv.goalSeen = true;
    const pct = g.target ? Math.min(100, Math.round((g.target > 2 && L.goal[0] === 'make' ? Math.log2(g.now) / Math.log2(g.target) : g.now / g.target) * 100)) : 0;
    const facts = [lv.shots ? `🎯 <b>${lv.shotsLeft}</b> shot${lv.shotsLeft === 1 ? '' : 's'} left` : '♾️ No shot limit'];
    if (L.stoneEvery) facts.push(`🪨 stone in <b>${L.stoneEvery - (lv.used % L.stoneEvery)}</b>`);
    if (L.snowEvery) facts.push(`❄️ snow in <b>${L.snowEvery - (lv.used % L.snowEvery)}</b>`);
    showOverlay(`
      ${tr ? `<div class="tier-ribbon">${tr.icon} ${tr.name.toUpperCase()} ${tr.icon}</div>` : ''}
      <div class="tag">${mode === 'daily' ? `Daily challenge · ${dayLabel(lv.day)}` : `Level ${lv.n}`} · Goal</div>
      <div class="goal-big">${goalText(L)}</div>
      ${g.target ? `<div class="gbar"><i style="width:${pct}%"></i></div>` : ''}
      <p>${g.text}</p>
      <div class="gfacts">${facts.map(f => `<span>${f}</span>`).join('')}</div>
      <button class="primary" id="goalOk">Got it</button>`, tr ? 'tier-' + L.tier : '', { close: hideOverlay });
    $('goalOk').onclick = hideOverlay;
    updateHud();
  }

  function showLevelIntro() {
    const L = levelDef();
    picked = new Set();
    const free = Object.entries(L.free || {}).map(([k, v]) => `${v} free ${k[0].toUpperCase() + k.slice(1)}${v > 1 ? 's' : ''}`);
    showOverlay(`
      ${levelTier(L) ? `<div class="tier-ribbon">${levelTier(L).icon} ${levelTier(L).name.toUpperCase()} ${levelTier(L).icon}</div>` : ''}
      <div class="tag">${mode === 'daily' ? `Daily challenge · ${dayLabel(lv.day)}` : `Level ${lv.n}`}${lv.n > WORLDS[0].to ? ' · ' + worldOf(lv.n).name : ''} · ${L.cols}×${L.rows} board</div>
      <h2 class="goal">${goalText(L)}</h2>
      ${L.intro ? `<p>${L.intro}</p>` : ''}
      ${mode === 'daily' ? `<p>Today's board is the same for every player.${loadDaily().won[lv.day] === undefined ? ` First win pays <span class="coin"></span> <b>${DAILY_REWARD}</b>.` : ' Already won today: play for stars.'}</p>` : ''}
      ${L.stoneEvery ? `<p>🪨 A stone rolls in every <b>${L.stoneEvery}</b> shots.</p>` : ''}
      ${L.snowEvery ? `<p>❄️ Snowfall: a frozen block drops in every <b>${L.snowEvery}</b> shots.</p>` : ''}
      ${levelPerks ? `<p class="streak">🔥 Win streak bonus: ${levelPerks}</p>` : ''}
      <p>${L.shots ? `<b>${L.shots}</b> shots` : 'No shot limit'}${free.length ? ' · ' + free.join(', ') : ''}</p>
      ${levelTier(L) ? `<p class="tier-note">${levelTier(L).icon} Coin reward ×${levelTier(L).mult}.${L.noHelpers ? '' : ' Boosters can help!'}</p>` : ''}
      ${boosterHtml(L)}
      <button class="primary" id="playBtn">Play</button>`, levelTier(L) ? 'tier-' + L.tier : '', { close: mode === 'daily' ? showHome : showMap });
    wireBoosters(L);
  }

  // After every play in Level mode: won, lost, or carry on?
  function levelEnded() {
    if (goalMet()) { levelWon(); return true; }
    if (isStuck()) { levelLost('No room left'); return true; }
    if (lv.shots && lv.shotsLeft <= 0) { levelLost('Out of shots'); return true; }
    return false;
  }

  function starsFor() {
    if (lv.cont) return 1;              // bought extra shots: the win counts, 1 star
    if (!lv.shots || levelDef().goal[0] === 'survive') return 3;
    const left = lv.shotsLeft / lv.shots;
    return left >= 0.4 ? 3 : left >= 0.15 ? 2 : 1;
  }
  const starHtml = n => `<div class="stars">${[1, 2, 3].map(i => i <= n ? '★' : '<span class="off">★</span>').join('')}</div>`;

  // Chest coins are already saved; until the chest is opened the wallet just
  // doesn't show them. Leaving the screen unopened shows them without the fly-in.
  let chestHeld = 0;
  function releaseChest(fly) {
    if (!chestHeld) return;
    coinPending = Math.max(0, coinPending - chestHeld);
    if (fly) launchCoins(chestHeld); else updateHud();
    chestHeld = 0;
  }

  function levelWon() {
    over = true; tool = null; sel = null; snap = null;
    lv.result = 'won';
    if (mode === 'daily') return dailyWon();
    const L = levelDef(), n = lv.n, stars = starsFor();
    const pr = loadProgress(), prev = pr.stars[n];
    // full reward the first time it's cleared (a skipped level counts as not cleared);
    // after that, 10 coins for each new star
    const firstClear = !(pr.cleared && pr.cleared[n]);
    const reward = firstClear ? winCoins(L, n) : Math.max(0, stars - (prev || 0)) * 10;
    pr.stars[n] = Math.max(stars, prev || 0);
    pr.cleared[n] = true;
    pr.fails[n] = 0;
    if (firstClear) pr.streak = Math.min(STREAK_MAX, pr.streak + 1);
    saveProgress(pr);
    store.del(LEVEL_SAVE_KEY);
    if (reward) { setCoins(coins + reward); launchCoins(reward); }
    // the chest is saved right away; opening it is only the reveal
    const chest = firstClear && L.chest;
    if (chest) {
      for (const k of ['hammer', 'swap', 'undo']) inv[k] += chest[k] || 0;
      saveInv();
      setCoins(coins + chest.coins);
      chestHeld = chest.coins; coinPending += chestHeld; updateHud();
    }
    const last = n === LEVELS.length, grad = !!L.grad, finale = n === worldOf(n).to;
    const nextWorld = finale && !last ? worldOf(n + 1).name : '';
    banner = { text: grad ? 'You graduated!' : finale ? 'World complete!' : 'Level complete!', life: 2 };
    showOverlay(`
      <div class="tag">Level ${n}</div>
      <h2>${grad ? '🎓 You graduated!' : finale ? `🏆 ${worldOf(n).name} cleared!` : 'Level complete!'}</h2>
      ${starHtml(stars)}
      ${reward ? `<p><span class="coin"></span> <b>+${reward}</b> coins${firstClear && levelTier(L) ? ` · ${levelTier(L).icon} ×${levelTier(L).mult} bonus` : ''}</p>` : '<p>Replay for more stars!</p>'}
      ${firstClear && !last ? `<p class="streak">${streakLine(pr.streak)}</p>` : ''}
      ${chest ? `<button class="chest" id="chestBtn" aria-label="Open the chest">🎁</button><p id="chestTxt">Checkpoint chest! Tap to open.</p>` : ''}
      ${nextWorld ? `<p>A new world is open: <b>${nextWorld}</b>. Endless is unlocked too, whenever you want it.</p>` : ''}
      ${last ? '<p>You\'ve cleared every world. Endless mode is the real test — see how far you get!</p>' : ''}
      ${last ? '<button class="primary" id="endlessBtn">∞ Play Endless</button>' : `<button class="primary" id="nextBtn">${nextWorld ? `Enter ${nextWorld}` : 'Next level'}</button>`}
      <div class="row"><button id="replayBtn">↻ Replay</button><button id="mapBtn">🗺️ Map</button><button id="homeBtn2">🏠</button></div>`, '', { close: showMap });
    if (last) $('endlessBtn').onclick = playEndless;
    else $('nextBtn').onclick = () => startLevel(n + 1);
    $('replayBtn').onclick = () => startLevel(n);
    $('mapBtn').onclick = showMap;
    $('homeBtn2').onclick = showHome;
    if (chest) $('chestBtn').onclick = () => {
      const b = $('chestBtn');
      if (b.classList.contains('open')) return;
      b.classList.add('open'); b.textContent = '✨';
      releaseChest(true);
      const items = ['hammer', 'swap'].filter(k => chest[k]).map(k => `+${chest[k]} ${k[0].toUpperCase() + k.slice(1)}`);
      $('chestTxt').innerHTML = `<span class="loot"><span class="coin"></span> +${chest.coins} · ${items.join(' · ')}</span><br>Helpers are saved for whenever you need them.`;
    };
  }

  // Out of shots: buy +5 and keep going. 300 coins, then 600, 900 ... in the same
  // attempt (the biggest coin spend in Royal Match / Homescapes, priced the same way).
  const CONTINUE_SHOTS = 5, CONTINUE_STEP = 300;
  const continuePrice = () => CONTINUE_STEP * ((lv.cont || 0) + 1);
  const canContinue = why => why === 'Out of shots' && !!lv.shots;

  function wireContinue(why) {
    if (!canContinue(why) || !$('contBtn')) return;
    $('contBtn').onclick = () => {
      const price = continuePrice();
      if (coins < price || lv.result !== 'lost') return;
      setCoins(coins - price);

      lv.shotsLeft += CONTINUE_SHOTS;
      lv.result = null; over = false;
      if (mode === 'level' && lv.penalty) {        // the loss didn't happen after all

        pr.fails[lv.n] = Math.max(0, (pr.fails[lv.n] || 1) - 1);
        pr.streak = lv.penalty.streak; lv.streakHit = lv.penalty.hit;
        saveProgress(pr);
      }

      hideOverlay();
      banner = { text: `+${CONTINUE_SHOTS} shots!`, life: 1.4 };
      save(); updateHud();
    };

  function levelLost(why) {

    lv.penalty = { streak: pr.streak, hit: !!lv.streakHit };   // undone if they continue
    pr.fails[n] = (pr.fails[n] || 0) + 1;
    const dropped = !pr.cleared[n] && !lv.streakHit && pr.streak > 0;
    if (dropped) { pr.streak = Math.max(0, pr.streak - 2); lv.streakHit = true; }

        <button class="primary" id="closeBtn">Keep my progress</button>`, '', { close: hideOverlay, back: showSettings });
      $('sResetYes').onclick = () => {

  function hideHome() { $('home').classList.remove('show'); }

  function resumeLevel() {
    if (mode !== 'level') save();       // keep the Endless run or daily attempt
    if (!load('level') || !lv || lv.result) { startLevel(savedLevel() || 1); return; }
    hideHome(); hideOverlay();
    updateHud();
  }

  // ---------- game state (one list, used by undo, save and load) ----------
  function captureState() {
    return { cols, rows, g: gridValues(), cur, nxt, nxt2, score, maxV, minE, oldStart,
      rescueUsed, freeUses: { ...freeUses }, mode, lv: lv && { ...lv } };
  }
  function applyState(d) {
    cols = d.cols || 5; rows = d.rows || 7;
    aim = Math.min(aim, cols - 1);     // keep the aim on a narrower board
    layout();
    setGrid(d.g);
    ({ cur, nxt, score, maxV } = d);
    minE = d.minE || 1;
    nxt2 = d.nxt2 || rollValue();       // tolerate saves missing newer fields
    oldStart = d.oldStart || 0;
    rescueUsed = !!d.rescueUsed;
    freeUses = { hammer: 0, swap: 0, undo: 0, ...d.freeUses };
    mode = d.mode || 'endless';
    lv = d.lv ? { ...d.lv } : null;
    resetShooter();
  }

  function takeSnap() {
    snap = { ...captureState(), inf: infCount };
    lastEarned = 0;
  }

  function setGrid(g) {
    grid = g.map((col, c) => col.map((v, r) => (v ? { v, x: cellX(c), y: cellY(r), s: 1, ty: cellY(r) } : null)));
  }

  function undo() {
    if (helpersOff()) { lockedNote(); return; }
    if (busy || !snap) return;
    // coins earned by the undone play are taken back, so undo can't be farmed
    const price = priceOf('undo');
    if (coins - lastEarned < price) return;
    const freeUndos = freeUses.undo;
    clearCoinFlights();
    setCoins(coins - lastEarned);
    applyState(snap);
    freeUses.undo = freeUndos;         // the snapshot's count is from before this undo
    spend('undo');
    infCount = snap.inf; store.set(INF_KEY, String(infCount));
    snap = null; lastEarned = 0;
    over = false; tool = null; sel = null; praise = null;
    ghosts = []; floaters = []; flyers = []; bubbles = [];
    hideOverlay();
    banner = { text: 'Undone!', life: 0.9 };
    save();
    updateHud();
    if (isStuck()) gameOver();   // undid back into a stuck board
  }

  // ---------- core turn ----------
  // The value a Wild Tile at (c, r) turns into: the neighbour whose equal group is
  // biggest (ties: the bigger value), so it sets off the largest merge. Alone: 2.
  function wildPick(c, r) {
    let best = 2, size = 0;
    for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
      const o = grid[nc][nr];
      if (!o || o.v <= WILD) continue;
      const n = groupOf(nc, nr).length;
      if (n > size || (n === size && o.v > best)) { size = n; best = o.v; }
    }
    return best;
  }

  async function fire(c) {
    if (busy || over || tool) return;
    const v = cur;
    const r = landingRow(c, v);
    if (r < 0) { shake = { c, t: 0.35 }; return; }
    takeSnap();
    busy = true;
    aim = c;
    if (lv) { lv.used++; if (lv.shots) lv.shotsLeft--; }

    const t = shooter;
    t.x = cellX(c);
    const full = count(c) === rows;
    const destY = full ? cellY(r) + cell * 0.6 : cellY(r);
    const dur = 0.13 + 0.032 * Math.max(0, (t.y - destY) / cell);
    t.fly = { y0: t.y, y1: destY, t: 0, dur, land: full ? 0 : 0.26, stretch: 0.2 };
    t.trail = look.trail !== 'none';
    t.ty = destY;
    if (!full) grid[c][r] = t;
    else flyers.push(t);

    cur = nxt;
    nxt = nxt2;
    nxt2 = rollValue();
    resetShooter();
    updateHud();

    await sleep(dur * 1000 + (full ? 0 : 60));
    if (t.v === WILD) {                // the Wild Tile picks its value on landing
      t.v = full ? grid[c][r].v : wildPick(c, r);
      t.s = 1.25; t.wob = { amp: 0.2, t: 0 };
      const hues = ['#f472b6', '#facc15', '#4ade80', '#22d3ee', '#a78bfa'];
      burst(t, 14, [1, 1.6], [0.04, 0.07], [0.5, 0.3], i => hues[i % hues.length]);
      await sleep(160);
    }
    let combo = 0, focus = [[c, r]];
    if (full) {
      flyers = flyers.filter(f => f !== t);
      const target = grid[c][r];
      await bubbleMerge(target, [t], target.v * 2);
      addScore(target.v, c, r);
      combo = 1;
      if (hitStones([[c, r]])) {
        await sleep(160);
        const moved = compact();
        focus = [find(target) || [c, r], ...moved];
        if (moved.length) await sleep(200);
      }
    }
    combo += await resolve(focus);
    rewardCombo(combo);
    if (mode === 'endless') tierCheck();
    else lv.bestCombo = Math.max(lv.bestCombo, combo);
    finishTurn();
  }

  function finishTurn() {
    busy = false;
    // the board has settled: re-check previewed tiles (e.g. a value whose only
    // match was just merged away, or that now exceeds the biggest block)
    if (!launchable(cur)) { cur = rollValue(); shooter.v = cur; shooter.s = 0.6; }
    if (!launchable(nxt)) nxt = rollValue();
    if (!launchable(nxt2)) nxt2 = rollValue();
    if (levelish()) {
      const L = levelDef(), every = L.stoneEvery, snow = L.snowEvery;
      if (every && lv.used && lv.used % every === 0 && lv.dropAt !== lv.used && !goalMet()) {
        lv.dropAt = lv.used;
        dropStone();
      }
      if (snow && lv.used && lv.used % snow === 0 && lv.snowAt !== lv.used && !goalMet()) {
        lv.snowAt = lv.used;
        dropSnow();
      }
      if (levelEnded()) { updateHud(); return; }
    }
    if (isStuck()) gameOver();     // gameOver saves too
    else save();
    updateHud();
  }

  // Runs merges until the board is stable. Returns how many merges happened.
  async function resolve(focus) {
    let merges = 0;
    for (let guard = 0; guard < 200; guard++) {
      let hit = null;
      for (const [fc, fr] of focus) {
        if (grid[fc][fr] && eqNeighbors(fc, fr).length) { hit = [fc, fr]; break; }
      }
      if (!hit) {
        outer: for (let c = 0; c < cols; c++)
          for (let r = 0; r < rows; r++)
            if (grid[c][r] && eqNeighbors(c, r).length) { hit = [c, r]; break outer; }
      }
      if (!hit) return merges;

      const [hc, hr] = hit;
      const mergeCells = groupOf(hc, hr);        // the whole connected group of equal blocks
      // Merge into the topmost block of the group in the landing column: after the
      // column settles the result lands in the same cell either way, but visually the
      // lower bubbles rise into the upper one instead of it being dragged down.
      let tr = hr;
      for (const [gc, gr] of mergeCells) if (gc === hc && gr < tr) tr = gr;
      const t = grid[hc][tr];
      const ns = mergeCells.filter(([gc, gr]) => !(gc === hc && gr === tr))
        .sort((a, b) => (Math.abs(a[0] - hc) + Math.abs(a[1] - tr)) - (Math.abs(b[0] - hc) + Math.abs(b[1] - tr)));
      const srcs = ns.map(([nc, nr]) => { const o = grid[nc][nr]; grid[nc][nr] = null; return o; });
      merges += ns.length;                       // a 3-way merge counts as 2, a 4-way as 3
      if (lv) lv.bestMerge = Math.max(lv.bestMerge, ns.length + 1);
      const infPair = t.v >= INF;                // ∞ + ∞: both clear away for a bonus
      await bubbleMerge(t, srcs, t.v * Math.pow(2, ns.length)); // ×2, ×4, ×8, ×16 ... (doubles per extra block)
      const tp = find(t) || [hc, tr];
      if (infPair) clearInfinity(t, tp);
      else addScore(t.v, tp[0], tp[1]);
      await sleep(srcs.length === 1 ? 100 : 130);
      if (hitStones(mergeCells)) await sleep(160);

      const moved = compact();
      const pos = find(t);
      focus = pos ? [pos, ...moved] : moved;
      if (moved.length) await sleep(200);
    }
    return merges;
  }

  // Reaching a new level only announces it - blocks are never removed. Until the
  // old level's blocks are cleared, the launcher keeps mixing in their values.
  function tierCheck() {
    const want = 10 * tierOf(maxV) + 1;    // smallest value of the new tier's range
    if (want <= minE) return;
    minE = want;
    oldStart = oldBlocks().length;
    banner = { text: want >= 21 ? 'M blocks unlocked!' : 'K blocks unlocked!', life: 2.4 };
  }

  // Free: trade the current tile with the next one.
  const helpersOff = () => !!(levelish() && levelDef().noHelpers);
  const lockedNote = () => toast('🔒 No Switch or helpers on this level');
  // ↻ Restart (footer button, or N). Asks first so a stray tap can't wipe an attempt.
  // Restarting a new level mid-way counts as a try for the win streak, like a loss.
  function restartCosts() {
    if (mode !== 'level' || !lv || lv.result || !lv.used) return false;
    const pr = loadProgress();
    return !pr.cleared[lv.n] && !lv.streakHit && pr.streak > 0;
  }
  function confirmRestart() {
    if (busy) return;
    tool = null; sel = null;
    let what, note = '';
    if (mode === 'level') {
      what = `Restart Level ${lv.n}?`;
      note = restartCosts() ? `<p class="streak">🔥 This counts as a try: your win streak drops from ${loadProgress().streak} to ${Math.max(0, loadProgress().streak - 2)}.</p>` : '';
    } else if (mode === 'daily') what = 'Restart today\'s challenge?';
    else {
      what = 'Start a new Endless game?';
      note = score ? `<p>This run (score <b>${score.toLocaleString()}</b>) ends and won't go on the scoreboard.</p>` : '';
    }
    showOverlay(`
      <h2>${what}</h2>
      ${mode === 'endless' ? '' : '<p>The board, shots and boosters reset to the start.</p>'}
      ${note}
      <button class="primary" id="rsYes">↻ Restart</button>
      <button id="rsNo">Keep playing</button>`, '', { close: hideOverlay });
    $('rsNo').onclick = hideOverlay;
    $('rsYes').onclick = restartNow;
  }
  function restartNow() {
    if (restartCosts()) {
      const pr = loadProgress();
      pr.streak = Math.max(0, pr.streak - 2);
      pr.fails[lv.n] = (pr.fails[lv.n] || 0) + 1;
      saveProgress(pr);
    }
    if (mode === 'level') startLevel(lv.n);
    else if (mode === 'daily') startDaily(lv.day);
    else newGame();
  }

  function swap() {
    if (helpersOff()) { lockedNote(); return; }
    if (busy || over || tool) return;
    [cur, nxt] = [nxt, cur];
    shooter.v = cur; shooter.s = 0.7; shooter.wob = { amp: 0.15, t: 0 };
    updateHud(); save();
  }

  // ---------- paid helpers ----------
  function toggleTool(name) {
    if (busy) return;
    if (tool === name) {
      tool = null; sel = null; updateHud();
      if (isStuck()) gameOver();   // backed out of a rescue: still stuck
      return;
    }
    if (helpersOff()) { lockedNote(); return; }
    if (over || coins < priceOf(name)) return;
    tool = name; sel = null;
    hideOverlay();
    updateHud();
  }

  async function useToolAt(c, r) {
    if (busy || !tool) return;
    const t = grid[c] && grid[c][r];
    if (!t) return;
    if (tool === 'hammer' && isFrozen(t.v)) {    // smashes the ice, keeps the block
      takeSnap();
      spend('hammer');
      tool = null; busy = true;
      thaw(t);
      updateHud();
      await sleep(220);
      const combo = await resolve([[c, r]]);
      rewardCombo(combo);
      finishTurn();
      return;
    }
    if (tool === 'hammer') {
      takeSnap();
      spend('hammer');
      tool = null; busy = true;
      fadeGhost(t, cell * 0.5);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        floaters.push({ text: '✦', x: t.x + cell / 2, y: t.y + cell / 2, vx: Math.cos(a) * cell * 2, vy: Math.sin(a) * cell * 2, life: 0.6, color: t.v < 0 ? '#d9d0c4' : colorOf(t.v) });
      }
      if (t.v < 0 && lv) lv.broken = (lv.broken || 0) + 1;
      grid[c][r] = null;
      updateHud();
      await sleep(180);
      const moved = compact();
      if (moved.length) await sleep(200);
      const combo = await resolve(moved);
      rewardCombo(combo);
      finishTurn();
    } else if (tool === 'swap') {
      if (!sel) { sel = [c, r]; updateHud(); return; }
      const [sc, sr] = sel;
      if (sc === c && sr === r) { sel = null; updateHud(); return; }
      const o = grid[sc][sr];
      if (o.v === t.v) { sel = [c, r]; updateHud(); return; } // swapping equals does nothing
      takeSnap();
      spend('swap');
      tool = null; sel = null; busy = true;
      grid[sc][sr] = t; grid[c][r] = o;
      t.s = o.s = 1.15;
      t.wob = { amp: 0.12, t: 0 }; o.wob = { amp: 0.12, t: 0 };
      updateHud();
      await sleep(260);
      const combo = await resolve([[c, r], [sc, sr]]);
      rewardCombo(combo);
      finishTurn();
    }
  }

  // ---------- game lifecycle ----------
  function newGame() {
    mode = 'endless'; lv = null;
    cols = 5; rows = 7;
    layout();
    grid = Array.from({ length: cols }, () => Array(rows).fill(null));
    score = 0; maxV = 2; minE = 1; oldStart = 0; over = false; busy = false;
    ghosts = []; floaters = []; flyers = []; bubbles = []; banner = null; praise = null;
    tool = null; sel = null; snap = null; lastEarned = 0;
    clearCoinFlights();
    bag = []; bagKey = ''; rescueUsed = false; freeUses = { hammer: 0, swap: 0, undo: 0 };
    cur = rollValue(); nxt = rollValue(); nxt2 = rollValue();
    gameId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    resetShooter();
    hideOverlay(); hideHome();
    store.del(saveKey());
    updateHud();
  }

  // Saved after every move, game over included, so a reload can still offer
  // Undo / the rescue; New game (or Play again) is what clears it.
  function save() {
    store.set(BEST_KEY, String(best));
    store.set(saveKey(), JSON.stringify({ ...captureState(), snap, lastEarned, gameId }));
    store.set(MODE_KEY, mode);
  }

  function load(m = mode) {
    try {
      const d = JSON.parse(store.get(saveKey(m)) || 'null');
      if (!d || !Array.isArray(d.g)) return false;
      applyState(d);
      over = false;
      snap = d.snap || null; lastEarned = d.lastEarned || 0;
      gameId = d.gameId || Date.now().toString(36);
      compact();
      updateHud();
      return true;
    } catch (e) { return false; }
  }

  // ---------- scoreboard (top 10, saved on this device) ----------
  function loadBoard() {
    try {
      const b = JSON.parse(store.get(BOARD_KEY) || '[]');
      return Array.isArray(b) ? b.filter(e => e && typeof e.score === 'number') : [];
    } catch (e) { return []; }
  }
  function saveBoard(b) { store.set(BOARD_KEY, JSON.stringify(b)); }
  const sortBoard = b => b.sort((a, c) => c.score - a.score || a.date - c.date);

  // Rank this game would get (1-based), or 0 if it doesn't make the top 10.
  function rankFor(sc) {
    if (sc <= 0) return 0;
    const others = loadBoard().filter(e => e.id !== gameId);
    const rank = others.filter(e => e.score >= sc).length + 1;
    return rank <= BOARD_SIZE ? rank : 0;
  }

  function addToBoard(name) {
    let b = loadBoard().filter(e => e.id !== gameId); // continuing a game replaces its entry
    b.push({ id: gameId, name, score, tile: maxV, date: Date.now() });
    b = sortBoard(b).slice(0, BOARD_SIZE);
    saveBoard(b);
    store.set(INITIALS_KEY, name);
  }

  const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  function boardHtml(highlightId) {
    const b = sortBoard(loadBoard());
    if (!b.length) return '<p class="board-empty">No scores yet — finish a game to get on the board!</p>';
    return '<ol class="board-list">' + b.map((e, i) => `
      <li class="${e.id === highlightId ? 'me' : ''}">
        <span class="rk">${i + 1}</span>
        <span class="nm">${esc(e.name)}</span>
        <span class="sc">${e.score.toLocaleString()}</span>
        <span class="tl">${fmt(e.tile || 2)}</span>
      </li>`).join('') + '</ol>';
  }

  function showScoreboard(from) {
    if (busy) return;
    showOverlay(`
      <h2>🏆 Scoreboard</h2>
      ${boardHtml(null)}
      <button class="primary" id="closeBtn">Close</button>`, '', { close: hideOverlay, back: from === 'help' ? showHelp : null });
    $('closeBtn').onclick = hideOverlay;
  }

  function gameOver() {
    if (levelish()) return levelLost('No room left');
    over = true;
    tool = null; sel = null;
    save();
    const rank = rankFor(score);
    const already = loadBoard().some(e => e.id === gameId);
    renderGameOver(rank > 0 && !already ? 'enter' : 'board', rank);
    // continuing after saving: keep the saved entry up to date automatically
    if (already && rank > 0) {
      const e = loadBoard().find(x => x.id === gameId);
      if (e && score > e.score) { addToBoard(e.name); renderGameOver('board', rank); }
    }
  }

  function renderGameOver(view, rank) {
    const canUndo = snap && coins - lastEarned >= priceOf('undo');
    const canHammer = freeUses.hammer === 0 && coins >= COST.hammer;
    const canRescue = mode === 'endless' && (!rescueUsed || freeUses.hammer > 0) && countTiles() > 0;
    const entry = view === 'enter' ? `
      <div class="newhs">NEW HIGH SCORE — RANK #${rank}!</div>
      <p>Enter your initials</p>
      <input id="initials" class="initials" maxlength="3" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" value="${esc(store.get(INITIALS_KEY) || '')}" aria-label="Your 3 initials">
      <button class="primary" id="saveScore">Save score</button>` : boardHtml(gameId);
    showOverlay(`
      <h2>Board full!</h2>
      <div class="big">${score.toLocaleString()}</div>
      <p>Biggest tile: <b>${fmt(maxV)}</b> · Coins: <span class="coin"></span> <b>${coins.toLocaleString()}</b></p>
      ${entry}
      ${canRescue ? `<button class="primary" id="goRescue">🎁 Free Hammer — once per game</button>` : ''}
      ${canUndo || canHammer ? `<p>Keep going with a helper?</p><div class="row">
        ${canUndo ? `<button id="goUndo">↶ Undo <span class="coin"></span> ${COST.undo}</button>` : ''}
        ${canHammer ? `<button id="goHammer">🔨 Hammer <span class="coin"></span> ${COST.hammer}</button>` : ''}
      </div>` : ''}
      <div class="row"><button class="${view === 'enter' ? '' : 'primary'}" id="againBtn">Play again</button><button id="homeBtn2">🏠 Home</button></div>`, '', { close: view === 'enter' ? null : showHome });
    $('againBtn').onclick = newGame;
    $('homeBtn2').onclick = showHome;
    if (canUndo) $('goUndo').onclick = undo;
    if (canHammer) $('goHammer').onclick = () => { over = false; toggleTool('hammer'); };
    if (canRescue) $('goRescue').onclick = () => { if (!rescueUsed) { rescueUsed = true; freeUses.hammer++; } over = false; toggleTool('hammer'); };
    if (view === 'enter') {
      const inp = $('initials'), btn = $('saveScore');
      const sync = () => {
        const v = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
        if (inp.value !== v) inp.value = v;
        btn.disabled = v.length !== 3;
      };
      const submit = () => {
        sync();
        if (inp.value.length !== 3) { inp.focus(); return; }
        addToBoard(inp.value);
        renderGameOver('board', rank);
      };
      inp.addEventListener('input', sync);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      btn.onclick = submit;
      sync();
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 50);
    }
  }

      <div class="row"><button id="boardBtn">🏆 Scoreboard</button><button class="primary" id="closeBtn">Got it</button></div>`, '', { close: hideOverlay });
    $('closeBtn').onclick = hideOverlay;
    $('boardBtn').onclick = () => showScoreboard('help');
  }

  // close: what ✕ (and Escape) does; back: what ‹ does, for screens opened from another one.
  let overlayClose = null;
  function showOverlay(html, cls = '', { close = null, back = null } = {}) {
    $('card').className = 'card' + (cls ? ' ' + cls : '');
    $('card').innerHTML = html;
    $('card').scrollTop = 0;
    overlayClose = close;
    $('xBtn').classList.toggle('show', !!close);
    $('xBtn').onclick = close;
    $('backBtn').classList.toggle('show', !!back);
    $('backBtn').onclick = back;
    $('overlay').classList.add('show');
  }
  function hideOverlay() { $('overlay').classList.remove('show'); overlayClose = null; }
  const closeToHome = () => { hideOverlay(); if (homeOpen()) showHome(); };

  // ---------- rendering ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Look of a block by tier: face gradient, base lip, rim, text colours, extras.
  const styleCache = new Map();
  const WILD_STYLE = { top: '#ff8fd0', bot: '#7c5cff', lip: '#3b1d7a', stroke: '#3b1d7a',
    gloss: 0.26, glow: '#f0abfc', rim: 'rainbow', rimW: 0.05, shimmer: true };
  function tileStyle(v) {
    if (v === WILD) return WILD_STYLE;
    if (styleCache.has(v)) return styleCache.get(v);
    const e = log2(v), t = tierOfE(e);
    let st;
    if (t === 0) {
      const c = colorOf(v);
      st = { top: shade(c, 0.16), bot: shade(c, -0.06), lip: shade(c, -0.42), stroke: shade(c, -0.6),
        gloss: 0.13, glow: v >= 2048 ? c : null, rim: null, shimmer: false };
    } else if (t === 1 || t === 2) {
      const [h, s0, l0] = baseHsl(e, t);
      // brighter versions of the same muted hues, soft champagne rim; M adds a shine
      const s = s0 + 14 * t, l = l0 + (t === 1 ? 7 : 11);
      st = { top: hsl(h, s, l + 8), bot: hsl(h + (t === 2 ? 10 : 0), s, l - 4), lip: hsl(h, s - 10, l - 26),
        stroke: hsl(h, s - 15, l - 38), gloss: 0.2, glow: hsl(h, s, l),
        rim: t === 1 ? ['rgba(255,244,214,.75)', 'rgba(232,206,150,.55)'] : ['#fff6dd', '#e9cf8f', '#b89452'],
        rimW: t === 1 ? 0.018 : 0.028, shimmer: t === 2 };
    } else {
      st = { top: '#3b1f63', bot: '#120b22', lip: '#07040f', stroke: '#2a1700',
        gloss: 0.16, glow: '#a78bfa', rim: 'rainbow', rimW: 0.045, shimmer: true, inf: true };
    }
    styleCache.set(v, st);
    return st;
  }

  // Same look for the small DOM "Next" preview.
  function tileCss(v) {
    const st = tileStyle(v);
    const border = st.rim === 'rainbow' ? '2px solid #f472b6' : st.rim ? `2px solid ${st.rim[1]}` : '0';
    return { bg: `linear-gradient(180deg, ${st.top}, ${st.bot})`, fg: st.inf ? '#fde68a' : '#fff', border };
  }

  // A grey boulder block with pebbles; a cracked one shows a jagged split.
  function drawStone(v, x, y, sx, sy, alpha) {
    const pad = cell * 0.035;
    const w = (cell - pad * 2) * Math.max(0.05, sx), h = (cell - pad * 2) * Math.max(0.05, sy);
    const cx = x + cell / 2, cy = y + cell / 2, left = cx - w / 2, top = cy - h / 2;
    const lip = h * 0.11, rad = Math.min(w, h) * 0.2;
    ctx.save();
    ctx.globalAlpha = alpha;
    rr(left, top, w, h, rad);
    ctx.fillStyle = '#4b4350';
    ctx.fill();
    const g = ctx.createLinearGradient(0, top, 0, top + h - lip);
    g.addColorStop(0, v === CRACKED ? '#a79c90' : '#b9afa2');
    g.addColorStop(1, v === CRACKED ? '#7c7268' : '#8a8076');
    rr(left, top, w, h - lip, rad);
    ctx.fillStyle = g;
    ctx.fill();
    rr(left + w * 0.08, top + h * 0.06, w * 0.84, (h - lip) * 0.3, rad * 0.8);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.fillStyle = 'rgba(70,60,66,0.35)';      // pebbles
    for (const [px, py, pr] of [[0.28, 0.62, 0.07], [0.7, 0.36, 0.06], [0.62, 0.7, 0.045], [0.36, 0.3, 0.04]]) {
      ctx.beginPath(); ctx.arc(left + w * px, top + (h - lip) * py, Math.min(w, h) * pr, 0, Math.PI * 2); ctx.fill();
    }
    if (v === CRACKED) {
      ctx.strokeStyle = '#2b2430';
      ctx.lineWidth = Math.max(1.5, cell * 0.04);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.beginPath();
      const P = (px, py) => [left + w * px, top + (h - lip) * py];
      ctx.moveTo(...P(0.48, 0.02)); ctx.lineTo(...P(0.4, 0.3)); ctx.lineTo(...P(0.56, 0.48));
      ctx.lineTo(...P(0.44, 0.72)); ctx.lineTo(...P(0.52, 0.98));
      ctx.moveTo(...P(0.56, 0.48)); ctx.lineTo(...P(0.82, 0.58));
      ctx.moveTo(...P(0.4, 0.3)); ctx.lineTo(...P(0.18, 0.22));
      ctx.stroke();
    }
    ctx.restore();
  }

  // Eyes and a smile in the lower half of a tile (Tile Buddies cosmetic).
  function drawFace(cx, top, w, h, st) {
    const ey = top + h * 0.74, er = w * 0.085;
    const blink = (Math.floor(nowMs / 100) + Math.floor(cx)) % 47 === 0;
    for (const sx of [-1, 1]) {
      const ex = cx + sx * w * 0.27;
      if (blink) {
        ctx.fillStyle = st.stroke;
        ctx.fillRect(ex - er, ey - er * 0.15, er * 2, er * 0.3);
        continue;
      }
      ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex + er * 0.15, ey + er * 0.15, er * 0.6, 0, Math.PI * 2); ctx.fillStyle = '#1d1340'; ctx.fill();
      ctx.beginPath(); ctx.arc(ex - er * 0.2, ey - er * 0.25, er * 0.25, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(cx, ey - w * 0.02, w * 0.09, Math.PI * 0.15, Math.PI * 0.85);
    ctx.lineWidth = Math.max(1.5, w * 0.035); ctx.lineCap = 'round';
    ctx.strokeStyle = st.stroke; ctx.stroke();
  }

  // A sheet of ice over a frozen block: pale blue glaze, frost streaks, a flake.
  function drawIce(x, y, sx, sy, alpha) {
    const pad = cell * 0.02;
    const w = (cell - pad * 2) * Math.max(0.05, sx), h = (cell - pad * 2) * Math.max(0.05, sy);
    const left = x + cell / 2 - w / 2, top = y + cell / 2 - h / 2, rad = Math.min(w, h) * 0.16;
    ctx.save();
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(left, top, left + w, top + h);
    g.addColorStop(0, 'rgba(225,245,255,0.72)');
    g.addColorStop(0.5, 'rgba(160,215,255,0.5)');
    g.addColorStop(1, 'rgba(200,235,255,0.68)');
    rr(left, top, w, h, rad);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(1.5, cell * 0.035);
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';   // frost streaks
    ctx.lineWidth = Math.max(1, cell * 0.02); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(left + w * 0.14, top + h * 0.3); ctx.lineTo(left + w * 0.34, top + h * 0.12);
    ctx.moveTo(left + w * 0.12, top + h * 0.5); ctx.lineTo(left + w * 0.5, top + h * 0.14);
    ctx.moveTo(left + w * 0.66, top + h * 0.9); ctx.lineTo(left + w * 0.88, top + h * 0.66);
    ctx.stroke();
    ctx.font = `${cell * 0.24}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('❄️', left + w * 0.82, top + h * 0.18);
    ctx.restore();
  }

  let nowMs = 0;
  function drawTile(v, x, y, sx, sy, alpha, round = 0, noText = false) {
    if (isFrozen(v)) { drawTile(thawed(v), x, y, sx, sy, alpha, round, noText); drawIce(x, y, sx, sy, alpha); return; }
    if (v < 0) { drawStone(v, x, y, sx, sy, alpha); return; }
    const st = tileStyle(v);
    const pad = cell * 0.035;
    const w = (cell - pad * 2) * Math.max(0.05, sx), h = (cell - pad * 2) * Math.max(0.05, sy);
    const cx = x + cell / 2, cy = y + cell / 2;
    const left = cx - w / 2, top = cy - h / 2;
    const lip = h * 0.11 * (1 - round * 0.6), rad = Math.min(w, h) * (0.13 + 0.37 * round);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (st.glow) {
      ctx.shadowColor = st.glow;
      ctx.shadowBlur = cell * (st.inf ? 0.45 + 0.15 * Math.sin(nowMs / 300) : 0.3);
    }
    rr(left, top, w, h, rad);
    ctx.fillStyle = st.lip;
    ctx.fill();
    ctx.shadowBlur = 0;
    const g = ctx.createLinearGradient(0, top, 0, top + h - lip);
    g.addColorStop(0, st.top);
    g.addColorStop(1, st.bot);
    rr(left, top, w, h - lip, rad);
    ctx.fillStyle = g;
    ctx.fill();
    rr(left + w * 0.06, top + h * 0.05, w * 0.88, (h - lip) * 0.36, rad * 0.8);
    ctx.fillStyle = `rgba(255,255,255,${st.gloss})`;
    ctx.fill();
    if (st.shimmer) {                       // light sweeping across premium blocks
      ctx.save();
      rr(left, top, w, h - lip, rad);
      ctx.clip();
      const ph = ((nowMs / 1700 + (log2(v) % 7) * 0.13) % 1.6) - 0.3;
      const sx0 = left + w * ph;
      const sg = ctx.createLinearGradient(sx0 - w * 0.3, top, sx0 + w * 0.3, top + h);
      sg.addColorStop(0, 'rgba(255,255,255,0)');
      sg.addColorStop(0.5, 'rgba(255,255,255,0.28)');
      sg.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = sg;
      ctx.fillRect(left, top, w, h);
      ctx.restore();
    }
    if (st.rim) {                           // metallic / rainbow rim on higher tiers
      const rw = Math.max(1.5, cell * st.rimW);
      let rs;
      if (st.rim === 'rainbow') {
        rs = ctx.createLinearGradient(left, top, left + w, top + h);
        const off = (nowMs / 2000) % 1;
        ['#f472b6', '#facc15', '#4ade80', '#22d3ee', '#a78bfa', '#f472b6'].forEach((c, k) =>
          rs.addColorStop((k / 5 + off) % 1, c));
      } else {
        rs = ctx.createLinearGradient(left, top, left + w * 0.4, top + h);
        st.rim.forEach((c, k) => rs.addColorStop(k / (st.rim.length - 1), c));
      }
      rr(left + rw / 2, top + rw / 2, w - rw, h - rw, Math.max(1, rad - rw / 2));
      ctx.lineWidth = rw;
      ctx.strokeStyle = rs;
      ctx.stroke();
    }

    if (noText) { ctx.restore(); return; }
    const text = fmt(v);
    const len = text.length;
    const face = look.faces && v > WILD;   // Tile Buddies: number up top, a face below
    let fs = Math.min(w, h) * (st.inf ? 0.72 : len <= 2 ? 0.5 : len === 3 ? 0.42 : len === 4 ? 0.34 : 0.28) * (face ? 0.8 : 1);
    ctx.font = `900 ${fs}px ${FONT}`;
    const maxW = w * 0.86, tw = ctx.measureText(text).width;
    if (tw > maxW) { fs *= maxW / tw; ctx.font = `900 ${fs}px ${FONT}`; }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    const ty = face ? top + (h - lip) * 0.36 : top + (h - lip) / 2 + fs * 0.04;
    if (face) drawFace(cx, top, w, h - lip, st);
    ctx.lineWidth = fs * 0.22;
    ctx.strokeStyle = st.stroke;
    ctx.strokeText(text, cx, ty + fs * 0.07);   // drop shadow
    ctx.strokeText(text, cx, ty);
    if (st.inf) {                           // gold lettering on the ∞ block
      const tg = ctx.createLinearGradient(0, ty - fs / 2, 0, ty + fs / 2);
      tg.addColorStop(0, '#fff7d1'); tg.addColorStop(0.5, '#fcd34d'); tg.addColorStop(1, '#d99a12');
      ctx.fillStyle = tg;
    } else ctx.fillStyle = '#ffffff';
    ctx.fillText(text, cx, ty);
    ctx.restore();
  }

  // Squash/stretch scale for a tile from its wobble, flight and pop state.
  function tileScale(t) {
    let f = 0;
    if (t.wob) f = t.wob.amp * Math.exp(-7 * t.wob.t) * Math.cos(22 * t.wob.t);
    let st = 0;
    if (t.fly) { const p = Math.min(1, t.fly.t / t.fly.dur); st = t.fly.stretch * p; }
    return [t.s * (1 + f) * (1 - st * 0.45), t.s * (1 - f) * (1 + st)];
  }
  function drawT(t) {
    const [sx, sy] = tileScale(t);
    let round = 0;
    if (t.mt) { const p = Math.min(1, t.mt.t / t.mt.dur); round = Math.sin(Math.PI * p) * 0.85; }
    drawTile(t.show || t.v, t.x, t.y, sx, sy, 1, round);
  }

  // Moves a tile toward its slot. Vertical moves are flights that start slow and
  // speed up (ease-in) and end with a squash; sideways moves just glide.
  function stepTile(t, tx, ty, dt, k, ks) {
    if (t.ty == null) { t.ty = ty; }
    if (Math.abs(ty - t.ty) > 0.5) {
      const dist = Math.abs(ty - t.y) / cell;
      t.fly = { y0: t.y, y1: ty, t: 0, dur: 0.09 + 0.05 * dist, land: 0.12, stretch: 0.08 };
      t.ty = ty;
    }
    if (t.fly) {
      t.fly.t += dt;
      const p = Math.min(1, t.fly.t / t.fly.dur);
      t.y = t.fly.y0 + (t.fly.y1 - t.fly.y0) * p * p * p;
      if (p >= 1) {
        t.y = t.fly.y1;
        if (t.fly.land) t.wob = { amp: t.fly.land, t: 0 };
        t.fly = null;
      }
    } else {
      t.y += (ty - t.y) * k;
    }
    t.x += (tx - t.x) * k;
    t.s += (1 - t.s) * ks;
    if (t.wob) { t.wob.t += dt; if (t.wob.t > 1.2) t.wob = null; }
    if (t.mt) { t.mt.t += dt; if (t.mt.t > t.mt.dur) t.mt = null; }
  }

  // The gooey bridge between two merging bubbles.
  function drawNeck(x1, y1, x2, y2, w1, w2, neck, color) {
    const dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy) || 1;
    const nx = -dy / d, ny = dx / d;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    ctx.beginPath();
    ctx.moveTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
    ctx.quadraticCurveTo(mx + nx * neck / 2, my + ny * neck / 2, x2 + nx * w2 / 2, y2 + ny * w2 / 2);
    ctx.lineTo(x2 - nx * w2 / 2, y2 - ny * w2 / 2);
    ctx.quadraticCurveTo(mx - nx * neck / 2, my - ny * neck / 2, x1 - nx * w1 / 2, y1 - ny * w1 / 2);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.max(0, Math.min(0.05, (now - last) / 1000));
    last = now;
    const k = 1 - Math.exp(-dt * 20);
    const ks = 1 - Math.exp(-dt * 14);

    if (Math.abs(wrap.clientWidth - W) > 1 || Math.abs(wrap.clientHeight - H) > 1 ||
        (window.devicePixelRatio || 1) !== dpr) onResize();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    stepCoins(now);
    nowMs = now;

    // board background and lanes
    rr(bx - 6, by - 6, cell * cols + 12, cell * rows + 12, 16);
    ctx.fillStyle = skin.board[0];
    const boardTier = levelish() && lv ? levelTier(levelDef()) : null;
    if (boardTier) {                  // Hard / Super Hard: a glowing coloured frame
      ctx.save();
      ctx.shadowColor = boardTier.frame; ctx.shadowBlur = 14 + 4 * Math.sin(now / 400);
      ctx.fill();
      ctx.restore();
      ctx.lineWidth = 3; ctx.strokeStyle = boardTier.frame; ctx.stroke();
    }
    ctx.fill();
    for (let c = 0; c < cols; c++) {
      let off = 0;
      if (shake && shake.c === c) off = Math.sin(shake.t * 60) * 5 * (shake.t / 0.35);
      const n = count(c);
      ctx.fillStyle = n >= rows - 1 && rows >= 5 ? '#3a2335'   // nearly-full warning on taller boards
        : c === aim && !over && !tool ? skin.board[2] : skin.board[1];
      rr(cellX(c) + 2 + off, by, cell - 4, cell * rows, 10);
      ctx.fill();
    }
    if (shake) { shake.t -= dt; if (shake.t <= 0) shake = null; }

    // landing preview: dashed outline where the shot will land
    if (!over && !busy && !tool && shooter) {
      const lr = landingRow(aim, cur);
      if (lr >= 0 && count(aim) < rows) {
        ctx.save();
        ctx.setLineDash([cell * 0.09, cell * 0.06]);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'rgba(255,255,255,0.75)';
        rr(cellX(aim) + cell * 0.06, cellY(lr) + cell * 0.06, cell * 0.88, cell * 0.88, cell * 0.1);
        ctx.stroke();
        ctx.restore();
      }
    }

    // gooey necks + tiles being absorbed / cleared
    ghosts = ghosts.filter(g => (g.kind === 'absorb' ? g.t < g.dur : g.a > 0));
    for (const g of ghosts) {
      if (g.kind !== 'absorb') continue;
      g.t += dt;
      const p = clamp(g.t / g.dur, 0, 1);
      const e = p * p;                 // ease-in: slow start, then sucked in fast
      g.x = g.x0 + (g.target.x - g.x0) * e;
      g.y = g.y0 + (g.target.y - g.y0) * e;
      g.sc = 1 - 0.5 * e;
      if (g.t < 0) continue;           // still waiting its turn
      drawNeck(g.x + cell / 2, g.y + cell / 2, g.target.x + cell / 2, g.target.y + cell / 2,
        cell * 0.8 * g.sc, cell * 0.8, cell * (0.38 + 0.45 * e), shade(colorOf(g.v), -0.02));
    }
    for (const g of ghosts) {
      if (g.kind === 'absorb') drawTile(g.v, g.x, g.y, g.sc * (1 + 0.12 * (1 - g.sc)), g.sc, 1, Math.min(1, (1 - g.sc) * 3), g.t / g.dur > 0.45);
      else {
        g.x += (g.tx - g.x) * k;
        g.y += (g.ty - g.y) * k;
        g.a -= dt * 4.5;
        drawTile(g.v, g.x, g.y, 0.9, 0.9, clamp(g.a, 0, 1));
      }
    }

    // shots heading into a full column
    for (const f of flyers) { stepTile(f, f.x, f.ty, dt, k, ks); emitTrail(f); drawT(f); }

    // board tiles
    if (grid) for (let c = 0; c < cols; c++)
      for (let r = 0; r < rows; r++) {
        const t = grid[c][r];
        if (!t) continue;
        stepTile(t, cellX(c), cellY(r), dt, k, ks);
        emitTrail(t);
        drawT(t);
        if (tool && !busy) {
          const isSel = sel && sel[0] === c && sel[1] === r;
          const pulse = 0.5 + 0.5 * Math.sin(now / 160);
          rr(t.x + cell * 0.03, t.y + cell * 0.03, cell * 0.94, cell * 0.94, cell * 0.14);
          ctx.lineWidth = isSel ? 4 : 2.5;
          ctx.strokeStyle = isSel ? '#ffffff'
            : tool === 'hammer' ? `rgba(255,111,111,${0.35 + 0.5 * pulse})`
            : `rgba(255,211,77,${0.3 + 0.45 * pulse})`;
          ctx.stroke();
        }
      }

    // merge bubbles
    bubbles = bubbles.filter(b => b.life > 0);
    for (const b of bubbles) {
      b.life -= dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.vx *= 1 - dt * 3;
      if (b.trail) b.vy *= 1 - dt * 4;
      else if (b.shape === 'confetti') b.vy = b.vy * (1 - dt * 3) + cell * dt * 2.2;   // flutters down
      else b.vy = b.vy * (1 - dt * 3) - cell * dt * 1.5;                              // floats up
      const a = clamp(b.life * 2.2, 0, 1);
      if (b.shape) { b.rot += b.spin * dt; drawParticle(b, a); continue; }
      ctx.save();
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = b.col; ctx.globalAlpha = a * 0.45; ctx.fill();
      ctx.globalAlpha = a; ctx.lineWidth = Math.max(1, b.r * 0.22); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.restore();
    }

    // launcher: a row of slots with arrows; the tile sits in the aimed slot
    const ly = launchY();
    const sp = cell * 0.035;
    for (let c = 0; c < cols; c++) {
      const x = cellX(c);
      rr(x + sp, ly + sp, cell - sp * 2, cell - sp * 2, cell * 0.12);
      ctx.fillStyle = '#17142b';
      ctx.fill();
      rr(x + sp, ly + sp, cell - sp * 2, cell - sp * 2 - cell * 0.09, cell * 0.12);
      ctx.fillStyle = c === aim && !over && !tool ? '#2f2a4d' : '#25213c';
      ctx.fill();
      if (c !== aim || over || !shooter || busy) {
        const ax = x + cell / 2, ay = ly + cell * 0.44, as = cell * 0.09;
        ctx.beginPath();
        ctx.moveTo(ax, ay - as); ctx.lineTo(ax + as * 1.2, ay + as * 0.7); ctx.lineTo(ax - as * 1.2, ay + as * 0.7);
        ctx.closePath();
        ctx.fillStyle = c === aim && !over ? 'rgba(255,255,255,0.6)' : 'rgba(255,255,255,0.22)';
        ctx.fill();
      }
    }
    if (shooter && !over) {
      shooter.x += (cellX(aim) - shooter.x) * k;
      shooter.y += (ly - shooter.y) * k;
      shooter.s += (1 - shooter.s) * ks;
      if (shooter.wob) { shooter.wob.t += dt; if (shooter.wob.t > 1.2) shooter.wob = null; }
      drawT(shooter);
    }
    // tutorial hand: points at the column to shoot on a level's first move
    if (levelish() && lv && lv.used === 0 && levelDef().hint !== undefined && !over &&
        !$('overlay').classList.contains('show')) {
      const hx = cellX(levelDef().hint) + cell / 2, bob = Math.sin(now / 220) * cell * 0.08;
      ctx.save();
      ctx.font = `${cell * 0.55}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👆', hx + cell * 0.1, ly + cell * 1.15 + bob);
      ctx.restore();
    }

    // floating score text
    floaters = floaters.filter(f => f.life > 0);
    for (const f of floaters) {
      f.life -= dt * 1.4;
      if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; }
      else f.y -= dt * cell * 0.9;
      ctx.save();
      ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
      ctx.fillStyle = f.color || '#ffffff';
      ctx.font = `800 ${cell * 0.3}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }

    // combo praise: bigger combos get bigger, longer, wobblier text
    if (praise) {
      praise.life -= dt;
      praise.s += (1 - praise.s) * (1 - Math.exp(-dt * 12));
      const a = clamp(praise.life * 2.5, 0, 1);
      const cx = bx + cell * cols / 2;
      const cy = by + cell * rows * 0.42;
      const size = Math.min(cell * (0.55 + praise.tier * 0.06), W / (praise.text.length * 0.62));
      ctx.save();
      ctx.globalAlpha = a;
      ctx.translate(cx, cy);
      ctx.rotate(Math.sin(now / 90) * 0.02 * praise.tier);
      ctx.scale(praise.s, praise.s);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `400 ${size}px "Lilita One", "Fredoka", system-ui, sans-serif`;
      ctx.lineJoin = 'round';
      ctx.lineWidth = size * 0.16;
      ctx.strokeStyle = '#14112a';
      ctx.strokeText(praise.text, 0, 0);
      if (praise.tier >= 4) { ctx.shadowColor = praise.color; ctx.shadowBlur = size * 0.5; }
      ctx.fillStyle = praise.color;
      ctx.fillText(praise.text, 0, 0);
      ctx.shadowBlur = 0;
      // coin line
      const fs = size * 0.36;
      ctx.font = `800 ${fs}px system-ui, sans-serif`;
      const sub = praise.sub;
      const tw = ctx.measureText(sub).width;
      const sy = size * 0.75;
      ctx.lineWidth = fs * 0.25;
      ctx.strokeText(sub, -fs * 0.6, sy);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(sub, -fs * 0.6, sy);
      const coinX = -fs * 0.6 + tw / 2 + fs * 0.7;
      const g = ctx.createRadialGradient(coinX - fs * 0.15, sy - fs * 0.15, 1, coinX, sy, fs * 0.45);
      g.addColorStop(0, '#fff3b0'); g.addColorStop(0.55, '#ffc93c'); g.addColorStop(1, '#d99a12');
      ctx.beginPath(); ctx.arc(coinX, sy, fs * 0.42, 0, Math.PI * 2);
      ctx.fillStyle = g; ctx.fill();
      ctx.restore();
      if (praise.life <= 0) praise = null;
    }

    // banner (level-up, undo, ∞ messages)
    if (banner) {
      banner.life -= dt;
      const a = clamp(banner.life * 2, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      const bh = cell * 0.7;
      const bY = by + cell * rows / 2 - bh / 2;
      rr(bx + 8, bY, cell * cols - 16, bh, 12);
      ctx.fillStyle = 'rgba(255,211,77,0.95)';
      ctx.fill();
      ctx.fillStyle = '#1a1533';
      let bfs = Math.min(cell * 0.26, 18);
      ctx.font = `800 ${bfs}px system-ui, sans-serif`;
      const room = cell * cols - 40, bw = ctx.measureText(banner.text).width;
      if (bw > room) { bfs *= room / bw; ctx.font = `800 ${bfs}px system-ui, sans-serif`; }   // long text: shrink to fit
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(banner.text, bx + cell * cols / 2, bY + bh / 2);
      ctx.restore();
      if (banner.life <= 0) banner = null;
    }

    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function colAt(clientX) {
    const r = cv.getBoundingClientRect();
    const c = Math.floor((clientX - r.left - bx) / cell);
    return c >= 0 && c < cols ? c : -1;
  }
  function rowAt(clientY) {
    const r = Math.floor((clientY - cv.getBoundingClientRect().top - by) / cell);
    return r >= 0 && r < rows ? r : -1;
  }
  const aimAt = e => {
    const c = colAt(e.clientX);
    if (c >= 0 && !busy) aim = c;
  };
  cv.addEventListener('pointermove', aimAt);
  cv.addEventListener('pointerdown', aimAt);
  cv.addEventListener('pointerup', e => {
    const c = colAt(e.clientX);
    if (c < 0) return;
    if (tool) {
      const r = rowAt(e.clientY);
      if (r >= 0) useToolAt(c, r);
      return;
    }
    fire(c);
  });

  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (homeOpen() && !$('overlay').classList.contains('show')) return;
    if ($('overlay').classList.contains('show')) {
      if (e.key === 'Escape' && overlayClose) { e.preventDefault(); overlayClose(); return; }
      if (e.key === 'Enter' || e.key === 'Escape' || e.key === ' ') {
        e.preventDefault();
        if (!over) hideOverlay();
        else if (mode === 'daily') startDaily();
        else if (mode === 'level') startLevel(lv.result === 'won' && lv.n < LEVELS.length ? lv.n + 1 : lv.n);
        else newGame();
      }
      return;
    }
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); undo(); return; }
    if (k === 'escape') { if (tool) toggleTool(tool); return; }
    if (k === 'u') { undo(); return; }
    if (k === 'h') { toggleTool('hammer'); return; }
    if (tool) return;
    if (k === 'arrowleft' || k === 'a') { if (!busy) aim = Math.max(0, aim - 1); }
    else if (k === 'arrowright' || k === 'd') { if (!busy) aim = Math.min(cols - 1, aim + 1); }
    else if (k === ' ' || k === 'arrowup' || k === 'enter' || k === 'w') { e.preventDefault(); fire(aim); }
    else if (k === 's' || k === 'arrowdown') { e.preventDefault(); swap(); }
    else if (k === 'n') confirmRestart();
    else if (k === 'm') showHome();
    else if (/^[1-9]$/.test(k) && +k <= cols) fire(+k - 1);
  });

  $('swapBtn').onclick = swap;
  $('restartBtn').onclick = confirmRestart;
  $('tSwap').onclick = () => toggleTool('swap');
  $('tHammer').onclick = () => toggleTool('hammer');
  $('tUndo').onclick = undo;
  $('homeBtn').onclick = showHome;
  $('helpBtn').onclick = showHelp;
  $('bestBox').onclick = () => (mode === 'level' ? showMap() : mode === 'daily' ? null : showScoreboard());
  $('overlay').addEventListener('click', e => { if (e.target.id === 'overlay' && !over) hideOverlay(); });

  // Re-measure whenever the play area changes size (rotation, entering full
  // screen / home-screen mode, browser bars appearing). Without this the canvas
  // keeps its old pixel size and gets stretched to the new shape.
  function onResize() {
    if (!layout()) return;
    fitStats();
    if (shooter) { shooter.x = cellX(aim); shooter.y = launchY(); }
    if (grid) for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const t = grid[c][r];
      if (t) { t.x = cellX(c); t.y = t.ty = cellY(r); t.fly = null; }
    }
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(wrap);

  // ---------- boot ----------
  layout();
  if (!load()) { mode = 'endless'; if (!load()) newGame(); }
  showHome();                      // every session starts on the home screen

  // Coming back after a long break (app left in the background) also lands on home.
  const AWAY_MS = 15 * 60 * 1000;
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > AWAY_MS && !homeOpen()) showHome();
  });
  requestAnimationFrame(frame);

  // installable / offline when served over http(s)
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }

  // exposed for automated testing only
  window.__mb = {
    fire, swap, newGame, undo, toggleTool, useToolAt, comboCoins, rollValue, startLevel, showMap, playEndless, LEVELS,
    showHome, resumeLevel, showMilestones, startDaily, dailyDef, todayKey, playDaily, showShop, applySkin,
    setCoins,
    state: () => ({ grid: gridValues(), cur, nxt, nxt2, score, over, busy, coins, tool, sel, snap: !!snap, maxV, infCount, minE, mode, lv, cols, rows, freeUses, inv: { ...inv } }),
  };
})();
</script>
</body>
</html>
