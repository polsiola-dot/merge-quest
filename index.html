<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Shoot number tiles, chain merges into combos, earn coins. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Merge Quest">
<meta name="theme-color" content="#14112a">
<title>Merge Quest</title>
<style>
  :root {
    --bg: #14112a;
    --panel: #221d40;
    --panel-2: #2c2652;
    --text: #f3f0ff;
    --muted: #a49dd0;
    --accent: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap: 10px;
  }
  header { display: flex; gap: 8px; align-items: stretch; }
  .stat {
    background: var(--panel);
    border-radius: 12px;
    padding: 6px 10px;
    flex: 1;
    text-align: center;
    min-width: 0;
  }
  .stat small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; display: inline-block; white-space: nowrap; }
  .stat { overflow: hidden; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  footer { display: flex; gap: 8px; align-items: center; }
  .next {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel); border-radius: 12px; padding: 6px 10px;
    font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase;
  }
  #nextTile, #nextTile2 {
    width: 38px; height: 38px; border-radius: 7px;
    display: grid; place-items: center; padding-bottom: 4px;
    font: 900 13px "Arial Rounded MT Bold", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif;
    color: #fff; letter-spacing: 0;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18);
    text-shadow: -1.5px -1.5px 0 #1a1533, 1.5px -1.5px 0 #1a1533, -1.5px 1.5px 0 #1a1533, 1.5px 1.5px 0 #1a1533, 0 2px 0 #1a1533;
  }
  #nextTile2 { width: 28px; height: 28px; opacity: .8; }
  button {
    font: inherit; font-weight: 700; color: var(--text);
    background: var(--panel-2); border: 0; border-radius: 12px;
    padding: 12px 14px; cursor: pointer; flex: 1; white-space: nowrap;
  }
  button:hover { filter: brightness(1.15); }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: #1a1533; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; }
  #overlay {
    position: fixed; inset: 0; display: none;
    background: rgba(10, 8, 24, .78);
    align-items: center; justify-content: center; padding: 16px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: var(--panel); border-radius: 18px; padding: 22px;
    width: 100%; max-width: 340px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100dvh - 32px); overflow-y: auto;
  }
  .newhs { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: .04em; }
  .initials {
    width: 100%; font: 900 34px "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    text-align: center; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase;
    background: #17142b; color: var(--text); border: 2px solid var(--panel-2);
    border-radius: 12px; padding: 8px 0; outline: none;
  }
  .initials:focus { border-color: var(--accent); }
  .initials { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .card { touch-action: pan-y; }
  .board-list { list-style: none; padding: 0; margin: 0; text-align: left; font-variant-numeric: tabular-nums; }
  .board-list li {
    display: grid; grid-template-columns: 28px 52px 1fr auto; gap: 8px; align-items: center;
    padding: 6px 10px; border-radius: 10px; font-size: 15px;
  }
  .board-list li:nth-child(odd) { background: rgba(255,255,255,.04); }
  .board-list li.me { background: rgba(255,211,77,.18); outline: 1px solid rgba(255,211,77,.6); }
  .board-list .rk { color: var(--muted); font-weight: 700; }
  .board-list .nm { font-weight: 900; letter-spacing: .12em; }
  .board-list .sc { font-weight: 800; text-align: right; }
  .board-list .tl { color: var(--muted); font-size: 12px; text-align: right; }
  .board-empty { color: var(--muted); font-size: 14px; }
  #bestBox { cursor: pointer; }
  .goal { color: var(--text); font-weight: 700; }
  .goal b { color: var(--accent); }
  .lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv {
    aspect-ratio: 1; padding: 0; border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-size: 17px; font-weight: 800;
    background: var(--panel-2); position: relative;
  }
  .lv .st { font-size: 10px; letter-spacing: 1px; color: var(--accent); min-height: 12px; }
  .lv.next { background: var(--accent); color: #1a1533; }
  .lv.next .st { color: #1a1533; }
  .lv.hard::after { content: 'HARD'; position: absolute; top: -6px; right: -4px; font-size: 8px;
    background: #e5484d; color: #fff; border-radius: 6px; padding: 1px 4px; letter-spacing: .05em; }
  .stars { font-size: 34px; letter-spacing: 6px; color: var(--accent); }
  .stars .off { color: #4a4470; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  #infBox { flex: 0 0 auto; min-width: 58px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #infBox b { font-size: 15px; color: var(--accent); }
  #infBox b::before { content: '×'; font-size: 12px; opacity: .8; margin-right: 1px; }
  .infIcon {
    width: 30px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    font: 900 20px/1 system-ui, sans-serif; color: #fde68a; text-shadow: 0 1px 0 #3b1d02;
    background: linear-gradient(160deg, #2a1745, #140f24);
    box-shadow: 0 0 0 2px #f472b6, 0 0 0 3px #22d3ee, 0 0 10px rgba(167,139,250,.6);
  }
  #infBox.pop { animation: infPop .7s ease-out; }
  @keyframes infPop { 30% { transform: scale(1.25); } to { transform: scale(1); } }
  .card h2 { font-size: 26px; }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .card .big { font-size: 40px; font-weight: 800; color: var(--accent); }
  .card ul { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.5; padding-left: 18px; }
  .card .row { display: flex; gap: 8px; }
  .card .row button { padding: 10px 6px; font-size: 15px; min-width: 0; }
  .coin {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc93c 55%, #d99a12);
    box-shadow: inset 0 0 0 1.5px #b07a08; vertical-align: -2px;
  }
  .tools { display: flex; gap: 8px; align-items: stretch; }
  .wallet {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border-radius: 12px; padding: 0 12px;
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
    min-width: 86px; justify-content: center; transition: transform .15s;
  }
  .wallet.bump { transform: scale(1.15); }
  .wallet { position: relative; }
  #coinLayer { position: fixed; inset: 0; pointer-events: none; z-index: 11; overflow: hidden; }
  .fcoin {
    position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    border-radius: 50%; will-change: transform;
    background: radial-gradient(circle at 35% 30%, #fff6c4, #ffd047 45%, #e0a015 80%, #b07a08);
    box-shadow: inset 0 0 0 2px rgba(176,122,8,.9), inset 0 0 0 5px rgba(255,236,150,.55), 0 2px 6px rgba(0,0,0,.35);
  }
  .fcoin::after {
    content: ''; position: absolute; inset: 7px; border-radius: 50%;
    border: 2px solid rgba(176,122,8,.55);
  }
  .coin-plus {
    position: absolute; left: 50%; top: -6px; transform: translate(-50%, 0);
    color: var(--accent); font-weight: 900; font-size: 16px; white-space: nowrap;
    text-shadow: 0 2px 0 #1a1533, 0 0 8px rgba(255,211,77,.6);
    animation: coinPlus 1s ease-out forwards; pointer-events: none;
  }
  @keyframes coinPlus { from { opacity: 0; transform: translate(-50%, 6px) scale(.7); }
    20% { opacity: 1; transform: translate(-50%, -8px) scale(1.15); }
    to { opacity: 0; transform: translate(-50%, -30px) scale(1); } }
  .sparkle {
    position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: #fff3b0; box-shadow: 0 0 6px #ffd34d; pointer-events: none;
  }
  .wallet .coin { width: 18px; height: 18px; }
  .tool { padding: 7px 6px; line-height: 1.15; }
  .tool .ic { font-size: 18px; display: block; }
  .tool .nm { font-size: 12px; display: block; }
  .tool .pr { font-size: 11px; color: var(--accent); display: block; }
  .tool.active { background: var(--accent); color: #1a1533; }
  .tool.active .pr { color: #1a1533; }
  .tool:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }
  #homeBtn { flex: 0 0 auto; padding: 0 14px; font-size: 22px; background: var(--panel); }
  /* ---------- home screen ---------- */
  #home {
    position: fixed; inset: 0; z-index: 9; display: none; overflow-y: auto;
    background: radial-gradient(120% 70% at 50% 0%, #2e2560 0%, var(--bg) 60%);
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    touch-action: pan-y;
  }
  #home.show { display: block; }
  .home-in { max-width: 420px; min-height: 100%; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .logo { text-align: center; padding: 10px 0 2px; }
  .logo .tiles { display: flex; justify-content: center; gap: 6px; margin-bottom: 10px; }
  .logo .tiles span {
    width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center;
    font: 900 17px "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; color: #fff;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.2);
    text-shadow: 0 2px 0 #1a1533; animation: bob 2.4s ease-in-out infinite;
  }
  .logo .tiles span:nth-child(2) { animation-delay: .2s; }
  .logo .tiles span:nth-child(3) { animation-delay: .4s; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .logo h1 { font-size: 38px; font-weight: 900; letter-spacing: .04em; line-height: 1; }
  .logo h1 span { color: var(--accent); }
  .chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .chip { background: var(--panel); border-radius: 99px; padding: 6px 12px; font-weight: 800; font-size: 15px;
    display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
  .chip.hot { background: #4a2416; color: #ffb27a; }
  .mode {
    background: var(--panel); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
    border: 1px solid rgba(255,255,255,.06);
  }
  .mode.main { background: linear-gradient(160deg, #3a2f74, var(--panel)); border-color: rgba(255,211,77,.35); }
  .mode-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mode h3 { font-size: 20px; }
  .mode .sub { color: var(--muted); font-size: 13px; }
  .mode .play { font-size: 19px; padding: 15px; }
  .bar { height: 8px; background: #17142b; border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd34d, #ff9f43); border-radius: 99px; }
  .mode .row, .home-in .row { display: flex; gap: 8px; }
  .home-in .row button { padding: 11px 6px; font-size: 14px; min-width: 0; }
  /* ---------- rewards ---------- */
  .streak { color: #ffb27a; font-weight: 700; font-size: 14px; }
  .chest {
    font-size: 54px; line-height: 1; background: none; padding: 4px; flex: none; align-self: center;
    animation: wiggle 1.2s ease-in-out infinite;
  }
  .chest.open { animation: chestPop .5s ease-out forwards; }
  @keyframes wiggle { 0%, 60%, 100% { transform: rotate(0); } 70% { transform: rotate(-9deg); } 80% { transform: rotate(9deg); } 90% { transform: rotate(-5deg); } }
  @keyframes chestPop { 40% { transform: scale(1.4); } to { transform: scale(1); } }
  .loot { color: var(--accent); font-weight: 800; font-size: 16px; }
  .ms-list { list-style: none; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 0 !important; }
  .ms-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px;
    background: rgba(255,255,255,.04); border-radius: 10px; padding: 9px 12px; color: var(--text); }
  .ms-list li.done { background: rgba(255,211,77,.14); }
  .ms-list li span:last-child { color: var(--accent); font-weight: 800; white-space: nowrap; }
  #toast {
    position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 58px)); z-index: 12;
    transform: translate(-50%, -20px); opacity: 0; pointer-events: none; transition: .3s;
    background: linear-gradient(160deg, #ffe27a, #ffbf2e); color: #1a1533; font-weight: 900;
    padding: 10px 18px; border-radius: 99px; box-shadow: 0 6px 20px rgba(0,0,0,.4); white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="homeBtn" title="Home (M)" aria-label="Home">🏠</button>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat" id="bestBox" title="Scoreboard"><small id="bestLabel">Best 🏆</small><b id="best">0</b></div>
    <div class="stat" id="infBox" title="∞ blocks collected"><span class="infIcon">∞</span><b id="infCount">0</b></div>
  </header>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="hint" id="hint">Tap a column to shoot. Matching numbers merge.</div>
  <div class="tools">
    <div class="wallet" id="wallet" title="Coins: earned from combos"><span class="coin"></span><span id="coins">0</span></div>
    <button class="tool" id="tSwap" title="Swap any two blocks on the board"><span class="ic">⇄</span><span class="nm">Swap</span><span class="pr">200</span></button>
    <button class="tool" id="tHammer" title="Smash any block (H)"><span class="ic">🔨</span><span class="nm">Hammer</span><span class="pr">250</span></button>
    <button class="tool" id="tUndo" title="Undo the last play (U / Ctrl+Z)"><span class="ic">↶</span><span class="nm">Undo</span><span class="pr">25</span></button>
  </div>
  <footer>
    <div class="next">Next <div id="nextTile"></div><div id="nextTile2" title="After that"></div></div>
    <button id="swapBtn" title="Switch current and next tile (S) — free">⇅ Switch</button>
    <button id="helpBtn" title="How to play">?</button>
  </footer>
</div>

<div id="home"><div class="home-in" id="homeIn"></div></div>
<div id="toast"></div>
<div id="coinLayer"></div>
<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
(() => {
  'use strict';

  let cols = 5, rows = 7;          // board size: 5x7 in Endless, set per level in Level mode
  const MAX_CELL = 96;             // small level boards don't blow up to giant tiles
  const SAVE_KEY = 'mergeQuest.save.v1';           // Endless game in progress
  const LEVEL_SAVE_KEY = 'mergeQuest.levelSave.v1';  // level attempt in progress
  const MODE_KEY = 'mergeQuest.mode.v1';
  const saveKey = (m = mode) => (m === 'level' ? LEVEL_SAVE_KEY : SAVE_KEY);
  const BEST_KEY = 'mergeQuest.best.v1';
  const COIN_KEY = 'mergeQuest.coins.v1';
  const BOARD_KEY = 'mergeQuest.scoreboard.v1';
  const INITIALS_KEY = 'mergeQuest.initials.v1';
  const BOARD_SIZE = 10;
  const START_COINS = 50;
  const COST = { swap: 200, hammer: 250, undo: 25 };
  // combo = merges set off by one play (chain reactions included).
  // [min combo, praise, coins, colour]
  const PRAISE = [
    [2, 'Nice!',        3,   '#6cc8ff'],
    [3, 'Great!',       8,   '#4fe0b0'],
    [4, 'Excellent!',   15,  '#a7e35c'],
    [5, 'Amazing!',     25,  '#ffd34d'],
    [6, 'Incredible!',  40,  '#ffa04a'],
    [7, 'Unstoppable!', 60,  '#ff6f6f'],
    [8, 'Legendary!',   90,  '#ff62a8'],
    [10, 'GODLIKE!!',   150, '#c983ff'],
  ];
  // Each level ("tier") has its own look; higher tiers are more premium.
  // Tier 0: 2 … 2048 · Tier 1: 4K … 2048K · Tier 2: 4M … 2048M · then ∞.
  const PALETTE = [   // level 1 colours: soft, muted (higher levels derive from these)
    '#7d8bd6', '#3fa39a', '#d0875e', '#9170c4', '#57a062', '#d06a92',
    '#4c80c6', '#c9a243', '#b8585d', '#46a9c4', '#dd6079'
  ];
  const INF = 4294967296;   // 2^32: anything past 2048M becomes ∞
  const INF_KEY = 'mergeQuest.infinity.v1';
  const FONT = '"Arial Rounded MT Bold", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif';
  const PAIR_MS = 220;    // suck-in time when just two blocks merge
  const MERGE_MS = 280;   // suck-in time per block when 3+ blocks merge
  const STAGGER_MS = 100; // delay before each extra block starts (multi-merges)
  // mix a #rrggbb colour toward white (f > 0) or black (f < 0)
  const shadeCache = new Map();
  function shade(hex, f) {
    const key = hex + f;
    if (shadeCache.has(key)) return shadeCache.get(key);
    const n = parseInt(hex.slice(1), 16);
    const t = f < 0 ? 0 : 255, a = Math.abs(f);
    const ch = sh => Math.round(((n >> sh) & 255) + (t - ((n >> sh) & 255)) * a);
    const out = `rgb(${ch(16)},${ch(8)},${ch(0)})`;
    shadeCache.set(key, out);
    return out;
  }

  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const wrap = $('wrap');

  // ---------- storage (never trusted to exist) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ---------- state ----------
  let grid, cur, nxt, nxt2, shooter, score, best, maxV, minE, over;
  let bag = [], bagKey = '';          // shuffled launch bag (fairer than pure random)
  let rescueUsed = false;            // Endless: one free Hammer per game when stuck
  let freeUses = { hammer: 0, swap: 0, undo: 0 };  // free helper uses (rescue, level samples)
  let aim = 2, busy = false;
  let mode = store.get(MODE_KEY) === 'level' ? 'level' : 'endless';
  let lv = null;                     // current level attempt (Level mode only)
  let ghosts = [], floaters = [], banner = null, shake = null, praise = null;
  let flyers = [], bubbles = [];  // shots heading for a full column; merge bubbles
  let tool = null, sel = null;      // active helper ('swap' | 'hammer') and first swap pick
  let snap = null, lastEarned = 0;  // undo snapshot and coins earned by that play
  let gameId = '';                  // identifies this game's scoreboard entry
  let coinFlights = [], coinPending = 0;  // coins flying to the wallet, not yet shown
  let oldStart = 0;                 // old-level blocks on the board when the level began
  let infCount = parseInt(store.get(INF_KEY) || '0', 10) || 0;  // ∞ blocks ever made
  best = parseInt(store.get(BEST_KEY) || '0', 10) || 0;
  let coins = parseInt(store.get(COIN_KEY) ?? String(START_COINS), 10);
  if (!Number.isFinite(coins) || coins < 0) coins = START_COINS;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const log2 = v => Math.round(Math.log2(v));
  // tier of a value: 0 = 2…2048, 1 = 4K…2048K, 2 = 4M…2048M, 3 = ∞
  const tierOfE = e => e >= 32 ? 3 : e >= 22 ? 2 : e >= 12 ? 1 : 0;
  // ---- higher levels reuse the muted base hues, a bit brighter each level
  function hexToHsl(hex) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360},${clamp(s, 0, 100)}%,${clamp(l, 0, 100)}%)`;
  // base hue for a K/M value: same muted family as level 1, offset so neighbours differ
  const baseHsl = (e, t) => hexToHsl(PALETTE[(e - (t === 1 ? 9 : 16)) % PALETTE.length]);
  const colorCache = new Map();
  function colorOf(v) {
    if (colorCache.has(v)) return colorCache.get(v);
    const e = log2(v), t = tierOfE(e);
    let c;
    if (t === 0) c = PALETTE[(e - 1) % PALETTE.length];
    else if (t === 3) c = '#8b5cf6';
    else { const [h, sat, l] = baseHsl(e, t); c = hsl(h, sat + 14 * t, l + 7 * (t === 2 ? 1.4 : 1)); }
    colorCache.set(v, c);
    return c;
  }

  // Short score for the header: full number up to 99,999, then 123K / 1.21M / 4.5B.
  function shortScore(n) {
    if (n < 100000) return n.toLocaleString();
    const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (const [d, u] of units) if (n >= d) {
      const x = n / d;
      const txt = x >= 100 ? Math.floor(x).toString() : x >= 10 ? (Math.floor(x * 10) / 10).toString() : (Math.floor(x * 100) / 100).toString();
      return txt + u;
    }
    return String(n);
  }

  // Tile labels: up to 2048 in full, then 4K, 8K … 512K, 1M … 512M, 1B …
  function fmt(v) {
    if (v >= INF) return '∞';
    if (v >= 4194304) return (v / 1048576) + 'M';   // 4M … 2048M
    if (v >= 4096) return (v / 1024) + 'K';         // 4K … 2048K
    return String(v);
  }

  function newTile(v, x, y) { return { v, x, y, s: 0.2, ty: null }; }
  const resetShooter = () => { shooter = newTile(cur, cellX(aim), launchY()); };

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, cell = 40, bx = 0, by = 0, layoutKey = '';
  // Returns false when the size is unchanged (several resize signals can fire at once).
  function layout() {
    const r = wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1, key = cols + 'x' + rows;
    if (r.width === W && r.height === H && d === dpr && key === layoutKey) return false;
    layoutKey = key;
    dpr = d;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.floor(Math.min(W / cols, H / (rows + 1.35), MAX_CELL));
    bx = (W - cell * cols) / 2;
    by = Math.max(0, (H - cell * (rows + 1.35)) / 2);
    return true;
  }
  const cellX = c => bx + c * cell;
  const cellY = r => by + r * cell;
  const launchY = () => by + rows * cell + cell * 0.3;

  // ---------- board helpers ----------
  const count = c => { let n = 0; for (const t of grid[c]) if (t) n++; return n; };
  const allTiles = () => (grid ? grid.flat().filter(Boolean) : []);
  const gridValues = () => grid.map(col => col.map(t => (t ? t.v : 0)));

  function landingRow(c, v) {
    const n = count(c);
    if (n < rows) return n;
    if (grid[c][rows - 1].v === v) return rows - 1; // merges into bottom tile
    return -1;
  }
  const fits = v => grid.some((_, c) => landingRow(c, v) >= 0);
  const isStuck = () => !fits(cur) && !fits(nxt);   // neither tile can be placed

  function eqNeighbors(c, r) {
    const t = grid[c][r];
    if (!t) return [];
    const out = [];
    for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
      const o = grid[nc][nr];
      if (o && o.v === t.v) out.push([nc, nr]);
    }
    return out;
  }

  // Pushes every column's tiles up to the ceiling. Returns positions of tiles that moved.
  function compact() {
    const moved = [];
    for (let c = 0; c < cols; c++) {
      const col = grid[c].filter(Boolean);
      for (let r = 0; r < rows; r++) {
        const t = col[r] || null;
        if (t && grid[c][r] !== t) moved.push([c, r]);
        grid[c][r] = t;
      }
    }
    return moved;
  }

  function find(t) {
    for (let c = 0; c < cols; c++)
      for (let r = 0; r < rows; r++)
        if (grid[c][r] === t) return [c, r];
    return null;
  }

  // ---------- tile supply ----------
  // Current level from the biggest tile made: 0 until 4K, 1 until 4M, then 2.
  const tierOf = mv => Math.min(2, tierOfE(log2(mv)));
  // Each level launches the previous level's 2048 plus 4…64 of its own units
  // (2…64, then 2048/4K…64K, then 2048K/4M…64M). The top of the range opens up
  // as your biggest tile grows; bigger values are rarer.
  function boardMaxE() {
    let m = 0;
    for (const t of allTiles()) if (t.v < INF) m = Math.max(m, log2(t.v));
    return m;
  }
  function spawnRange() {
    const k = tierOf(maxV), lo = 10 * k + 1;
    if (k === 0) return [lo, Math.min(lo + 5, Math.max(lo + 2, log2(maxV) - 1))];
    // K and M levels: never launch anything bigger than the biggest block on the board
    return [lo, Math.min(lo + 5, Math.max(lo, boardMaxE()))];
  }
  // Blocks left over from earlier levels (below this level's launch range).
  function oldBlocks() {
    const cut = Math.pow(2, spawnRange()[0]);
    return allTiles().filter(t => t.v < cut).map(t => t.v);
  }

  function rollValue() {
    if (mode === 'level') return levelRoll();
    const [lo, hi] = spawnRange();
    // While old-level blocks remain, often launch one of their values (more
    // likely for values you have several of): ~70% at first, easing to ~30%
    // as they get cleared. Only values actually on the board are used.
    const old = oldBlocks();
    if (old.length) {
      oldStart = Math.max(oldStart, old.length);
      const pOld = 0.3 + 0.4 * (old.length / oldStart);
      if (Math.random() < pOld) return old[Math.floor(Math.random() * old.length)];
    }
    return drawFromBag(lo, hi);
  }

  // Is v still a legal launch? (used when a previewed tile moves up the queue)
  function launchable(v) {
    if (mode === 'level') return true;
    const [lo, hi] = spawnRange();
    if (v >= Math.pow(2, lo) && v <= Math.pow(2, hi)) return true;
    return oldBlocks().includes(v);
  }

  // Launches come from a shuffled bag of ~40 tiles built from the odds (each
  // step up 0.6x as likely), like Threes: no long floods or droughts of one value.
  // One bag serves the whole level; values currently above the cap (biggest
  // block on the board) stay in the bag for later instead of being drawn.
  function drawFromBag(lo, hi) {
    for (let attempt = 0; attempt < 2; attempt++) {
      if (bagKey !== String(lo) || !bag.length) {
        bagKey = String(lo); bag = [];
        let total = 0;
        for (let e = lo; e <= lo + 5; e++) total += Math.pow(0.6, e - lo);
        for (let e = lo; e <= lo + 5; e++) {
          const n = Math.max(1, Math.round(Math.pow(0.6, e - lo) / total * 40));
          for (let k = 0; k < n; k++) bag.push(Math.pow(2, e));
        }
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      }
      const cap = Math.pow(2, hi);
      for (let i = bag.length - 1; i >= 0; i--) {
        if (bag.at(i) <= cap) return bag.splice(i, 1)[0];
      }
      bag = [];                          // only too-big values left: start a fresh bag
    }
    return Math.pow(2, lo);
  }

  // ---------- scoring / feedback ----------
  function addScore(v, c, r) {
    score += v;
    if (v > maxV) { maxV = v; milestoneCheck(v); }
    if (score > best) best = score;
    floaters.push({ text: '+' + fmt(v), x: cellX(c) + cell / 2, y: cellY(r) + cell / 2, life: 1 });
    updateHud();
  }

  // Helpers won from chests, kept across games and modes (unlike freeUses,
  // which belong to one game or level).
  const INV_KEY = 'mergeQuest.inventory.v1';
  let inv = { hammer: 0, swap: 0, undo: 0 };
  try { Object.assign(inv, JSON.parse(store.get(INV_KEY) || '{}')); } catch (e) {}
  const saveInv = () => store.set(INV_KEY, JSON.stringify(inv));
  const freeCount = name => freeUses[name] + inv[name];

  const priceOf = name => (freeCount(name) > 0 ? 0 : COST[name]);
  // pay for a helper: this game's free uses first, then won helpers, then coins
  function spend(name) {
    if (freeUses[name] > 0) freeUses[name]--;
    else if (inv[name] > 0) { inv[name]--; saveInv(); }
    else setCoins(coins - COST[name]);
  }

  function setCoins(n) {
    coins = Math.max(0, n);
    store.set(COIN_KEY, String(coins));
    updateHud();
  }

  function tierFor(combo) {
    let t = null;
    for (const p of PRAISE) if (combo >= p[0]) t = p;
    return t;
  }
  // Coins for a combo. Above the top tier each extra merge adds 25.
  function comboCoins(combo) {
    const t = tierFor(combo);
    if (!t) return 0;
    const top = PRAISE[PRAISE.length - 1];
    return t[2] + (combo > top[0] ? (combo - top[0]) * 25 : 0);
  }

  // Coins earned by a play: counted for undo, added, and flown into the wallet.
  function earn(n) {
    lastEarned += n;
    setCoins(coins + n);
    launchCoins(n);
  }

  function rewardCombo(combo) {
    const t = tierFor(combo);
    if (!t) return;
    const gain = comboCoins(combo);
    praise = { text: t[1], sub: combo + '× combo  +' + gain, color: t[3], life: 1.6, s: 0.4, tier: PRAISE.indexOf(t) };
    earn(gain);
  }

  // ---------- flying coins ----------
  // A burst of coins pops out where the praise shows, then each one arcs into the
  // wallet; the counter ticks up as they land. More coins earned = more coins flying.
  function launchCoins(gain) {
    const n = Math.min(12, Math.max(1, Math.ceil(gain / 3)));
    const cr = cv.getBoundingClientRect();
    const sx = cr.left + bx + cell * cols / 2, sy = cr.top + by + cell * rows * 0.42 + cell * 0.6;
    const per = Math.floor(gain / n);
    let rest = gain - per * n;
    coinPending += gain;
    updateHud();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'fcoin';
      coinLayer.appendChild(el);
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const burst = cell * (0.5 + Math.random() * 0.9);
      coinFlights.push({
        el, value: per + (rest-- > 0 ? 1 : 0), first: i === 0, last: i === n - 1, gain,
        sx, sy, bxp: sx + Math.cos(ang) * burst, byp: sy + Math.sin(ang) * burst,
        start: t0 + 260 + i * 70, popDur: 260, flyDur: 560 + Math.random() * 120, spin: 6 + Math.random() * 6,
      });
    }
  }

  const coinLayer = $('coinLayer'), walletCoin = $('wallet').querySelector('.coin');
  function walletTarget() {
    const r = walletCoin.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  function coinLanded(f, tx, ty) {
    coinPending = Math.max(0, coinPending - f.value);
    updateHud();
    const w = $('wallet');
    w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
    setTimeout(() => w.classList.remove('bump'), 120);
    if (f.first) {
      const plus = document.createElement('div');
      plus.className = 'coin-plus';
      plus.textContent = '+' + f.gain;
      w.appendChild(plus);
      setTimeout(() => plus.remove(), 1000);
    }
    for (let k = 0; k < 3; k++) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      coinLayer.appendChild(sp);
      const a = Math.random() * Math.PI * 2, d = 14 + Math.random() * 14;
      sp.animate([
        { transform: `translate(${tx}px, ${ty}px) scale(1)`, opacity: 1 },
        { transform: `translate(${tx + Math.cos(a) * d}px, ${ty + Math.sin(a) * d}px) scale(.2)`, opacity: 0 },
      ], { duration: 380, easing: 'ease-out' }).onfinish = () => sp.remove();
    }
  }

  function stepCoins(now) {
    if (!coinFlights.length) return;
    const [tx, ty] = walletTarget();
    coinFlights = coinFlights.filter(f => {
      const t = now - f.start;
      let x, y, sc = 1;
      if (t < 0) { f.el.style.opacity = 0; return true; }
      f.el.style.opacity = 1;
      if (t < f.popDur) {                               // pop out of the praise
        const p = t / f.popDur, e = 1 - Math.pow(1 - p, 3);
        x = f.sx + (f.bxp - f.sx) * e; y = f.sy + (f.byp - f.sy) * e;
        sc = 0.3 + 0.9 * e;
      } else {                                          // arc into the wallet
        const p = Math.min(1, (t - f.popDur) / f.flyDur);
        const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const cx = (f.bxp + tx) / 2 + (f.bxp < tx ? -1 : 1) * cell * 0.8, cy = Math.min(f.byp, ty) - cell * 0.6;
        const u = 1 - e;
        x = u * u * f.bxp + 2 * u * e * cx + e * e * tx;
        y = u * u * f.byp + 2 * u * e * cy + e * e * ty;
        sc = 1.2 - 0.45 * e;
        if (p >= 1) { f.el.remove(); coinLanded(f, tx, ty); return false; }
      }
      const flip = Math.abs(Math.cos(t / 1000 * f.spin));  // spinning coin
      f.el.style.transform = `translate(${x}px, ${y}px) scale(${sc * (0.35 + 0.65 * flip)}, ${sc})`;
      return true;
    });
  }

  function clearCoinFlights() {
    for (const f of coinFlights) f.el.remove();
    coinFlights = []; coinPending = 0; chestHeld = 0;
  }

  // Shrink the score/best numbers so big scores always fit their boxes.
  function fitStats() {
    for (const id of ['score', 'best']) {
      const el = $(id), box = el.parentElement;
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      const room = box.clientWidth - 12;
      while (el.scrollWidth > room && fs > 10) { fs -= 1; el.style.fontSize = fs + 'px'; }
    }
  }

  // the small "Next" preview tiles in the footer
  function paintMini(el, v, sizes) {
    const label = fmt(v), ts = tileCss(v);
    el.textContent = label;
    el.style.fontSize = sizes[Math.min(5, label.length)] + 'px';
    el.style.background = ts.bg; el.style.color = ts.fg; el.style.border = ts.border;
  }

  function updateHud() {
    const sTxt = shortScore(score), bTxt = mode === 'level' ? String(lv.n) : shortScore(best);
    $('bestLabel').textContent = mode === 'level' ? 'Level' : 'Best 🏆';
    if (sTxt !== $('score').textContent || bTxt !== $('best').textContent) {
      $('score').textContent = sTxt;
      $('best').textContent = bTxt;
      fitStats();
    }
    $('coins').textContent = Math.max(0, coins - coinPending).toLocaleString();
    $('infCount').textContent = infCount.toLocaleString();
    paintMini($('nextTile'), nxt, [0, 15, 15, 14, 12, 10]);
    paintMini($('nextTile2'), nxt2, [0, 12, 12, 11, 9, 8]);
    const n = countTiles();
    $('tSwap').disabled = busy || over || (coins < priceOf('swap') && tool !== 'swap') || n < 2;
    $('tHammer').disabled = busy || over || (coins < priceOf('hammer') && tool !== 'hammer') || n < 1;
    $('tUndo').disabled = busy || !snap || coins - lastEarned < priceOf('undo') || helpersOff();
    if (helpersOff()) { $('tSwap').disabled = $('tHammer').disabled = true; }
    $('swapBtn').disabled = busy || over || helpersOff();
    for (const [id, name] of [['tSwap', 'swap'], ['tHammer', 'hammer'], ['tUndo', 'undo']])
      $(id).querySelector('.pr').textContent = freeCount(name) > 0 ? 'Free ×' + freeCount(name) : COST[name];
    $('tSwap').classList.toggle('active', tool === 'swap');
    $('tHammer').classList.toggle('active', tool === 'hammer');
    const fitsCur = fits(cur);
    if (mode === 'level' && !tool && !over) {
      const L = levelDef();
      $('hint').innerHTML = `<span class="goal">🎯 ${goalText(L, true)}</span>` +
        (lv.shots ? ` · <b>${lv.shotsLeft}</b> shot${lv.shotsLeft === 1 ? '' : 's'} left` : '');
      return;
    }
    $('hint').textContent = tool === 'hammer' ? 'Tap a block to smash it (tap Hammer again to cancel).'
      : tool === 'swap' ? (sel ? 'Now tap the block to swap it with.' : 'Tap the first block to swap.')
      : over ? 'No moves left.'
      : !fitsCur ? 'Current tile has nowhere to go — switch it!'
      : 'Tap a column to shoot. Combos earn coins!';
  }

  const countTiles = () => allTiles().length;

  // A tile being sucked into `target` like one bubble joining another.
  // `delay` (ms) holds the block in place before it starts moving.
  function absorbGhost(t, target, delay = 0, dur = MERGE_MS) {
    ghosts.push({ kind: 'absorb', v: t.v, x0: t.x, y0: t.y, x: t.x, y: t.y, target, t: -delay / 1000, dur: dur / 1000 });
  }
  function fadeGhost(t, dy) {
    ghosts.push({ kind: 'fade', v: t.v, x: t.x, y: t.y, tx: t.x, ty: t.y + dy, a: 1 });
  }

  // Merge `sources` into `target` with the bubble animation, then pop to newV.
  // Blocks are sucked in one after another; the number doubles as each lands.
  async function bubbleMerge(target, sources, newV) {
    const old = target.v;
    newV = Math.min(newV, INF);
    const dur = sources.length === 1 ? PAIR_MS : MERGE_MS;
    // Plan when each block lands. 2-3 blocks: steady rhythm. 4+ blocks: it
    // ramps up - each block is sucked in faster and the gaps keep shrinking.
    const ramp = sources.length >= 3;
    const plan = [];
    for (let i = 0; i < sources.length; i++) {
      if (!ramp) { plan.push({ start: i * STAGGER_MS, dur }); continue; }
      const d = dur * Math.pow(0.85, i);
      const arrive = i === 0 ? dur : plan[i - 1].start + plan[i - 1].dur + 110 * Math.pow(0.7, i - 1);
      plan.push({ start: arrive - d, dur: d });
    }
    sources.forEach((src, i) => absorbGhost(src, target, plan[i].start, plan[i].dur));
    target.show = old;                 // keep showing the old number until absorbed
    target.v = newV;
    target.wob = { amp: -0.08, t: 0 }; // slight inhale while it pulls the others in
    const total = plan[plan.length - 1].start + plan[plan.length - 1].dur;
    target.mt = { t: 0, dur: (total + 180) / 1000 };
    let elapsed = 0;
    for (let i = 0; i < sources.length; i++) {
      const arrive = plan[i].start + plan[i].dur;
      await sleep(arrive - elapsed);
      elapsed = arrive;
      if (i < sources.length - 1) {    // intermediate step: count up with a small gulp
        target.show = Math.min(INF, old * Math.pow(2, i + 1));
        target.s = 1.1 + (ramp ? i * 0.03 : 0);
        target.wob = { amp: 0.08, t: 0 };
      }
    }
    target.show = undefined;
    target.s = 1.24;
    target.wob = { amp: 0.16, t: 0 };
    if (newV >= INF && old < INF) infinityMade(target);
    const col = colorOf(newV);
    burst(target, 9, [1, 1.6], [0.04, 0.08], [0.5, 0.35], () => col);
  }

  // Bubbles flying out of a tile's centre. Ranges are [base, random extra];
  // speed and radius are in cells.
  function burst(t, n, speed, radius, life, colour) {
    const cx = t.x + cell / 2, cy = t.y + cell / 2;
    const rnd = ([a, b]) => a + Math.random() * b;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = cell * rnd(speed);
      bubbles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: cell * rnd(radius), life: rnd(life), col: colour(i) });
    }
  }

  // ---------- one-time milestone bounties (any mode, paid once ever) ----------
  // Paid outside lastEarned, so undoing the play doesn't take a bounty back.
  const BOUNTY_KEY = 'mergeQuest.bounties.v1';
  const MILESTONES = [[2048, 300], [4096, 500], [4194304, 1000], [INF, 2000]];
  function loadBounties() {
    try { return JSON.parse(store.get(BOUNTY_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  function milestoneCheck(v) {
    const got = loadBounties();
    for (const [at, pay] of MILESTONES) {
      if (v < at || got[at]) continue;
      got[at] = Date.now();
      store.set(BOUNTY_KEY, JSON.stringify(got));
      setCoins(coins + pay); launchCoins(pay);
      toast(`🏅 First ${fmt(at)}! +${pay} coins`);
    }
  }
  let toastTimer = 0;
  function toast(text) {
    const el = $('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }
  function showMilestones() {
    const got = loadBounties();
    showOverlay(`
      <h2>🏅 Milestones</h2>
      <p>One-time bounties, in any mode.</p>
      <ul class="ms-list">${MILESTONES.map(([at, pay]) => `
        <li class="${got[at] ? 'done' : ''}"><span>${got[at] ? '✅' : '🔒'} First <b>${fmt(at)}</b> block</span>
        <span>${got[at] ? 'Claimed' : `<span class="coin"></span> ${pay}`}</span></li>`).join('')}</ul>
      <button class="primary" id="closeBtn">Close</button>`);
    $('closeBtn').onclick = hideOverlay;
  }

  // A brand-new ∞ block: count it (saved across games) and celebrate.
  function infinityMade(t) {
    infCount++;
    store.set(INF_KEY, String(infCount));
    banner = { text: '∞ INFINITY BLOCK! #' + infCount, life: 2.4 };
    const hues = ['#facc15', '#f472b6', '#22d3ee', '#a78bfa', '#ffffff'];
    burst(t, 26, [1.5, 2.5], [0.05, 0.1], [0.8, 0.5], i => hues[i % hues.length]);
    earn(500);                         // a new ∞ pays 500 coins
    const box = $('infBox');
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
  }

  // Two ∞ blocks that merge disappear, opening space, and pay 250 coins.
  function clearInfinity(t, [c, r]) {
    if (grid[c][r] !== t) return;
    grid[c][r] = null;
    fadeGhost(t, -cell * 0.3);
    burst(t, 18, [1.2, 2], [0.05, 0.08], [0.7, 0.4], () => '#facc15');
    earn(250);
    banner = { text: '∞ + ∞ cleared! +250 coins', life: 2 };
  }

  // ---------- Level mode ----------
  // Boards grow from 2x2 to the full 5x7, one new idea per level. Levels 1-6
  // use a fixed tile queue and generous shots so they can't really be lost.
  // goal: [type, value] - make: a tile of value · score: points · combo: merges
  // in one shot · merge: blocks in one merge · leave: <= value blocks left ·
  // survive: use every shot without filling up. shots 0 = no limit.
  // start: columns top-down · queue: fixed first tiles · spawn: max exponent
  // for random tiles after that · free: free helper uses · hint: column to point at
  const PROGRESS_KEY = 'mergeQuest.progress.v1';
  const LEVELS = [
    { cols: 2, rows: 2, goal: ['make', 8], shots: 5, start: [[2], []], queue: [2, 4, 2, 2, 4], hint: 0, reward: 50, intro: 'Tap a column to shoot. Equal numbers that touch merge!' },
    { cols: 2, rows: 2, goal: ['make', 16], shots: 6, start: [[8, 2], []], queue: [4, 4, 2, 4, 2, 2], hint: 1, reward: 50, intro: 'A full column only takes a matching tile. Pick the other one.' },
    { cols: 2, rows: 2, goal: ['merge', 3], shots: 3, start: [[4], [8, 4]], queue: [4, 2, 2], hint: 0, reward: 75, intro: 'Three blocks at once = ×4!' },
    { cols: 2, rows: 3, goal: ['make', 32], shots: 8, start: [[], []], queue: [8, 8, 16, 4, 4, 2, 2, 2], reward: 75, intro: 'The bottom bar shows the next tiles. Plan ahead.' },
    { cols: 2, rows: 3, goal: ['combo', 2], shots: 4, start: [[8, 4], []], queue: [4, 2, 2, 2], hint: 0, reward: 100, intro: 'One merge can set off another — a combo!' },
    { cols: 2, rows: 3, goal: ['make', 64], shots: 8, start: [[32, 16, 8], [4, 2, 16]], queue: [2, 8, 4, 2, 4, 2, 2, 2], reward: 100, intro: 'Tile doesn\'t fit? Tap Switch to use the next one.' },
    { cols: 3, rows: 3, goal: ['score', 100], shots: 15, spawn: 3, reward: 100, intro: 'From now on tiles are random. Score 100!' },
    { cols: 3, rows: 3, goal: ['merge', 4], shots: 3, start: [[2, 8], [8], [4, 8]], queue: [8, 2, 2], hint: 1, reward: 150, intro: 'Four blocks at once = ×8!' },
    { cols: 3, rows: 3, goal: ['leave', 2], shots: 6, start: [[4], [4, 2], []], queue: [2, 8, 4, 2, 2, 4], free: { undo: 3 }, reward: 150, intro: 'Merge the board down. 3 free Undos if you slip.' },
    { cols: 3, rows: 5, goal: ['make', 128], shots: 35, spawn: 4, reward: 300, chest: { coins: 150, hammer: 1 }, intro: 'Checkpoint! Use everything you know.' },
    { cols: 4, rows: 4, goal: ['make', 128], shots: 22, spawn: 4, start: [[2, 16, 4], [8, 2], [16, 4, 2], [4]], free: { hammer: 1 }, reward: 150, intro: 'A free Hammer: tap it, then smash a block in the way.' },
    { cols: 4, rows: 4, goal: ['score', 200], shots: 18, spawn: 5, free: { swap: 1 }, reward: 150, intro: 'A free Swap: trade any two blocks.' },
    { cols: 4, rows: 5, goal: ['combo', 3], shots: 12, spawn: 4, start: [[32, 16, 8], [], [], []], reward: 200, intro: 'Build a staircase, then trigger it.' },
    { cols: 4, rows: 5, goal: ['score', 220], shots: 20, spawn: 4, reward: 200 },
    { cols: 4, rows: 5, goal: ['survive', 30], shots: 30, spawn: 6, start: [[2, 8, 32, 4], [16, 4, 2, 64], [8, 32, 4, 16], [4, 2, 8, 32]], hard: true, reward: 250, intro: 'Hard level: the board is nearly full. Last 30 shots!' },
    { cols: 4, rows: 6, goal: ['make', 256], shots: 45, spawn: 6, reward: 250 },
    { cols: 4, rows: 6, goal: ['make', 64], shots: 18, spawn: 4, reward: 250, intro: 'Fewer shots — make every one count.' },
    { cols: 5, rows: 6, goal: ['make', 256], shots: 55, spawn: 5, reward: 300, intro: 'Five columns now. Use the middle!' },
    { cols: 5, rows: 6, goal: ['merge', 3], shots: 20, spawn: 4, reward: 300, intro: 'Line up three of a kind around one spot.' },
    { cols: 5, rows: 6, goal: ['make', 256], shots: 50, spawn: 5, noHelpers: true, hard: true, reward: 300, chest: { coins: 250, hammer: 1, swap: 1 }, intro: 'Hard level: no helpers, no Switch. Just skill.' },
    { cols: 5, rows: 7, goal: ['score', 400], shots: 30, spawn: 5, reward: 300, intro: 'The full board!' },
    { cols: 5, rows: 7, goal: ['score', 600], shots: 35, spawn: 5, reward: 300 },
    { cols: 5, rows: 7, goal: ['score', 750], shots: 45, spawn: 6, reward: 300 },
    { cols: 5, rows: 7, goal: ['make', 2048], shots: 0, spawn: 6, reward: 1000, intro: 'Graduation: make a 2048! No shot limit.' },
  ];
  const levelDef = () => LEVELS[lv.n - 1];
  let levelPerks = '';                 // streak bonus text for the level intro

  function loadProgress() {
    try {
      const p = JSON.parse(store.get(PROGRESS_KEY) || 'null');
      if (p && typeof p.stars === 'object') return { stars: p.stars, fails: p.fails || {}, cleared: p.cleared || {}, streak: p.streak || 0 };
    } catch (e) {}
    return { stars: {}, fails: {}, cleared: {}, streak: 0 };
  }
  const saveProgress = pr => store.set(PROGRESS_KEY, JSON.stringify(pr));
  // level n is open once the previous one is cleared (or skipped, stored as 0 stars)
  const unlocked = (n, pr = loadProgress()) => n === 1 || pr.stars[n - 1] !== undefined;
  // Win streak: each new level cleared in a row adds a step (max 5); losing a
  // new level costs 2 steps, never the whole ladder. Replays don't count.
  const STREAK_MAX = 5;
  const streakPerks = s => ({ hammer: s >= 3 ? 1 : 0, swap: s >= 5 ? 1 : 0 });
  function perkText(s) {
    const p = streakPerks(s);
    return [p.hammer && 'free Hammer', p.swap && 'free Swap'].filter(Boolean).join(' + ');
  }
  // what the next step of the ladder gives, for the win screen
  function streakLine(s) {
    const now = perkText(s);
    if (now) return `🔥 Streak ${s}: next level starts with a ${now}`;
    return `🔥 Streak ${s} — ${3 - s} more win${3 - s === 1 ? '' : 's'} for a free Hammer`;
  }
  const totalStars = pr => Object.values(pr.stars).reduce((a, b) => a + b, 0);

  function goalText(L, withProgress) {
    const [type, v] = L.goal;
    const pr = withProgress && lv;
    switch (type) {
      case 'make': return `Make ${fmt(v)[0] === '8' ? 'an' : 'a'} <b>${fmt(v)}</b>`;
      case 'score': return `Score <b>${v.toLocaleString()}</b>` + (pr ? ` (${score.toLocaleString()})` : '');
      case 'combo': return `Make a <b>${v}-merge combo</b> in one shot`;
      case 'merge': return `Merge <b>${v} blocks</b> at once`;
      case 'leave': return `Leave <b>${v} or fewer</b> blocks` + (pr ? ` (now ${countTiles()})` : '');
      case 'survive': return `Survive <b>${v} shots</b> without filling up`;
    }
    return '';
  }

  function goalMet() {
    const [type, v] = levelDef().goal;
    switch (type) {
      case 'make': return maxV >= v;
      case 'score': return score >= v;
      case 'combo': return lv.bestCombo >= v;
      case 'merge': return lv.bestMerge >= v;
      case 'leave': return lv.used > 0 && countTiles() <= v;
      case 'survive': return lv.shots > 0 && lv.shotsLeft <= 0;
    }
    return false;
  }

  function levelRoll() {
    const L = levelDef();
    if (L.queue && lv.qi < L.queue.length) return L.queue[lv.qi++];
    return drawFromBag(1, L.spawn || 3);
  }

  function startLevel(n) {
    const L = LEVELS[n - 1];
    mode = 'level';
    cols = L.cols; rows = L.rows;
    layout();
    const start = L.start || [];
    setGrid(Array.from({ length: cols }, (_, c) => {
      const col = start[c] || [];
      return Array.from({ length: rows }, (_, r) => col[r] || 0);
    }));
    lv = { n, shots: L.shots, shotsLeft: L.shots, used: 0, qi: 0, bestCombo: 0, bestMerge: 0, result: null };
    score = 0; minE = 1; oldStart = 0; over = false; busy = false;
    maxV = Math.max(2, ...allTiles().map(t => t.v));
    ghosts = []; floaters = []; flyers = []; bubbles = []; banner = null; praise = null;
    tool = null; sel = null; snap = null; lastEarned = 0;
    clearCoinFlights();
    bag = []; bagKey = ''; rescueUsed = true;
    freeUses = { hammer: 0, swap: 0, undo: 0, ...L.free };
    const perks = L.noHelpers ? {} : streakPerks(loadProgress().streak);
    for (const k in perks) freeUses[k] += perks[k];
    levelPerks = L.noHelpers ? '' : perkText(loadProgress().streak);
    cur = rollValue(); nxt = rollValue(); nxt2 = rollValue();
    gameId = 'L' + n + '-' + Date.now().toString(36);
    aim = L.hint !== undefined ? L.hint : Math.floor(cols / 2);
    resetShooter();
    save();
    updateHud();
    hideHome();
    showLevelIntro();
  }

  function showLevelIntro() {
    const L = levelDef();
    const free = Object.entries(L.free || {}).map(([k, v]) => `${v} free ${k[0].toUpperCase() + k.slice(1)}${v > 1 ? 's' : ''}`);
    showOverlay(`
      <div class="tag">Level ${lv.n}${L.hard ? ' · Hard' : ''} · ${L.cols}×${L.rows} board</div>
      <h2 class="goal">${goalText(L)}</h2>
      ${L.intro ? `<p>${L.intro}</p>` : ''}
      ${levelPerks ? `<p class="streak">🔥 Win streak bonus: ${levelPerks}</p>` : ''}
      <p>${L.shots ? `<b>${L.shots}</b> shots` : 'No shot limit'}${free.length ? ' · ' + free.join(', ') : ''}</p>
      <button class="primary" id="playBtn">Play</button>`);
    $('playBtn').onclick = hideOverlay;
  }

  // After every play in Level mode: won, lost, or carry on?
  function levelEnded() {
    if (goalMet()) { levelWon(); return true; }
    if (isStuck()) { levelLost('No room left'); return true; }
    if (lv.shots && lv.shotsLeft <= 0) { levelLost('Out of shots'); return true; }
    return false;
  }

  function starsFor() {
    if (!lv.shots || levelDef().goal[0] === 'survive') return 3;
    const left = lv.shotsLeft / lv.shots;
    return left >= 0.4 ? 3 : left >= 0.15 ? 2 : 1;
  }
  const starHtml = n => `<div class="stars">${[1, 2, 3].map(i => i <= n ? '★' : '<span class="off">★</span>').join('')}</div>`;

  // Chest coins are already saved; until the chest is opened the wallet just
  // doesn't show them. Leaving the screen unopened shows them without the fly-in.
  let chestHeld = 0;
  function releaseChest(fly) {
    if (!chestHeld) return;
    coinPending = Math.max(0, coinPending - chestHeld);
    if (fly) launchCoins(chestHeld); else updateHud();
    chestHeld = 0;
  }

  function levelWon() {
    over = true; tool = null; sel = null; snap = null;
    lv.result = 'won';
    const L = levelDef(), n = lv.n, stars = starsFor();
    const pr = loadProgress(), prev = pr.stars[n];
    // full reward the first time it's cleared (a skipped level counts as not cleared);
    // after that, 10 coins for each new star
    const firstClear = !(pr.cleared && pr.cleared[n]);
    const reward = firstClear ? L.reward : Math.max(0, stars - (prev || 0)) * 10;
    pr.stars[n] = Math.max(stars, prev || 0);
    pr.cleared[n] = true;
    pr.fails[n] = 0;
    if (firstClear) pr.streak = Math.min(STREAK_MAX, pr.streak + 1);
    saveProgress(pr);
    store.del(LEVEL_SAVE_KEY);
    if (reward) { setCoins(coins + reward); launchCoins(reward); }
    // the chest is saved right away; opening it is only the reveal
    const chest = firstClear && L.chest;
    if (chest) {
      for (const k of ['hammer', 'swap', 'undo']) inv[k] += chest[k] || 0;
      saveInv();
      setCoins(coins + chest.coins);
      chestHeld = chest.coins; coinPending += chestHeld; updateHud();
    }
    banner = { text: n === LEVELS.length ? 'You graduated!' : 'Level complete!', life: 2 };
    const last = n === LEVELS.length;
    showOverlay(`
      <div class="tag">Level ${n}</div>
      <h2>${last ? '🎓 You graduated!' : 'Level complete!'}</h2>
      ${starHtml(stars)}
      ${reward ? `<p><span class="coin"></span> <b>+${reward}</b> coins</p>` : '<p>Replay for more stars!</p>'}
      ${firstClear && !last ? `<p class="streak">${streakLine(pr.streak)}</p>` : ''}
      ${chest ? `<button class="chest" id="chestBtn" aria-label="Open the chest">🎁</button><p id="chestTxt">Checkpoint chest! Tap to open.</p>` : ''}
      ${last ? '<p>You\'ve mastered every idea. Endless mode is the real test — see how far you get!</p>' : ''}
      ${last ? '<button class="primary" id="endlessBtn">∞ Play Endless</button>' : '<button class="primary" id="nextBtn">Next level</button>'}
      <div class="row"><button id="replayBtn">↻ Replay</button><button id="mapBtn">🗺️ Map</button><button id="homeBtn2">🏠</button></div>`);
    if (last) $('endlessBtn').onclick = playEndless;
    else $('nextBtn').onclick = () => startLevel(n + 1);
    $('replayBtn').onclick = () => startLevel(n);
    $('mapBtn').onclick = showMap;
    $('homeBtn2').onclick = showHome;
    if (chest) $('chestBtn').onclick = () => {
      const b = $('chestBtn');
      if (b.classList.contains('open')) return;
      b.classList.add('open'); b.textContent = '✨';
      releaseChest(true);
      const items = ['hammer', 'swap'].filter(k => chest[k]).map(k => `+${chest[k]} ${k[0].toUpperCase() + k.slice(1)}`);
      $('chestTxt').innerHTML = `<span class="loot"><span class="coin"></span> +${chest.coins} · ${items.join(' · ')}</span><br>Helpers are saved for whenever you need them.`;
    };
  }

  function levelLost(why) {
    over = true; tool = null; sel = null;
    lv.result = 'lost';
    const n = lv.n, pr = loadProgress();
    pr.fails[n] = (pr.fails[n] || 0) + 1;
    const dropped = !pr.cleared[n] && !lv.streakHit && pr.streak > 0;
    if (dropped) { pr.streak = Math.max(0, pr.streak - 2); lv.streakHit = true; }
    saveProgress(pr);
    save();
    const easy = n <= 6;
    const canUndo = snap && coins - lastEarned >= priceOf('undo');
    const canSkip = pr.fails[n] >= 3 && n < LEVELS.length && pr.stars[n] === undefined;
    showOverlay(`
      <div class="tag">Level ${n}</div>
      <h2>${easy ? 'So close!' : why}</h2>
      <p>${easy ? 'Have another go — you\'ve got this.' : goalText(levelDef())}</p>
      ${dropped ? `<p class="streak">🔥 Win streak down to ${pr.streak}</p>` : ''}
      <button class="primary" id="retryBtn">↻ Try again</button>
      ${canUndo ? `<button id="goUndo">↶ Undo last shot${priceOf('undo') ? ` <span class="coin"></span> ${COST.undo}` : ' (free)'}</button>` : ''}
      ${canSkip ? '<button id="skipBtn">Skip this level</button>' : ''}
      <div class="row"><button id="mapBtn">🗺️ Map</button><button id="homeBtn2">🏠 Home</button></div>`);
    $('homeBtn2').onclick = showHome;
    $('retryBtn').onclick = () => startLevel(n);
    if (canUndo) $('goUndo').onclick = undo;
    if (canSkip) $('skipBtn').onclick = () => { const p = loadProgress(); p.stars[n] = 0; saveProgress(p); startLevel(n + 1); };
    $('mapBtn').onclick = showMap;
  }

  function showMap() {
    if (busy) return;
    releaseChest(false);
    const pr = loadProgress();
    const next = LEVELS.findIndex((_, i) => pr.stars[i + 1] === undefined) + 1;
    const cells = LEVELS.map((L, i) => {
      const n = i + 1, open = unlocked(n, pr), st = pr.stars[n];
      const cls = ['lv', n === next ? 'next' : '', L.hard ? 'hard' : ''].join(' ');
      const label = n === LEVELS.length ? '🎓' : L.chest && !pr.cleared[n] ? '🎁' : open ? n : '🔒';
      return `<button class="${cls}" data-n="${n}" ${open ? '' : 'disabled'}>${label}<span class="st">${st === undefined ? '' : '★'.repeat(st) || '–'}</span></button>`;
    }).join('');
    showOverlay(`
      <h2>🗺️ Levels</h2>
      <p>★ ${totalStars(pr)} / ${LEVELS.length * 3}</p>
      <div class="lv-grid">${cells}</div>
      <button id="closeBtn">Close</button>`);
    for (const b of document.querySelectorAll('.lv[data-n]')) b.onclick = () => startLevel(+b.dataset.n);
    $('closeBtn').onclick = hideOverlay;
  }

  function playEndless() {
    if (mode === 'level' && lv && !lv.result) save();   // keep the level attempt for later
    hideHome();
    mode = 'endless';
    if (!load('endless')) newGame();
    else if (isStuck()) gameOver();
    else hideOverlay();
    updateHud();
  }

  // ---------- home screen: pick a mode ----------
  // A level attempt that isn't finished yet, read without loading it.
  function savedLevel() {
    try {
      const d = JSON.parse(store.get(LEVEL_SAVE_KEY) || 'null');
      return d && d.lv && !d.lv.result ? d.lv.n : 0;
    } catch (e) { return 0; }
  }
  const homeOpen = () => $('home').classList.contains('show');

  function showHome() {
    if (busy) return;
    clearCoinFlights();               // coins are already saved; skip the fly-in
    tool = null; sel = null;
    if (mode === 'level' && lv && !lv.result) save();  // keep the attempt to continue
    hideOverlay();
    const pr = loadProgress();
    const cleared = Object.keys(pr.stars).length;
    const next = LEVELS.findIndex((_, i) => pr.stars[i + 1] === undefined) + 1;  // 0 = all done
    const cont = savedLevel();
    const levelLabel = cont ? `▶ Continue Level ${cont}` : next ? `▶ Play Level ${next}` : '🗺️ Replay a level';
    const hasEndless = !!store.get(SAVE_KEY);
    const tiles = [2, 4, 8].map(v => { const t = tileCss(v); return `<span style="background:${t.bg};color:${t.fg}">${v}</span>`; }).join('');
    const helperChips = ['hammer', 'swap', 'undo'].filter(k => inv[k])
      .map(k => `<div class="chip">${{ hammer: '🔨', swap: '⇄', undo: '↶' }[k]} ×${inv[k]}</div>`).join('');
    $('homeIn').innerHTML = `
      <div class="logo"><div class="tiles">${tiles}</div><h1>MERGE<br><span>QUEST</span></h1></div>
      <div class="chips">
        <div class="chip"><span class="coin"></span> ${coins.toLocaleString()}</div>
        <div class="chip">★ ${totalStars(pr)}</div>
        ${pr.streak ? `<div class="chip hot">🔥 ${pr.streak}</div>` : ''}
        ${infCount ? `<div class="chip">∞ ×${infCount}</div>` : ''}
        ${helperChips}
      </div>
      <div class="mode main">
        <div class="mode-head"><h3>🗺️ Levels</h3><span class="sub">${cleared} / ${LEVELS.length} cleared</span></div>
        <div class="bar"><i style="width:${(cleared / LEVELS.length) * 100}%"></i></div>
        <button class="primary play" id="hLevel">${levelLabel}</button>
        <div class="row"><button id="hMap">All levels</button>${cont ? '<button id="hRestartLv">↻ Restart level</button>' : ''}</div>
      </div>
      <div class="mode">
        <div class="mode-head"><h3>∞ Endless</h3><span class="sub">Best ${shortScore(best)}</span></div>
        <div class="row">
          <button class="${hasEndless ? 'primary' : ''} play" id="hEndless">${hasEndless ? '▶ Continue' : '▶ Play'}</button>
          ${hasEndless ? '<button id="hNew">New game</button>' : ''}
        </div>
      </div>
      <div class="row">
        <button id="hMiles">🏅 Milestones</button><button id="hBoard">🏆 Scores</button><button id="hHelp">? Help</button>
      </div>`;
    $('home').classList.add('show');
    $('hLevel').onclick = () => (cont ? resumeLevel() : next ? startLevel(next) : showMap());
    $('hMap').onclick = showMap;
    if (cont) $('hRestartLv').onclick = () => startLevel(cont);
    $('hEndless').onclick = playEndless;
    if (hasEndless) $('hNew').onclick = () => { if (mode === 'level') save(); newGame(); };
    $('hMiles').onclick = showMilestones;
    $('hBoard').onclick = showScoreboard;
    $('hHelp').onclick = showHelp;
  }
  function hideHome() { $('home').classList.remove('show'); }

  function resumeLevel() {
    if (mode === 'endless') save();     // keep the Endless run
    if (!load('level') || !lv || lv.result) { startLevel(savedLevel() || 1); return; }
    hideHome(); hideOverlay();
    updateHud();
  }

  // ---------- game state (one list, used by undo, save and load) ----------
  function captureState() {
    return { cols, rows, g: gridValues(), cur, nxt, nxt2, score, maxV, minE, oldStart,
      rescueUsed, freeUses: { ...freeUses }, mode, lv: lv && { ...lv } };
  }
  function applyState(d) {
    cols = d.cols || 5; rows = d.rows || 7;
    aim = Math.min(aim, cols - 1);     // keep the aim on a narrower board
    layout();
    setGrid(d.g);
    ({ cur, nxt, score, maxV } = d);
    minE = d.minE || 1;
    nxt2 = d.nxt2 || rollValue();       // tolerate saves missing newer fields
    oldStart = d.oldStart || 0;
    rescueUsed = !!d.rescueUsed;
    freeUses = { hammer: 0, swap: 0, undo: 0, ...d.freeUses };
    mode = d.mode || 'endless';
    lv = d.lv ? { ...d.lv } : null;
    resetShooter();
  }

  function takeSnap() {
    snap = { ...captureState(), inf: infCount };
    lastEarned = 0;
  }

  function setGrid(g) {
    grid = g.map((col, c) => col.map((v, r) => (v ? { v, x: cellX(c), y: cellY(r), s: 1, ty: cellY(r) } : null)));
  }

  function undo() {
    if (busy || !snap || helpersOff()) return;
    // coins earned by the undone play are taken back, so undo can't be farmed
    const price = priceOf('undo');
    if (coins - lastEarned < price) return;
    const freeUndos = freeUses.undo;
    clearCoinFlights();
    setCoins(coins - lastEarned);
    applyState(snap);
    freeUses.undo = freeUndos;         // the snapshot's count is from before this undo
    spend('undo');
    infCount = snap.inf; store.set(INF_KEY, String(infCount));
    snap = null; lastEarned = 0;
    over = false; tool = null; sel = null; praise = null;
    ghosts = []; floaters = []; flyers = []; bubbles = [];
    hideOverlay();
    banner = { text: 'Undone!', life: 0.9 };
    save();
    updateHud();
    if (isStuck()) gameOver();   // undid back into a stuck board
  }

  // ---------- core turn ----------
  async function fire(c) {
    if (busy || over || tool) return;
    const v = cur;
    const r = landingRow(c, v);
    if (r < 0) { shake = { c, t: 0.35 }; return; }
    takeSnap();
    busy = true;
    aim = c;
    if (lv) { lv.used++; if (lv.shots) lv.shotsLeft--; }

    const t = shooter;
    t.x = cellX(c);
    const full = count(c) === rows;
    const destY = full ? cellY(r) + cell * 0.6 : cellY(r);
    const dur = 0.13 + 0.032 * Math.max(0, (t.y - destY) / cell);
    t.fly = { y0: t.y, y1: destY, t: 0, dur, land: full ? 0 : 0.26, stretch: 0.2 };
    t.ty = destY;
    if (!full) grid[c][r] = t;
    else flyers.push(t);

    cur = nxt;
    nxt = nxt2;
    nxt2 = rollValue();
    resetShooter();
    updateHud();

    await sleep(dur * 1000 + (full ? 0 : 60));
    let combo = 0;
    if (full) {
      flyers = flyers.filter(f => f !== t);
      const target = grid[c][r];
      await bubbleMerge(target, [t], target.v * 2);
      addScore(target.v, c, r);
      combo = 1;
    }
    combo += await resolve([[c, r]]);
    rewardCombo(combo);
    if (mode === 'endless') tierCheck();
    else lv.bestCombo = Math.max(lv.bestCombo, combo);
    finishTurn();
  }

  function finishTurn() {
    busy = false;
    // the board has settled: re-check previewed tiles (e.g. a value whose only
    // match was just merged away, or that now exceeds the biggest block)
    if (!launchable(cur)) { cur = rollValue(); shooter.v = cur; shooter.s = 0.6; }
    if (!launchable(nxt)) nxt = rollValue();
    if (!launchable(nxt2)) nxt2 = rollValue();
    if (mode === 'level' && levelEnded()) { updateHud(); return; }
    if (isStuck()) gameOver();     // gameOver saves too
    else save();
    updateHud();
  }

  // Runs merges until the board is stable. Returns how many merges happened.
  async function resolve(focus) {
    let merges = 0;
    for (let guard = 0; guard < 200; guard++) {
      let hit = null;
      for (const [fc, fr] of focus) {
        if (grid[fc][fr] && eqNeighbors(fc, fr).length) { hit = [fc, fr]; break; }
      }
      if (!hit) {
        outer: for (let c = 0; c < cols; c++)
          for (let r = 0; r < rows; r++)
            if (grid[c][r] && eqNeighbors(c, r).length) { hit = [c, r]; break outer; }
      }
      if (!hit) return merges;

      const [hc, hr] = hit;
      const ns = eqNeighbors(hc, hr);
      // Merge into the block above when there is one: after the column settles the
      // result lands in the same cell either way, but visually the lower bubble
      // rises into the upper one instead of the upper being dragged down.
      let t = grid[hc][hr];
      const up = ns.findIndex(([nc, nr]) => nc === hc && nr === hr - 1);
      if (up >= 0) { const above = grid[hc][hr - 1]; ns[up] = [hc, hr]; t = above; }
      const srcs = ns.map(([nc, nr]) => { const o = grid[nc][nr]; grid[nc][nr] = null; return o; });
      merges += ns.length;                       // a 3-way merge counts as 2, a 4-way as 3
      if (lv) lv.bestMerge = Math.max(lv.bestMerge, ns.length + 1);
      const infPair = t.v >= INF;                // ∞ + ∞: both clear away for a bonus
      await bubbleMerge(t, srcs, t.v * Math.pow(2, ns.length)); // ×2, ×4 or ×8
      const tp = find(t) || [hc, hr];
      if (infPair) clearInfinity(t, tp);
      else addScore(t.v, tp[0], tp[1]);
      await sleep(srcs.length === 1 ? 100 : 130);

      const moved = compact();
      const pos = find(t);
      focus = pos ? [pos, ...moved] : moved;
      if (moved.length) await sleep(200);
    }
    return merges;
  }

  // Reaching a new level only announces it - blocks are never removed. Until the
  // old level's blocks are cleared, the launcher keeps mixing in their values.
  function tierCheck() {
    const want = 10 * tierOf(maxV) + 1;    // smallest value of the new tier's range
    if (want <= minE) return;
    minE = want;
    oldStart = oldBlocks().length;
    banner = { text: want >= 21 ? 'M blocks unlocked!' : 'K blocks unlocked!', life: 2.4 };
  }

  // Free: trade the current tile with the next one.
  const helpersOff = () => mode === 'level' && levelDef().noHelpers;
  function swap() {
    if (busy || over || tool || helpersOff()) return;
    [cur, nxt] = [nxt, cur];
    shooter.v = cur; shooter.s = 0.7; shooter.wob = { amp: 0.15, t: 0 };
    updateHud(); save();
  }

  // ---------- paid helpers ----------
  function toggleTool(name) {
    if (busy) return;
    if (tool === name) {
      tool = null; sel = null; updateHud();
      if (isStuck()) gameOver();   // backed out of a rescue: still stuck
      return;
    }
    if (over || coins < priceOf(name) || helpersOff()) return;
    tool = name; sel = null;
    hideOverlay();
    updateHud();
  }

  async function useToolAt(c, r) {
    if (busy || !tool) return;
    const t = grid[c] && grid[c][r];
    if (!t) return;
    if (tool === 'hammer') {
      takeSnap();
      spend('hammer');
      tool = null; busy = true;
      fadeGhost(t, cell * 0.5);
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2;
        floaters.push({ text: '✦', x: t.x + cell / 2, y: t.y + cell / 2, vx: Math.cos(a) * cell * 2, vy: Math.sin(a) * cell * 2, life: 0.6, color: colorOf(t.v) });
      }
      grid[c][r] = null;
      updateHud();
      await sleep(180);
      const moved = compact();
      if (moved.length) await sleep(200);
      const combo = await resolve(moved);
      rewardCombo(combo);
      finishTurn();
    } else if (tool === 'swap') {
      if (!sel) { sel = [c, r]; updateHud(); return; }
      const [sc, sr] = sel;
      if (sc === c && sr === r) { sel = null; updateHud(); return; }
      const o = grid[sc][sr];
      if (o.v === t.v) { sel = [c, r]; updateHud(); return; } // swapping equals does nothing
      takeSnap();
      spend('swap');
      tool = null; sel = null; busy = true;
      grid[sc][sr] = t; grid[c][r] = o;
      t.s = o.s = 1.15;
      t.wob = { amp: 0.12, t: 0 }; o.wob = { amp: 0.12, t: 0 };
      updateHud();
      await sleep(260);
      const combo = await resolve([[c, r], [sc, sr]]);
      rewardCombo(combo);
      finishTurn();
    }
  }

  // ---------- game lifecycle ----------
  function newGame() {
    mode = 'endless'; lv = null;
    cols = 5; rows = 7;
    layout();
    grid = Array.from({ length: cols }, () => Array(rows).fill(null));
    score = 0; maxV = 2; minE = 1; oldStart = 0; over = false; busy = false;
    ghosts = []; floaters = []; flyers = []; bubbles = []; banner = null; praise = null;
    tool = null; sel = null; snap = null; lastEarned = 0;
    clearCoinFlights();
    bag = []; bagKey = ''; rescueUsed = false; freeUses = { hammer: 0, swap: 0, undo: 0 };
    cur = rollValue(); nxt = rollValue(); nxt2 = rollValue();
    gameId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    resetShooter();
    hideOverlay(); hideHome();
    store.del(saveKey());
    updateHud();
  }

  // Saved after every move, game over included, so a reload can still offer
  // Undo / the rescue; New game (or Play again) is what clears it.
  function save() {
    store.set(BEST_KEY, String(best));
    store.set(saveKey(), JSON.stringify({ ...captureState(), snap, lastEarned, gameId }));
    store.set(MODE_KEY, mode);
  }

  function load(m = mode) {
    try {
      const d = JSON.parse(store.get(saveKey(m)) || 'null');
      if (!d || !Array.isArray(d.g)) return false;
      applyState(d);
      over = false;
      snap = d.snap || null; lastEarned = d.lastEarned || 0;
      gameId = d.gameId || Date.now().toString(36);
      compact();
      updateHud();
      return true;
    } catch (e) { return false; }
  }

  // ---------- scoreboard (top 10, saved on this device) ----------
  function loadBoard() {
    try {
      const b = JSON.parse(store.get(BOARD_KEY) || '[]');
      return Array.isArray(b) ? b.filter(e => e && typeof e.score === 'number') : [];
    } catch (e) { return []; }
  }
  function saveBoard(b) { store.set(BOARD_KEY, JSON.stringify(b)); }
  const sortBoard = b => b.sort((a, c) => c.score - a.score || a.date - c.date);

  // Rank this game would get (1-based), or 0 if it doesn't make the top 10.
  function rankFor(sc) {
    if (sc <= 0) return 0;
    const others = loadBoard().filter(e => e.id !== gameId);
    const rank = others.filter(e => e.score >= sc).length + 1;
    return rank <= BOARD_SIZE ? rank : 0;
  }

  function addToBoard(name) {
    let b = loadBoard().filter(e => e.id !== gameId); // continuing a game replaces its entry
    b.push({ id: gameId, name, score, tile: maxV, date: Date.now() });
    b = sortBoard(b).slice(0, BOARD_SIZE);
    saveBoard(b);
    store.set(INITIALS_KEY, name);
  }

  const esc = t => String(t).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  function boardHtml(highlightId) {
    const b = sortBoard(loadBoard());
    if (!b.length) return '<p class="board-empty">No scores yet — finish a game to get on the board!</p>';
    return '<ol class="board-list">' + b.map((e, i) => `
      <li class="${e.id === highlightId ? 'me' : ''}">
        <span class="rk">${i + 1}</span>
        <span class="nm">${esc(e.name)}</span>
        <span class="sc">${e.score.toLocaleString()}</span>
        <span class="tl">${fmt(e.tile || 2)}</span>
      </li>`).join('') + '</ol>';
  }

  function showScoreboard() {
    if (busy) return;
    showOverlay(`
      <h2>🏆 Scoreboard</h2>
      ${boardHtml(null)}
      <button class="primary" id="closeBtn">Close</button>`);
    $('closeBtn').onclick = hideOverlay;
  }

  function gameOver() {
    if (mode === 'level') return levelLost('No room left');
    over = true;
    tool = null; sel = null;
    save();
    const rank = rankFor(score);
    const already = loadBoard().some(e => e.id === gameId);
    renderGameOver(rank > 0 && !already ? 'enter' : 'board', rank);
    // continuing after saving: keep the saved entry up to date automatically
    if (already && rank > 0) {
      const e = loadBoard().find(x => x.id === gameId);
      if (e && score > e.score) { addToBoard(e.name); renderGameOver('board', rank); }
    }
  }

  function renderGameOver(view, rank) {
    const canUndo = snap && coins - lastEarned >= priceOf('undo');
    const canHammer = freeUses.hammer === 0 && coins >= COST.hammer;
    const canRescue = mode === 'endless' && (!rescueUsed || freeUses.hammer > 0) && countTiles() > 0;
    const entry = view === 'enter' ? `
      <div class="newhs">NEW HIGH SCORE — RANK #${rank}!</div>
      <p>Enter your initials</p>
      <input id="initials" class="initials" maxlength="3" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" value="${esc(store.get(INITIALS_KEY) || '')}" aria-label="Your 3 initials">
      <button class="primary" id="saveScore">Save score</button>` : boardHtml(gameId);
    showOverlay(`
      <h2>Board full!</h2>
      <div class="big">${score.toLocaleString()}</div>
      <p>Biggest tile: <b>${fmt(maxV)}</b> · Coins: <span class="coin"></span> <b>${coins.toLocaleString()}</b></p>
      ${entry}
      ${canRescue ? `<button class="primary" id="goRescue">🎁 Free Hammer — once per game</button>` : ''}
      ${canUndo || canHammer ? `<p>Keep going with a helper?</p><div class="row">
        ${canUndo ? `<button id="goUndo">↶ Undo <span class="coin"></span> ${COST.undo}</button>` : ''}
        ${canHammer ? `<button id="goHammer">🔨 Hammer <span class="coin"></span> ${COST.hammer}</button>` : ''}
      </div>` : ''}
      <div class="row"><button class="${view === 'enter' ? '' : 'primary'}" id="againBtn">Play again</button><button id="homeBtn2">🏠 Home</button></div>`);
    $('againBtn').onclick = newGame;
    $('homeBtn2').onclick = showHome;
    if (canUndo) $('goUndo').onclick = undo;
    if (canHammer) $('goHammer').onclick = () => { over = false; toggleTool('hammer'); };
    if (canRescue) $('goRescue').onclick = () => { if (!rescueUsed) { rescueUsed = true; freeUses.hammer++; } over = false; toggleTool('hammer'); };
    if (view === 'enter') {
      const inp = $('initials'), btn = $('saveScore');
      const sync = () => {
        const v = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 3);
        if (inp.value !== v) inp.value = v;
        btn.disabled = v.length !== 3;
      };
      const submit = () => {
        sync();
        if (inp.value.length !== 3) { inp.focus(); return; }
        addToBoard(inp.value);
        renderGameOver('board', rank);
      };
      inp.addEventListener('input', sync);
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
      btn.onclick = submit;
      sync();
      setTimeout(() => { try { inp.focus(); inp.select(); } catch (e) {} }, 50);
    }
  }

  function showHelp() {
    showOverlay(`
      <h2>How to play</h2>
      <ul>
        <li>Tap a column (or use ← → and Space) to shoot your tile up.</li>
        <li>Tiles stick to the ceiling. Equal numbers that touch merge and double.</li>
        <li>Chain 2+ merges in one shot for a <b>combo</b>. Bigger combos earn bigger praise and more <span class="coin"></span> coins.</li>
        <li>Spend coins on helpers: <b>Swap</b> two blocks (200), <b>Hammer</b> a block (250), or <b>Undo</b> your last play (25).</li>
        <li>Switch (S) trades your current tile with the next one — free.</li>
        <li>Three levels: <b>2–2048</b>, then <b>4K–2048K</b>, then <b>4M–2048M</b>, each with fancier blocks. Leftover blocks from the previous level keep turning up in the launcher until you've cleared them.</li>
        <li>Merge past 2048M to make an <b>∞ block</b> — the ultimate tile. Each new ∞ pays 500 coins, and two ∞ that touch clear away for 250 more. Your ∞ count is shown at the top.</li>
        <li>Stuck? Once per game you get a free Hammer to dig yourself out.</li>
        <li>Game ends when neither tile can be placed.</li>
        <li><b>🏠 Home</b> → Levels: 24 levels on growing boards, each with a goal and a shot limit. Earn up to 3 stars per level.</li>
        <li>Win new levels in a row to build a 🔥 <b>streak</b>: at 3 you start levels with a free Hammer, at 5 a free Swap too. A loss only knocks it down 2.</li>
        <li>Levels 10 and 20 hold a 🎁 <b>chest</b>, and your first 2048, 4K, 4M and ∞ each pay a one-time 🏅 <b>bounty</b>.</li>
      </ul>
      <div class="row"><button id="boardBtn">🏆 Scoreboard</button><button class="primary" id="closeBtn">Got it</button></div>`);
    $('closeBtn').onclick = hideOverlay;
    $('boardBtn').onclick = showScoreboard;
  }

  function showOverlay(html) { $('card').innerHTML = html; $('overlay').classList.add('show'); }
  function hideOverlay() { $('overlay').classList.remove('show'); }

  // ---------- rendering ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // Look of a block by tier: face gradient, base lip, rim, text colours, extras.
  const styleCache = new Map();
  function tileStyle(v) {
    if (styleCache.has(v)) return styleCache.get(v);
    const e = log2(v), t = tierOfE(e);
    let st;
    if (t === 0) {
      const c = colorOf(v);
      st = { top: shade(c, 0.16), bot: shade(c, -0.06), lip: shade(c, -0.42), stroke: shade(c, -0.6),
        gloss: 0.13, glow: v >= 2048 ? c : null, rim: null, shimmer: false };
    } else if (t === 1 || t === 2) {
      const [h, s0, l0] = baseHsl(e, t);
      // brighter versions of the same muted hues, soft champagne rim; M adds a shine
      const s = s0 + 14 * t, l = l0 + (t === 1 ? 7 : 11);
      st = { top: hsl(h, s, l + 8), bot: hsl(h + (t === 2 ? 10 : 0), s, l - 4), lip: hsl(h, s - 10, l - 26),
        stroke: hsl(h, s - 15, l - 38), gloss: 0.2, glow: hsl(h, s, l),
        rim: t === 1 ? ['rgba(255,244,214,.75)', 'rgba(232,206,150,.55)'] : ['#fff6dd', '#e9cf8f', '#b89452'],
        rimW: t === 1 ? 0.018 : 0.028, shimmer: t === 2 };
    } else {
      st = { top: '#3b1f63', bot: '#120b22', lip: '#07040f', stroke: '#2a1700',
        gloss: 0.16, glow: '#a78bfa', rim: 'rainbow', rimW: 0.045, shimmer: true, inf: true };
    }
    styleCache.set(v, st);
    return st;
  }

  // Same look for the small DOM "Next" preview.
  function tileCss(v) {
    const st = tileStyle(v);
