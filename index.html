<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Shoot number tiles, chain merges into combos, earn coins. Works offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Merge Quest</title>
<style>
  @font-face { font-family: "Fredoka"; src: url(fonts/fredoka.woff2) format("woff2"); font-weight: 300 700; font-display: swap; }
  @font-face { font-family: "Lilita One"; src: url(fonts/lilita-one.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  :root {
    --bg: #1a1147;
    --panel: #2a1f66;
    --panel-2: #3a2c86;
    --text: #f3f0ff;
    --muted: #a49dd0;
    --accent: #ffd34d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    height: 100dvh;
    background: radial-gradient(120% 60% at 50% 0%, #2d1f78, var(--bg) 70%) fixed, var(--bg);
    color: var(--text);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    height: 100dvh;
    max-width: 520px;
    margin: 0 auto;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    gap: 10px;
  }
  header { display: flex; gap: 8px; align-items: stretch; }
  .stat {
    background: linear-gradient(#35278a, var(--panel)); border: 2px solid rgba(255,255,255,.12);
    border-radius: 12px;
    padding: 6px 10px;
    flex: 1;
    text-align: center;
    min-width: 0;
  }
  .stat small {
    display: block;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
  }
  .stat b { font-family: "Lilita One", "Fredoka", sans-serif; font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; display: inline-block; white-space: nowrap; }
  .stat { overflow: hidden; }
  #wrap { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  footer { display: flex; gap: 6px; align-items: center; }
  .next {
    display: flex; align-items: center; gap: 6px; flex: none;
    background: var(--panel); border-radius: 12px; padding: 6px 8px;
    font-size: 11px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase;
  }
  #nextTile, #nextTile2 {
    width: 46px; height: 46px; border-radius: 11px; flex: none;
    display: grid; place-items: center; padding-bottom: 4px; overflow: hidden;
    font: 400 20px/1 "Lilita One", "Fredoka", system-ui, sans-serif;
    color: #fff; letter-spacing: 0; white-space: nowrap;
    -webkit-text-stroke: .17em #1a1533; paint-order: stroke fill;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.28), inset 0 3px 0 rgba(255,255,255,.3), 0 3px 0 rgba(0,0,0,.35);
  }
  #nextTile2 { width: 34px; height: 34px; border-radius: 9px; padding-bottom: 3px; opacity: .9; }
  button {
    font: inherit; font-weight: 600; color: var(--text);
    background: linear-gradient(#4a3aa6, var(--panel-2)); border: 0; border-radius: 14px;
    padding: 12px 14px; cursor: pointer; flex: 1; white-space: nowrap;
    box-shadow: 0 4px 0 #1c1452, inset 0 2px 0 rgba(255,255,255,.14);
  }
  button:hover { filter: brightness(1.12); }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c1452, inset 0 2px 0 rgba(255,255,255,.14); }
  button.primary { background: linear-gradient(#fff07a, #ffd21f 50%, #ffb800); color: #2b1660;
    box-shadow: 0 4px 0 #c98200, inset 0 2px 0 rgba(255,255,255,.6); }
  button.primary:active { box-shadow: 0 1px 0 #c98200, inset 0 2px 0 rgba(255,255,255,.6); }
  button:disabled { box-shadow: none; }
  .hint { text-align: center; font-size: 12px; color: var(--muted); min-height: 16px; }
  #overlay {
    position: fixed; inset: 0; display: none;
    background: rgba(10, 8, 24, .78);
    align-items: center; justify-content: center; padding: 16px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  .card {
    background: linear-gradient(#3d2c95, #2a1d6e); border-radius: 24px; padding: 22px;
    border: 3px solid rgba(255,255,255,.2); box-shadow: 0 8px 0 #160f45, 0 18px 40px rgba(0,0,0,.45);
    width: 100%; max-width: 340px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
    max-height: calc(100dvh - 32px); overflow-y: auto;
  }
  .newhs { color: var(--accent); font-weight: 800; font-size: 15px; letter-spacing: .04em; }
  .initials {
    width: 100%; font: 900 34px "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
    text-align: center; letter-spacing: .5em; text-indent: .5em; text-transform: uppercase;
    background: #17142b; color: var(--text); border: 2px solid var(--panel-2);
    border-radius: 12px; padding: 8px 0; outline: none;
  }
  .initials:focus { border-color: var(--accent); }
  .initials { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
  .card { touch-action: pan-y; }
  /* close (✕) and back (‹) buttons sit on the card's corners, outside its scroll area */
  .card-wrap { position: relative; width: 100%; max-width: 340px; }
  .card-wrap .card { max-width: none; }
  .x-btn, .back-btn {
    position: absolute; top: -12px; width: 42px; height: 42px; padding: 0; border-radius: 50%; display: none;
    font: 700 20px/1 "Fredoka", system-ui, sans-serif; color: #fff; z-index: 2;
    background: linear-gradient(#ff7a7a, #e5484d); border: 3px solid #fff; box-shadow: 0 3px 0 #8f1f1a, 0 4px 10px rgba(0,0,0,.4);
  }
  .x-btn { right: -10px; }
  .back-btn { left: -10px; background: linear-gradient(#8b7cf6, #5b45c4); box-shadow: 0 3px 0 #2e2391, 0 4px 10px rgba(0,0,0,.4); font-size: 28px; padding-bottom: 3px; }
  .x-btn.show, .back-btn.show { display: block; }
  /* footer: square restart / help buttons */
  #restartBtn, #helpBtn { flex: 0 0 46px; padding: 12px 0; font-size: 20px; }
  #swapBtn { min-width: 0; padding: 12px 8px; }
  @media (max-width: 399px) { .next .lbl { display: none; } }
  @media (max-width: 350px) { #swapBtn .sw-t { display: none; } }
  /* helpers locked on no-helper levels */
  button.locked { position: relative; background: #221a52; color: rgba(255,255,255,.4); box-shadow: none;
    border: 2px dashed rgba(255,255,255,.4); }
  button.locked .ic, button.locked .pr { opacity: .55; filter: grayscale(1); }
  button.locked .pr { color: rgba(255,255,255,.6); }
  button.locked::after { content: '🔒'; position: absolute; top: -8px; right: -6px; font-size: 16px; filter: none;
    background: #e5484d; border-radius: 50%; width: 24px; height: 24px; line-height: 24px; text-align: center;
    box-shadow: 0 2px 0 #8f1f1a; }
  /* goal button + card */
  .goal-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .goal-btn {
    position: relative; flex: none; padding: 5px 14px 5px 10px; border-radius: 99px; font-size: 15px; font-weight: 700;
    background: linear-gradient(#4a3aa6, var(--panel-2)); color: #fff; box-shadow: 0 3px 0 #1c1452;
  }
  .goal-btn .dot { position: absolute; top: -3px; right: -3px; width: 13px; height: 13px; border-radius: 50%;
    background: #ff3b3b; border: 2px solid #fff; }
  .goal-btn .dot.new { animation: dotPulse 1.1s ease-in-out infinite; }
  @keyframes dotPulse { 50% { transform: scale(1.35); box-shadow: 0 0 0 5px rgba(255,59,59,.35); } }
  .goal-row .meta { font-size: 13px; color: var(--muted); }
  .goal-row .meta b { color: var(--text); }
  .goal-big { font: 400 34px/1.15 "Lilita One", "Fredoka", sans-serif; }
  .goal-big b { color: var(--accent); }
  .gbar { height: 14px; background: rgba(0,0,0,.3); border-radius: 99px; overflow: hidden; }
  .gbar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd34d, #ff9f43); border-radius: 99px; }
  .gfacts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .gfacts span { background: rgba(255,255,255,.08); border-radius: 99px; padding: 5px 12px; font-size: 14px; }
  .board-list { list-style: none; padding: 0; margin: 0; text-align: left; font-variant-numeric: tabular-nums; }
  .board-list li {
    display: grid; grid-template-columns: 28px 52px 1fr auto; gap: 8px; align-items: center;
    padding: 6px 10px; border-radius: 10px; font-size: 15px;
  }
  .board-list li:nth-child(odd) { background: rgba(255,255,255,.04); }
  .board-list li.me { background: rgba(255,211,77,.18); outline: 1px solid rgba(255,211,77,.6); }
  .board-list .rk { color: var(--muted); font-weight: 700; }
  .board-list .nm { font-weight: 900; letter-spacing: .12em; }
  .board-list .sc { font-weight: 800; text-align: right; }
  .board-list .tl { color: var(--muted); font-size: 12px; text-align: right; }
  .board-empty { color: var(--muted); font-size: 14px; }
  #bestBox { cursor: pointer; }
  .goal { color: var(--text); font-weight: 700; }
  .goal b { color: var(--accent); }
  .lv-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .lv {
    aspect-ratio: 1; padding: 0; border-radius: 12px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px; font-size: 17px; font-weight: 800;
    background: var(--panel-2); position: relative;
  }
  .worlds { display: flex; flex-direction: column; gap: 14px; max-height: min(58vh, 520px); overflow-y: auto; padding: 6px 4px; margin: 0 -4px; }
  .world h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; text-align: left;
    font: 400 18px "Lilita One", "Fredoka", sans-serif; letter-spacing: .02em; }
  .world h3 span { font: 700 13px "Fredoka", sans-serif; color: var(--accent); }
  .world.locked h3 { color: var(--muted); }
  .lv .st { font-size: 10px; letter-spacing: 1px; color: var(--accent); min-height: 12px; }
  .lv.next { background: var(--accent); color: #1a1533; }
  .lv.next .st { color: #1a1533; }
  /* difficulty tiers: normal levels carry no label */
  .lv.hard { background: linear-gradient(#ff8a4c, #e0453a); box-shadow: 0 4px 0 #8f1f1a, 0 0 10px rgba(255,107,74,.55); }
  .lv.super { background: linear-gradient(#9d6bff, #4c1d95); box-shadow: 0 4px 0 #2a0c5c, 0 0 12px rgba(180,108,255,.7); }
  .lv.hard::after, .lv.super::after { position: absolute; top: -9px; right: -7px; font-size: 15px; line-height: 1;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .lv.hard::after { content: '🔥'; }
  .lv.super::after { content: '💀'; }
  .lv.hard .st, .lv.super .st { color: #fff6c8; }
  .lv.next.hard, .lv.next.super { outline: 3px solid var(--accent); outline-offset: 1px; }
  .tier-ribbon {
    align-self: center; margin-top: -4px; padding: 6px 16px; border-radius: 10px;
    font: 400 18px "Lilita One", "Fredoka", sans-serif; letter-spacing: .06em; color: #fff;
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .card.tier-hard { background: linear-gradient(#c2413a, #6e1630); border-color: #ff9a6b;
    box-shadow: 0 8px 0 #3d0a18, 0 0 32px rgba(255,107,74,.55); }
  .card.tier-hard .tier-ribbon { background: linear-gradient(#ffb14a, #ff5a36); box-shadow: 0 3px 0 #8f1f1a; }
  .card.tier-super { background: linear-gradient(#5b21b6, #1e0b4a); border-color: #c084fc;
    box-shadow: 0 8px 0 #12062e, 0 0 40px rgba(180,108,255,.75); }
  .card.tier-super .tier-ribbon { background: linear-gradient(#c084fc, #7c3aed); box-shadow: 0 3px 0 #2a0c5c; }
  .card.tier-hard p, .card.tier-super p { color: #f3e8ff; }
  .tier-note { font-size: 13px !important; opacity: .9; }
  .tier-pill { display: inline-block; padding: 1px 8px; border-radius: 99px; font-weight: 700; font-size: 11px; color: #fff; margin-right: 4px; vertical-align: 1px; }
  .tier-pill.hard { background: #e0453a; }
  .tier-pill.super { background: #7c3aed; }
  .card .small { font-size: 12px; margin-top: -6px; }
  .boost-head { font: 400 15px "Lilita One", "Fredoka", sans-serif; letter-spacing: .05em; opacity: .85; margin-bottom: -6px; }
  .boost-row { display: flex; gap: 8px; }
  .boost { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; min-width: 0;
    background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.14); box-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .boost .bi { font-size: 24px; line-height: 1.1; }
  .boost .bn { font-size: 13px; font-weight: 700; white-space: nowrap; }
  .boost .bp { font-size: 12px; color: var(--accent); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .boost.on { background: rgba(255,211,77,.22); border-color: var(--accent); box-shadow: 0 0 12px rgba(255,211,77,.5), 0 3px 0 rgba(0,0,0,.3); }
  .boost.on::after { content: '✓'; position: absolute; }
  .boost { position: relative; }
  .boost.on::after { top: -7px; right: -5px; background: var(--accent); color: #2b1660; border-radius: 50%;
    width: 20px; height: 20px; font-size: 13px; line-height: 20px; font-weight: 900; }
  .boost:disabled { opacity: .45; filter: grayscale(.6); }
  .boost:disabled .bp { color: var(--muted); }
  button.cont { font-size: 17px; }
  .stars { font-size: 34px; letter-spacing: 6px; color: var(--accent); }
  .stars .off { color: #4a4470; }
  .tag { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  #infBox { flex: 0 0 auto; min-width: 58px; padding: 6px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #infBox b { font-size: 15px; color: var(--accent); }
  #infBox b::before { content: '×'; font-size: 12px; opacity: .8; margin-right: 1px; }
  .infIcon {
    width: 30px; height: 24px; border-radius: 6px; display: grid; place-items: center;
    font: 900 20px/1 system-ui, sans-serif; color: #fde68a; text-shadow: 0 1px 0 #3b1d02;
    background: linear-gradient(160deg, #2a1745, #140f24);
    box-shadow: 0 0 0 2px #f472b6, 0 0 0 3px #22d3ee, 0 0 10px rgba(167,139,250,.6);
  }
  #infBox.pop { animation: infPop .7s ease-out; }
  @keyframes infPop { 30% { transform: scale(1.25); } to { transform: scale(1); } }
  .card h2 { font: 400 30px "Lilita One", "Fredoka", sans-serif; letter-spacing: .01em; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
  .card p { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .card .big { font-size: 40px; font-weight: 800; color: var(--accent); }
  .card ul { text-align: left; color: var(--muted); font-size: 14px; line-height: 1.5; padding-left: 18px; }
  .card .row { display: flex; gap: 8px; }
  .card .row button { padding: 10px 6px; font-size: 15px; min-width: 0; }
  .coin {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff3b0, #ffc93c 55%, #d99a12);
    box-shadow: inset 0 0 0 1.5px #b07a08; vertical-align: -2px;
  }
  .tools { display: flex; gap: 8px; align-items: stretch; }
  .wallet {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel); border-radius: 12px; padding: 0 12px;
    font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums;
    min-width: 86px; justify-content: center; transition: transform .15s;
  }
  .wallet.bump { transform: scale(1.15); }
  .wallet { position: relative; }
  #coinLayer { position: fixed; inset: 0; pointer-events: none; z-index: 11; overflow: hidden; }
  .fcoin {
    position: absolute; left: 0; top: 0; width: 24px; height: 24px; margin: -12px 0 0 -12px;
    border-radius: 50%; will-change: transform;
    background: radial-gradient(circle at 35% 30%, #fff6c4, #ffd047 45%, #e0a015 80%, #b07a08);
    box-shadow: inset 0 0 0 2px rgba(176,122,8,.9), inset 0 0 0 5px rgba(255,236,150,.55), 0 2px 6px rgba(0,0,0,.35);
  }
  .fcoin::after {
    content: ''; position: absolute; inset: 7px; border-radius: 50%;
    border: 2px solid rgba(176,122,8,.55);
  }
  .coin-plus {
    position: absolute; left: 50%; top: -6px; transform: translate(-50%, 0);
    color: var(--accent); font-weight: 900; font-size: 16px; white-space: nowrap;
    text-shadow: 0 2px 0 #1a1533, 0 0 8px rgba(255,211,77,.6);
    animation: coinPlus 1s ease-out forwards; pointer-events: none;
  }
  @keyframes coinPlus { from { opacity: 0; transform: translate(-50%, 6px) scale(.7); }

    to { opacity: 0; transform: translate(-50%, -30px) scale(1); } }
  .sparkle {
    position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;

  }
  .wallet .coin { width: 18px; height: 18px; }
  .tool { padding: 7px 6px; line-height: 1.15; }
  .tool .ic { font-size: 18px; display: block; }
  .tool .nm { font-size: 12px; display: block; }
  .tool .pr { font-size: 11px; color: var(--accent); display: block; }
  .tool.active { background: var(--accent); color: #1a1533; }
  .tool.active .pr { color: #1a1533; }
  .tool:disabled { opacity: .4; cursor: not-allowed; filter: none; transform: none; }
  #homeBtn { flex: 0 0 auto; padding: 0 14px; font-size: 22px; background: linear-gradient(#35278a, var(--panel)); border: 2px solid rgba(255,255,255,.12); }
  /* ---------- home screen ---------- */
  #home {
    position: fixed; inset: 0; z-index: 9; display: none; overflow: hidden;
    background: linear-gradient(#2f8fe8, #7cc8ff 45%, #bfe6ff 60%, #6cc24a 61%);
    font-family: "Fredoka", system-ui, sans-serif;
  }
  #home.show { display: block; }

  .home-in {
    position: relative; height: 100%; max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column; align-items: stretch;

  .logo { position: relative; margin: 2px auto 0; width: min(80%, 340px); }
  .logo svg { display: block; width: 100%; height: auto; overflow: visible; }
  .twinkle { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

    position: absolute; left: 50%; top: 45%; width: 120%; aspect-ratio: 1; transform: translate(-50%, -50%);

  }
  .glow { position: absolute; left: 50%; top: 42%; width: 50%; aspect-ratio: 1; transform: translate(-50%, -50%);

<body>
<div id="app">
  <header>
    <button id="homeBtn" title="Home (M)" aria-label="Home">🏠</button>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
    <div class="stat" id="bestBox" title="Scoreboard"><small id="bestLabel">Best 🏆</small><b id="best">0</b></div>
    <div class="stat" id="infBox" title="∞ blocks collected"><span class="infIcon">∞</span><b id="infCount">0</b></div>
  </header>
  <div id="wrap"><canvas id="c"></canvas></div>
  <div class="hint" id="hint">Tap a column to shoot. Matching numbers merge.</div>
  <div class="tools">
    <div class="wallet" id="wallet" title="Coins: earned from combos"><span class="coin"></span><span id="coins">0</span></div>
    <button class="tool" id="tSwap" title="Swap any two blocks on the board"><span class="ic">⇄</span><span class="nm">Swap</span><span class="pr">200</span></button>
    <button class="tool" id="tHammer" title="Smash any block (H)"><span class="ic">🔨</span><span class="nm">Hammer</span><span class="pr">250</span></button>
    <button class="tool" id="tUndo" title="Undo the last play (U / Ctrl+Z)"><span class="ic">↶</span><span class="nm">Undo</span><span class="pr">25</span></button>
  </div>
  <footer>
    <div class="next"><span class="lbl">Next</span><div id="nextTile"></div><div id="nextTile2" title="After that"></div></div>
    <button id="swapBtn" title="Switch current and next tile (S) — free" aria-label="Switch">⇅<span class="sw-t"> Switch</span></button>
    <button id="restartBtn" title="Restart (N)" aria-label="Restart">↻</button>
    <button id="helpBtn" title="How to play" aria-label="How to play">?</button>
  </footer>
</div>

<div id="home"><div class="home-in" id="homeIn"></div></div>
<div id="toast"></div>
<div id="coinLayer"></div>
<div id="overlay">
  <div class="card-wrap">
    <div class="card" id="card"></div>
    <button class="x-btn" id="xBtn" aria-label="Close">✕</button>
    <button class="back-btn" id="backBtn" aria-label="Back">‹</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  let cols = 5, rows = 7;          // board size: 5x7 in Endless, set per level in Level mode
  const MAX_CELL = 96;             // small level boards don't blow up to giant tiles
  const SAVE_KEY = 'mergeQuest.save.v1';           // Endless game in progress
  const LEVEL_SAVE_KEY = 'mergeQuest.levelSave.v1';  // level attempt in progress
  const MODE_KEY = 'mergeQuest.mode.v1';
  const DAILY_SAVE_KEY = 'mergeQuest.dailySave.v1';  // daily challenge attempt in progress
  const saveKey = (m = mode) => (m === 'level' ? LEVEL_SAVE_KEY : m === 'daily' ? DAILY_SAVE_KEY : SAVE_KEY);
  const BEST_KEY = 'mergeQuest.best.v1';
  const COIN_KEY = 'mergeQuest.coins.v1';
  const BOARD_KEY = 'mergeQuest.scoreboard.v1';
  const INITIALS_KEY = 'mergeQuest.initials.v1';
  const BOARD_SIZE = 10;
  const START_COINS = 50;
  const COST = { swap: 200, hammer: 250, undo: 25 };
  // combo = merges set off by one play (chain reactions included).
  // [min combo, praise, coins, colour]
  const PRAISE = [
    [2, 'Nice!',        2,   '#6cc8ff'],
    [3, 'Great!',       4,   '#4fe0b0'],
    [4, 'Excellent!',   8,  '#a7e35c'],
    [5, 'Amazing!',     12,  '#ffd34d'],
    [6, 'Incredible!',  20,  '#ffa04a'],
    [7, 'Unstoppable!', 30,  '#ff6f6f'],
    [8, 'Legendary!',   45,  '#ff62a8'],
    [10, 'GODLIKE!!',   75, '#c983ff'],
  ];
  // Each level ("tier") has its own look; higher tiers are more premium.
  // Tier 0: 2 … 2048 · Tier 1: 4K … 2048K · Tier 2: 4M … 2048M · then ∞.
  // Skins: coin sinks that recolour the blocks and the board. Each palette
  // gives 2, 4, 8 … 2048 their colours; K and M blocks derive from it.
  const SKINS = [
    { id: 'classic', name: 'Classic', price: 0, board: ['#1b1830', '#26223d', '#2d2948'],
      pal: ['#7d8bd6', '#3fa39a', '#d0875e', '#9170c4', '#57a062', '#d06a92', '#4c80c6', '#c9a243', '#b8585d', '#46a9c4', '#dd6079'] },
    { id: 'candy', name: 'Candy', price: 500, board: ['#2b1730', '#3a2142', '#47294f'],
      pal: ['#f27ea9', '#5fc9b0', '#f6a75b', '#a982ea', '#7cc46e', '#ff7f7f', '#6fa6ec', '#e9bf4c', '#d978c0', '#4fc0d8', '#ff8f6b'] },
    { id: 'ocean', name: 'Ocean', price: 750, board: ['#0e2033', '#142c45', '#1b3756'],
      pal: ['#3f86d9', '#25b3a6', '#f2a541', '#6a6fe0', '#2fc4d6', '#ef6f6c', '#2a6fb5', '#9bd16a', '#5a4fc9', '#33a3dd', '#ff8c5a'] },
    { id: 'neon', name: 'Neon', price: 1000, board: ['#0b0912', '#15111f', '#1f1830'],
      pal: ['#ff3d9a', '#00d6bd', '#ffae00', '#8f5bff', '#2fd650', '#ff5a3d', '#00a8f0', '#d4e800', '#f23de0', '#20e8a6', '#ff7a00'] },
    { id: 'royal', name: 'Royal', price: 1500, board: ['#1d1430', '#2a1d44', '#352654'],
      pal: ['#c9a243', '#7d4fc9', '#c0504d', '#3f8f7a', '#d9a03a', '#9b5fd9', '#b8862f', '#2f6fb0', '#cf7a3a', '#8a4fb8', '#a8323e'] },
    { id: 'sunset', name: 'Sunset', price: 1000, board: ['#2a1420', '#3a1c2c', '#472338'],
      pal: ['#ff8a5c', '#ffb347', '#ff6f91', '#c06c84', '#f8b195', '#f67280', '#ffd166', '#e76f51', '#ef476f', '#f4a261', '#ff9f1c'] },
    { id: 'forest', name: 'Forest', price: 1000, board: ['#0f1f16', '#163024', '#1d3b2d'],
      pal: ['#6bbf59', '#3e8e7e', '#c9a15b', '#8fb339', '#5fa8a0', '#d97b4f', '#4f9d69', '#e0c068', '#a3784e', '#7cc4a4', '#b5d16a'] },
    { id: 'quarry', name: 'Quarry', price: 1200, board: ['#22201c', '#2e2b26', '#3a3630'],
      pal: ['#c8a27a', '#8fa3a8', '#d9825b', '#9c8a74', '#b5b26b', '#c46d5e', '#7a95a8', '#e0b35b', '#a7786a', '#89b0a0', '#d6966b'] },
    { id: 'frost', name: 'Frost', price: 1200, board: ['#0d1b2e', '#13263f', '#1a3150'],
      pal: ['#8ecdf5', '#5fb3c9', '#c3d9f0', '#7f9be6', '#a6e3e9', '#e58fb0', '#5d8fd6', '#d8e9f5', '#9a88e0', '#74d1d8', '#b6c8ff'] },
  ];
  const SKIN_KEY = 'mergeQuest.skins.v1';   // { owned: [ids], on: id }
  function loadSkins() {
    try { const d = JSON.parse(store.get(SKIN_KEY) || 'null'); if (d && Array.isArray(d.owned)) return d; } catch (e) {}
    return { owned: ['classic'], on: 'classic' };
  }
  // Cosmetics bought in the Shop's Style tab: faces on the tiles, the merge burst
  // and a trail behind each shot.
  const STYLE_KEY = 'mergeQuest.style.v1';
  const STYLE_ITEMS = {
    fx: [
      { id: 'bubbles', name: 'Bubbles', icon: '🫧', price: 0 },
      { id: 'stars', name: 'Stars', icon: '⭐', price: 600 },
      { id: 'hearts', name: 'Hearts', icon: '💖', price: 700 },
      { id: 'confetti', name: 'Confetti', icon: '🎊', price: 800 },
    ],
    trail: [
      { id: 'none', name: 'None', icon: '▫️', price: 0 },
      { id: 'sparkle', name: 'Sparkle', icon: '✨', price: 500 },
      { id: 'comet', name: 'Comet', icon: '☄️', price: 700 },
      { id: 'rainbow', name: 'Rainbow', icon: '🌈', price: 900 },
    ],
  };
  const FACES_PRICE = 1500;
  function loadStyle() {
    const d = { owned: [], faces: false, fx: 'bubbles', trail: 'none' };
    try { Object.assign(d, JSON.parse(store.get(STYLE_KEY) || '{}')); } catch (e) {}
    return d;
  }
  let look = loadStyle();
  const saveLook = () => store.set(STYLE_KEY, JSON.stringify(look));
  let skin = SKINS.find(k => k.id === loadSkins().on) || SKINS[0];
  let PALETTE = skin.pal;   // level 1 colours (higher levels derive from these)
  const INF = 4294967296;   // 2^32: anything past 2048M becomes ∞
  // Stone blockers (Level mode): never merge. A merge next to one cracks it,
  // a second one breaks it. Stored in the grid as negative values.
  const STONE = -2, CRACKED = -1;
  // Wild Tile (a pre-level booster): a rainbow block that becomes whatever value
  // helps most where it lands. 1 is never a normal tile value (they start at 2).
  const WILD = 1;
  const S = STONE;                  // shorthand for level start boards
  // Frozen blocks (World 3): a normal number locked in ice. Stored as -2v (so a
  // frozen 8 is -16, never clashing with stones at -1/-2) and treated like a
  // stone everywhere: it can't merge. A merge next to it thaws it into v.
  const F = v => -2 * v;
  const isFrozen = v => v <= -4;
  const thawed = v => -v / 2;
  const INF_KEY = 'mergeQuest.infinity.v1';
  const FONT = '"Fredoka", "Arial Rounded MT Bold", "Nunito", "Varela Round", "Trebuchet MS", system-ui, sans-serif';
  const PAIR_MS = 220;    // suck-in time when just two blocks merge
  const MERGE_MS = 280;   // suck-in time per block when 3+ blocks merge
  const STAGGER_MS = 100; // delay before each extra block starts (multi-merges)
  // mix a #rrggbb colour toward white (f > 0) or black (f < 0)
  const shadeCache = new Map();
  function shade(hex, f) {
    const key = hex + f;
    if (shadeCache.has(key)) return shadeCache.get(key);
    const n = parseInt(hex.slice(1), 16);
    const t = f < 0 ? 0 : 255, a = Math.abs(f);
    const ch = sh => Math.round(((n >> sh) & 255) + (t - ((n >> sh) & 255)) * a);
    const out = `rgb(${ch(16)},${ch(8)},${ch(0)})`;
    shadeCache.set(key, out);
    return out;
  }

  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const wrap = $('wrap');

  // ---------- storage (never trusted to exist) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ---------- state ----------
  let grid, cur, nxt, nxt2, shooter, score, best, maxV, minE, over;
  let bag = [], bagKey = '';          // shuffled launch bag (fairer than pure random)
  let rescueUsed = false;            // Endless: one free Hammer per game when stuck
  let freeUses = { hammer: 0, swap: 0, undo: 0 };  // free helper uses (rescue, level samples)
  let aim = 2, busy = false;
  let mode = ['level', 'daily'].includes(store.get(MODE_KEY)) ? store.get(MODE_KEY) : 'endless';
  let lv = null;                     // current level or daily attempt
  // Level and Daily play the same way (goal, shots, stars); only Endless differs.
  const levelish = () => mode !== 'endless';
  let ghosts = [], floaters = [], banner = null, shake = null, praise = null;
  let flyers = [], bubbles = [];  // shots heading for a full column; merge bubbles
  let tool = null, sel = null;      // active helper ('swap' | 'hammer') and first swap pick
  let snap = null, lastEarned = 0;  // undo snapshot and coins earned by that play
  let gameId = '';                  // identifies this game's scoreboard entry
  let coinFlights = [], coinPending = 0;  // coins flying to the wallet, not yet shown
  let oldStart = 0;                 // old-level blocks on the board when the level began
  let infCount = parseInt(store.get(INF_KEY) || '0', 10) || 0;  // ∞ blocks ever made
  best = parseInt(store.get(BEST_KEY) || '0', 10) || 0;
  let coins = parseInt(store.get(COIN_KEY) ?? String(START_COINS), 10);
  if (!Number.isFinite(coins) || coins < 0) coins = START_COINS;

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const log2 = v => Math.round(Math.log2(v));
  // tier of a value: 0 = 2…2048, 1 = 4K…2048K, 2 = 4M…2048M, 3 = ∞
  const tierOfE = e => e >= 32 ? 3 : e >= 22 ? 2 : e >= 12 ? 1 : 0;
  // ---- higher levels reuse the muted base hues, a bit brighter each level
  function hexToHsl(hex) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, s = 0;
    if (mx !== mn) {
      const d = mx - mn;
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s * 100, l * 100];
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const hsl = (h, s, l) => `hsl(${((h % 360) + 360) % 360},${clamp(s, 0, 100)}%,${clamp(l, 0, 100)}%)`;
  // base hue for a K/M value: same muted family as level 1, offset so neighbours differ
  const baseHsl = (e, t) => hexToHsl(PALETTE[(e - (t === 1 ? 9 : 16)) % PALETTE.length]);
  const colorCache = new Map();
  function applySkin(id) {
    skin = SKINS.find(k => k.id === id) || SKINS[0];
    PALETTE = skin.pal;
    colorCache.clear(); styleCache.clear();
    updateHud();
  }
  function colorOf(v) {
    if (v === WILD) return '#c084fc';
    if (colorCache.has(v)) return colorCache.get(v);
    const e = log2(v), t = tierOfE(e);
    let c;
    if (t === 0) c = PALETTE[(e - 1) % PALETTE.length];
    else if (t === 3) c = '#8b5cf6';
    else { const [h, sat, l] = baseHsl(e, t); c = hsl(h, sat + 14 * t, l + 7 * (t === 2 ? 1.4 : 1)); }
    colorCache.set(v, c);
    return c;
  }

  // Short score for the header: full number up to 99,999, then 123K / 1.21M / 4.5B.
  function shortScore(n) {
    if (n < 100000) return n.toLocaleString();
    const units = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K']];
    for (const [d, u] of units) if (n >= d) {
      const x = n / d;
      const txt = x >= 100 ? Math.floor(x).toString() : x >= 10 ? (Math.floor(x * 10) / 10).toString() : (Math.floor(x * 100) / 100).toString();
      return txt + u;
    }
    return String(n);
  }

  // Tile labels: up to 2048 in full, then 4K, 8K … 512K, 1M … 512M, 1B …
  function fmt(v) {
    if (v === WILD) return '★';
    if (v >= INF) return '∞';
    if (v >= 4194304) return (v / 1048576) + 'M';   // 4M … 2048M
    if (v >= 4096) return (v / 1024) + 'K';         // 4K … 2048K
    return String(v);
  }

  function newTile(v, x, y) { return { v, x, y, s: 0.2, ty: null }; }
  const resetShooter = () => { shooter = newTile(cur, cellX(aim), launchY()); };

  // ---------- layout ----------
  let W = 0, H = 0, dpr = 1, cell = 40, bx = 0, by = 0, layoutKey = '';
  // Returns false when the size is unchanged (several resize signals can fire at once).
  function layout() {
    const r = wrap.getBoundingClientRect(), d = window.devicePixelRatio || 1, key = cols + 'x' + rows;
    if (r.width === W && r.height === H && d === dpr && key === layoutKey) return false;
    layoutKey = key;
    dpr = d;
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cell = Math.floor(Math.min(W / cols, H / (rows + 1.35), MAX_CELL));
    bx = (W - cell * cols) / 2;
    by = Math.max(0, (H - cell * (rows + 1.35)) / 2);
    return true;
  }
  const cellX = c => bx + c * cell;
  const cellY = r => by + r * cell;
  const launchY = () => by + rows * cell + cell * 0.3;

  // ---------- board helpers ----------
  const count = c => { let n = 0; for (const t of grid[c]) if (t) n++; return n; };
  const allTiles = () => (grid ? grid.flat().filter(Boolean) : []);
  const gridValues = () => grid.map(col => col.map(t => (t ? t.v : 0)));

  function landingRow(c, v) {
    const n = count(c);
    if (n < rows) return n;
    const bottom = grid[c][rows - 1].v;
    if (bottom === v || (v === WILD && bottom > 0)) return rows - 1; // merges into bottom tile
    return -1;
  }
  const fits = v => grid.some((_, c) => landingRow(c, v) >= 0);
  const isStuck = () => !fits(cur) && !fits(nxt);   // neither tile can be placed

  function eqNeighbors(c, r) {
    const t = grid[c][r];
    if (!t || t.v < 0) return [];
    const out = [];
    for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
      const o = grid[nc][nr];
      if (o && o.v === t.v) out.push([nc, nr]);
    }
    return out;
  }

  // Every block connected to (c, r) through equal-valued neighbours, as [col, row]
  // pairs starting with (c, r). A merge takes the whole group, not just the
  // neighbours of one block, so four 32s in a line all merge together.
  function groupOf(c, r) {
    const v = grid[c][r] && grid[c][r].v;
    if (!(v > 0)) return [];
    const seen = new Set([c * rows + r]), out = [[c, r]];
    for (let i = 0; i < out.length; i++) {
      const [qc, qr] = out[i];
      for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
        const nc = qc + dc, nr = qr + dr;
        if (nc < 0 || nc >= cols || nr < 0 || nr >= rows || seen.has(nc * rows + nr)) continue;
        const o = grid[nc][nr];
        if (o && o.v === v) { seen.add(nc * rows + nr); out.push([nc, nr]); }
      }
    }
    return out;
  }

  // Pushes every column's tiles up to the ceiling. Returns positions of tiles that moved.
  function compact() {
    const moved = [];
    for (let c = 0; c < cols; c++) {
      const col = grid[c].filter(Boolean);
      for (let r = 0; r < rows; r++) {
        const t = col[r] || null;
        if (t && grid[c][r] !== t) moved.push([c, r]);
        grid[c][r] = t;
      }
    }
    return moved;
  }

  function find(t) {
    for (let c = 0; c < cols; c++)
      for (let r = 0; r < rows; r++)
        if (grid[c][r] === t) return [c, r];
    return null;
  }

  // ---------- tile supply ----------
  // Current level from the biggest tile made: 0 until 4K, 1 until 4M, then 2.
  const tierOf = mv => Math.min(2, tierOfE(log2(mv)));
  // Each level launches the previous level's 2048 plus 4…64 of its own units
  // (2…64, then 2048/4K…64K, then 2048K/4M…64M). The top of the range opens up
  // as your biggest tile grows; bigger values are rarer.
  function boardMaxE() {
    let m = 0;
    for (const t of allTiles()) if (t.v > 0 && t.v < INF) m = Math.max(m, log2(t.v));
    return m;
  }
  function spawnRange() {
    const k = tierOf(maxV), lo = 10 * k + 1;
    if (k === 0) return [lo, Math.min(lo + 5, Math.max(lo + 2, log2(maxV) - 1))];
    // K and M levels: never launch anything bigger than the biggest block on the board
    return [lo, Math.min(lo + 5, Math.max(lo, boardMaxE()))];
  }
  // Blocks left over from earlier levels (below this level's launch range).
  function oldBlocks() {
    const cut = Math.pow(2, spawnRange()[0]);
    return allTiles().filter(t => t.v < cut).map(t => t.v);
  }

  function rollValue() {
    if (levelish()) return levelRoll();
    const [lo, hi] = spawnRange();
    // While old-level blocks remain, often launch one of their values (more
    // likely for values you have several of): ~70% at first, easing to ~30%
    // as they get cleared. Only values actually on the board are used.
    const old = oldBlocks();
    if (old.length) {
      oldStart = Math.max(oldStart, old.length);
      const pOld = 0.3 + 0.4 * (old.length / oldStart);
      if (Math.random() < pOld) return old[Math.floor(Math.random() * old.length)];
    }
    return drawFromBag(lo, hi);
  }

  // Is v still a legal launch? (used when a previewed tile moves up the queue)
  function launchable(v) {
    if (levelish()) return true;
    const [lo, hi] = spawnRange();
    if (v >= Math.pow(2, lo) && v <= Math.pow(2, hi)) return true;
    return oldBlocks().includes(v);
  }

  // Launches come from a shuffled bag of ~40 tiles built from the odds (each
  // step up 0.6x as likely), like Threes: no long floods or droughts of one value.
  // One bag serves the whole level; values currently above the cap (biggest
  // block on the board) stay in the bag for later instead of being drawn.
  function drawFromBag(lo, hi) {
    for (let attempt = 0; attempt < 2; attempt++) {
      if (bagKey !== String(lo) || !bag.length) {
        bagKey = String(lo); bag = [];
        let total = 0;
        for (let e = lo; e <= lo + 5; e++) total += Math.pow(0.6, e - lo);
        for (let e = lo; e <= lo + 5; e++) {
          const n = Math.max(1, Math.round(Math.pow(0.6, e - lo) / total * 40));
          for (let k = 0; k < n; k++) bag.push(Math.pow(2, e));
        }
        for (let i = bag.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [bag[i], bag[j]] = [bag[j], bag[i]];
        }
      }
      const cap = Math.pow(2, hi);
      for (let i = bag.length - 1; i >= 0; i--) {
        if (bag.at(i) <= cap) return bag.splice(i, 1)[0];
      }
      bag = [];                          // only too-big values left: start a fresh bag
    }
    return Math.pow(2, lo);
  }

  // ---------- scoring / feedback ----------
  function addScore(v, c, r) {
    score += v;
    if (v > maxV) { maxV = v; milestoneCheck(v); }
    if (score > best) best = score;
    floaters.push({ text: '+' + fmt(v), x: cellX(c) + cell / 2, y: cellY(r) + cell / 2, life: 1 });
    updateHud();
  }

  // Helpers won from chests, kept across games and modes (unlike freeUses,
  // which belong to one game or level).
  const INV_KEY = 'mergeQuest.inventory.v1';
  let inv = { hammer: 0, swap: 0, undo: 0, shots: 0, wild: 0, heater: 0 };
  try { Object.assign(inv, JSON.parse(store.get(INV_KEY) || '{}')); } catch (e) {}
  const saveInv = () => store.set(INV_KEY, JSON.stringify(inv));
  const freeCount = name => freeUses[name] + inv[name];

  const priceOf = name => (freeCount(name) > 0 ? 0 : COST[name]);
  // pay for a helper: this game's free uses first, then won helpers, then coins
  function spend(name) {
    if (freeUses[name] > 0) freeUses[name]--;
    else if (inv[name] > 0) { inv[name]--; saveInv(); }
    else setCoins(coins - COST[name]);
  }

  function setCoins(n) {
    coins = Math.max(0, n);
    store.set(COIN_KEY, String(coins));
    updateHud();
  }

  function tierFor(combo) {
    let t = null;
    for (const p of PRAISE) if (combo >= p[0]) t = p;
    return t;
  }
  // Coins for a combo. Above the top tier each extra merge adds 12.
  function comboCoins(combo) {
    const t = tierFor(combo);
    if (!t) return 0;
    const top = PRAISE[PRAISE.length - 1];
    return t[2] + (combo > top[0] ? (combo - top[0]) * 12 : 0);
  }

  // Coins earned by a play: counted for undo, added, and flown into the wallet.
  function earn(n) {
    lastEarned += n;
    setCoins(coins + n);
    launchCoins(n);
  }

  function rewardCombo(combo) {
    const t = tierFor(combo);
    if (!t) return;
    const gain = comboCoins(combo);
    praise = { text: t[1], sub: combo + '× combo  +' + gain, color: t[3], life: 1.6, s: 0.4, tier: PRAISE.indexOf(t) };
    earn(gain);
  }

  // ---------- flying coins ----------
  // A burst of coins pops out where the praise shows, then each one arcs into the
  // wallet; the counter ticks up as they land. More coins earned = more coins flying.
  function launchCoins(gain) {
    const n = Math.min(12, Math.max(1, Math.ceil(gain / 3)));
    const cr = cv.getBoundingClientRect();
    const sx = cr.left + bx + cell * cols / 2, sy = cr.top + by + cell * rows * 0.42 + cell * 0.6;
    const per = Math.floor(gain / n);
    let rest = gain - per * n;
    coinPending += gain;
    updateHud();
    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'fcoin';
      coinLayer.appendChild(el);
      const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.4;
      const burst = cell * (0.5 + Math.random() * 0.9);
      coinFlights.push({
        el, value: per + (rest-- > 0 ? 1 : 0), first: i === 0, last: i === n - 1, gain,
        sx, sy, bxp: sx + Math.cos(ang) * burst, byp: sy + Math.sin(ang) * burst,
        start: t0 + 260 + i * 70, popDur: 260, flyDur: 560 + Math.random() * 120, spin: 6 + Math.random() * 6,
      });
    }
  }

  const coinLayer = $('coinLayer'), walletCoin = $('wallet').querySelector('.coin');
  function walletTarget() {
    const r = walletCoin.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  }

  function coinLanded(f, tx, ty) {
    coinPending = Math.max(0, coinPending - f.value);
    updateHud();
    const w = $('wallet');
    w.classList.remove('bump'); void w.offsetWidth; w.classList.add('bump');
    setTimeout(() => w.classList.remove('bump'), 120);
    if (f.first) {
      const plus = document.createElement('div');
      plus.className = 'coin-plus';
      plus.textContent = '+' + f.gain;
      w.appendChild(plus);
      setTimeout(() => plus.remove(), 1000);
    }
    for (let k = 0; k < 3; k++) {
      const sp = document.createElement('div');
      sp.className = 'sparkle';
      coinLayer.appendChild(sp);
      const a = Math.random() * Math.PI * 2, d = 14 + Math.random() * 14;
      sp.animate([
        { transform: `translate(${tx}px, ${ty}px) scale(1)`, opacity: 1 },
        { transform: `translate(${tx + Math.cos(a) * d}px, ${ty + Math.sin(a) * d}px) scale(.2)`, opacity: 0 },
      ], { duration: 380, easing: 'ease-out' }).onfinish = () => sp.remove();
    }
  }

  function stepCoins(now) {
    if (!coinFlights.length) return;
    const [tx, ty] = walletTarget();
    coinFlights = coinFlights.filter(f => {
      const t = now - f.start;
      let x, y, sc = 1;
      if (t < 0) { f.el.style.opacity = 0; return true; }
      f.el.style.opacity = 1;
      if (t < f.popDur) {                               // pop out of the praise
        const p = t / f.popDur, e = 1 - Math.pow(1 - p, 3);
        x = f.sx + (f.bxp - f.sx) * e; y = f.sy + (f.byp - f.sy) * e;
        sc = 0.3 + 0.9 * e;
      } else {                                          // arc into the wallet
        const p = Math.min(1, (t - f.popDur) / f.flyDur);
        const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        const cx = (f.bxp + tx) / 2 + (f.bxp < tx ? -1 : 1) * cell * 0.8, cy = Math.min(f.byp, ty) - cell * 0.6;
        const u = 1 - e;
        x = u * u * f.bxp + 2 * u * e * cx + e * e * tx;
        y = u * u * f.byp + 2 * u * e * cy + e * e * ty;
        sc = 1.2 - 0.45 * e;
        if (p >= 1) { f.el.remove(); coinLanded(f, tx, ty); return false; }
      }
      const flip = Math.abs(Math.cos(t / 1000 * f.spin));  // spinning coin
      f.el.style.transform = `translate(${x}px, ${y}px) scale(${sc * (0.35 + 0.65 * flip)}, ${sc})`;
      return true;
    });
  }

  function clearCoinFlights() {
    for (const f of coinFlights) f.el.remove();
    coinFlights = []; coinPending = 0; chestHeld = 0;
  }

  // Shrink the score/best numbers so big scores always fit their boxes.
  function fitStats() {
    for (const id of ['score', 'best']) {
      const el = $(id), box = el.parentElement;
      el.style.fontSize = '';
      let fs = parseFloat(getComputedStyle(el).fontSize);
      const room = box.clientWidth - 12;
      while (el.scrollWidth > room && fs > 10) { fs -= 1; el.style.fontSize = fs + 'px'; }
    }
  }

  // the small "Next" preview tiles in the footer
  function paintMini(el, v, sizes) {
    const label = fmt(v), ts = tileCss(v);
    el.textContent = label;
    el.style.fontSize = sizes[Math.min(5, label.length)] + 'px';
    el.style.background = ts.bg; el.style.color = ts.fg; el.style.border = ts.border;
  }

  function updateHud() {
    const sTxt = shortScore(score), bTxt = mode === 'daily' ? dayLabel(lv.day) : mode === 'level' ? String(lv.n) : shortScore(best);
    $('bestLabel').textContent = mode === 'daily' ? 'Daily' : mode === 'level' ? 'Level' : 'Best 🏆';
    if (sTxt !== $('score').textContent || bTxt !== $('best').textContent) {
      $('score').textContent = sTxt;
      $('best').textContent = bTxt;
      fitStats();
    }
    $('coins').textContent = Math.max(0, coins - coinPending).toLocaleString();
    $('infCount').textContent = infCount.toLocaleString();
    paintMini($('nextTile'), nxt, [0, 23, 22, 17, 14, 12]);
    paintMini($('nextTile2'), nxt2, [0, 17, 16, 12, 10, 9]);
    const n = countTiles();
    $('tSwap').disabled = busy || over || (coins < priceOf('swap') && tool !== 'swap') || n < 2;
    $('tHammer').disabled = busy || over || (coins < priceOf('hammer') && tool !== 'hammer') || n < 1;
    $('tUndo').disabled = busy || !snap || coins - lastEarned < priceOf('undo') || helpersOff();
    // No-helper levels: Switch and the helpers stay tappable but clearly locked
    // (greyed, dashed, a 🔒 badge); tapping explains why instead of doing nothing.
    const locked = helpersOff();      // strictly true/false: toggle(x, undefined) would flip
    for (const id of ['tSwap', 'tHammer', 'tUndo', 'swapBtn']) {
      $(id).classList.toggle('locked', locked);
      if (locked) $(id).disabled = false;
    }
    if (!locked) $('swapBtn').disabled = busy || over;
    $('restartBtn').disabled = busy;
    for (const [id, name] of [['tSwap', 'swap'], ['tHammer', 'hammer'], ['tUndo', 'undo']])
      $(id).querySelector('.pr').textContent = locked ? 'Locked' : freeCount(name) > 0 ? 'Free ×' + freeCount(name) : COST[name];
    $('tSwap').classList.toggle('active', tool === 'swap');
    $('tHammer').classList.toggle('active', tool === 'hammer');
    const fitsCur = fits(cur);
    if (levelish() && !tool && !over) {
      const L = levelDef();
      const toStone = L.stoneEvery ? L.stoneEvery - (lv.used % L.stoneEvery) : 0;
      const toSnow = L.snowEvery ? L.snowEvery - (lv.used % L.snowEvery) : 0;
      const tr = levelTier(L);
      // The goal sits behind the 🎯 button (red dot = a goal is active; it pulses
      // until the goal card has been opened this attempt). Shots stay in view.
      $('hint').innerHTML = `<div class="goal-row">
        <button class="goal-btn" id="goalBtn" aria-label="Show goal">🎯 Goal<span class="dot${lv.goalSeen ? '' : ' new'}"></span></button>
        ${tr ? `<span class="tier-pill ${L.tier}">${tr.icon} ${L.tier === 'super' ? 'SUPER HARD' : 'HARD'}</span>` : ''}
        <span class="meta">${lv.shots ? `<b>${lv.shotsLeft}</b> shot${lv.shotsLeft === 1 ? '' : 's'} left` : 'No shot limit'}${toStone ? ` · 🪨 in <b>${toStone}</b>` : ''}${toSnow ? ` · ❄️ in <b>${toSnow}</b>` : ''}</span>
      </div>`;
      $('goalBtn').onclick = showGoal;
      return;
    }
    $('hint').textContent = tool === 'hammer' ? 'Tap a block to smash it (tap Hammer again to cancel).'
      : tool === 'swap' ? (sel ? 'Now tap the block to swap it with.' : 'Tap the first block to swap.')
      : over ? 'No moves left.'
      : !fitsCur ? 'Current tile has nowhere to go — switch it!'
      : 'Tap a column to shoot. Combos earn coins!';
  }

  const countTiles = () => allTiles().length;

  // A tile being sucked into `target` like one bubble joining another.
  // `delay` (ms) holds the block in place before it starts moving.
  function absorbGhost(t, target, delay = 0, dur = MERGE_MS) {
    ghosts.push({ kind: 'absorb', v: t.v, x0: t.x, y0: t.y, x: t.x, y: t.y, target, t: -delay / 1000, dur: dur / 1000 });
  }
  function fadeGhost(t, dy) {
    ghosts.push({ kind: 'fade', v: t.v, x: t.x, y: t.y, tx: t.x, ty: t.y + dy, a: 1 });
  }

  // Merge `sources` into `target` with the bubble animation, then pop to newV.
  // Blocks are sucked in one after another; the number doubles as each lands.
  async function bubbleMerge(target, sources, newV) {
    const old = target.v;
    newV = Math.min(newV, INF);
    const dur = sources.length === 1 ? PAIR_MS : MERGE_MS;
    // Plan when each block lands. 2-3 blocks: steady rhythm. 4+ blocks: it
    // ramps up - each block is sucked in faster and the gaps keep shrinking.
    const ramp = sources.length >= 3;
    const plan = [];
    for (let i = 0; i < sources.length; i++) {
      if (!ramp) { plan.push({ start: i * STAGGER_MS, dur }); continue; }
      const d = dur * Math.pow(0.85, i);
      const arrive = i === 0 ? dur : plan[i - 1].start + plan[i - 1].dur + 110 * Math.pow(0.7, i - 1);
      plan.push({ start: arrive - d, dur: d });
    }
    sources.forEach((src, i) => absorbGhost(src, target, plan[i].start, plan[i].dur));
    target.show = old;                 // keep showing the old number until absorbed
    target.v = newV;
    target.wob = { amp: -0.08, t: 0 }; // slight inhale while it pulls the others in
    const total = plan[plan.length - 1].start + plan[plan.length - 1].dur;
    target.mt = { t: 0, dur: (total + 180) / 1000 };
    let elapsed = 0;
    for (let i = 0; i < sources.length; i++) {
      const arrive = plan[i].start + plan[i].dur;
      await sleep(arrive - elapsed);
      elapsed = arrive;
      if (i < sources.length - 1) {    // intermediate step: count up with a small gulp
        target.show = Math.min(INF, old * Math.pow(2, i + 1));
        target.s = 1.1 + (ramp ? i * 0.03 : 0);
        target.wob = { amp: 0.08, t: 0 };
      }
    }
    target.show = undefined;
    target.s = 1.24;
    target.wob = { amp: 0.16, t: 0 };
    if (newV >= INF && old < INF) infinityMade(target);
    const col = colorOf(newV);
    mergeBurst(target, col);
  }

  // Bubbles flying out of a tile's centre. Ranges are [base, random extra];
  // speed and radius are in cells.
  function burst(t, n, speed, radius, life, colour, shape) {
    const cx = t.x + cell / 2, cy = t.y + cell / 2;
    const rnd = ([a, b]) => a + Math.random() * b;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = cell * rnd(speed);
      bubbles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        r: cell * rnd(radius), life: rnd(life), col: colour(i),
        shape, rot: Math.random() * 6.3, spin: (Math.random() - 0.5) * 12 });
    }
  }

  // The burst when blocks merge, in the merge effect chosen in the Shop.
  const FX_HUES = { stars: ['#fde68a', '#facc15', '#ffffff'], hearts: ['#ff5c8a', '#ff8fb1', '#ffd1dc'],
    confetti: ['#f472b6', '#facc15', '#4ade80', '#22d3ee', '#a78bfa', '#fb923c'] };
  function mergeBurst(t, col) {
    const fx = look.fx;
    if (!FX_HUES[fx]) { burst(t, 9, [1, 1.6], [0.04, 0.08], [0.5, 0.35], () => col); return; }
    const hues = FX_HUES[fx];
    burst(t, fx === 'confetti' ? 16 : 11, [1.1, 1.7], [0.05, 0.06], [0.6, 0.4], i => hues[i % hues.length], fx);
  }

  // A few particles behind a shot in flight, in the trail chosen in the Shop.
  function emitTrail(t) {
    if (!t.trail) return;
    if (!t.fly) { t.trail = false; return; }
    const kind = look.trail;
    for (let i = 0; i < 2; i++) {
      const col = kind === 'rainbow' ? hsl(nowMs / 3 + i * 40, 90, 65)
        : kind === 'comet' ? colorOf(t.v) : (Math.random() < 0.5 ? '#fff7c2' : '#facc15');
      bubbles.push({ x: t.x + cell / 2 + (Math.random() - 0.5) * cell * 0.35, y: t.y + cell * 0.85,
        vx: (Math.random() - 0.5) * cell * 0.4, vy: cell * 0.4, r: cell * (kind === 'comet' ? 0.11 : 0.06),
        life: 0.35 + Math.random() * 0.2, col, shape: kind === 'sparkle' ? 'stars' : 'dot', trail: true,
        rot: Math.random() * 6.3, spin: 4 });
    }
  }

  function drawParticle(b, a) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = b.col;
    const r = b.r;
    if (b.shape === 'stars') {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const rr2 = i % 2 ? r * 0.7 : r * 1.7, an = (i * Math.PI) / 5;
        ctx.lineTo(Math.sin(an) * rr2, -Math.cos(an) * rr2);
      }
      ctx.closePath(); ctx.fill();
    } else if (b.shape === 'hearts') {
      ctx.beginPath();
      ctx.moveTo(0, r * 1.2);
      ctx.bezierCurveTo(-r * 2.2, -r * 0.2, -r * 0.9, -r * 1.9, 0, -r * 0.5);
      ctx.bezierCurveTo(r * 0.9, -r * 1.9, r * 2.2, -r * 0.2, 0, r * 1.2);
      ctx.fill();
    } else if (b.shape === 'confetti') {
      ctx.fillRect(-r * 1.2, -r * 0.6, r * 2.4, r * 1.2);
    } else {                           // trail dot
      ctx.globalAlpha = a * 0.8;
      ctx.beginPath(); ctx.arc(0, 0, r * clamp(b.life * 2.5, 0.2, 1), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ---------- stones ----------
  const STONE_GREY = ['#d9d0c4', '#b3a796', '#8d8273', '#ffffff'];
  const stoneDust = i => STONE_GREY[i % STONE_GREY.length];
  // Stones next to any of the merging cells take one hit each: an intact stone
  // cracks, a cracked one breaks. Returns how many broke (the caller compacts).
  function hitStones(cells) {
    const seen = new Set();
    let broke = 0;
    for (const [c, r] of cells) for (const [dc, dr] of [[0, -1], [-1, 0], [1, 0], [0, 1]]) {
      const nc = c + dc, nr = r + dr;
      if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) continue;
      const s = grid[nc][nr];
      if (!s || s.v >= 0 || seen.has(s)) continue;
      seen.add(s);
      if (isFrozen(s.v)) { thaw(s); continue; }
      if (s.v === STONE) {
        s.v = CRACKED; s.s = 1.12; s.wob = { amp: 0.16, t: 0 };
        burst(s, 6, [0.8, 0.8], [0.03, 0.04], [0.35, 0.2], stoneDust);
      } else {
        grid[nc][nr] = null;
        fadeGhost(s, cell * 0.4);
        burst(s, 16, [1.2, 1.6], [0.04, 0.07], [0.55, 0.35], stoneDust);
        floaters.push({ text: '💥', x: s.x + cell / 2, y: s.y + cell / 2, life: 1 });
        broke++;
      }
    }
    if (broke && lv) lv.broken = (lv.broken || 0) + broke;
    return broke;
  }

  // Ice shatters off a frozen block; it's a normal block again (and may merge next).
  const ICE_BITS = ['#e0f4ff', '#a5d8ff', '#ffffff', '#7cc4ff'];
  function thaw(t) {
    t.v = thawed(t.v);
    t.s = 1.18; t.wob = { amp: 0.18, t: 0 };
    burst(t, 14, [1.1, 1.5], [0.03, 0.05], [0.5, 0.3], i => ICE_BITS[i % ICE_BITS.length]);
    floaters.push({ text: '❄️', x: t.x + cell / 2, y: t.y + cell / 2, life: 0.9 });
    if (lv) lv.thawed = (lv.thawed || 0) + 1;
    thawMilestone();
  }

  // Level mode: a stone rises into a random column that has room.
  function dropStone(v = STONE) {
    const open = [];
    for (let c = 0; c < cols; c++) if (count(c) < rows) open.push(c);
    if (!open.length) return;
    const c = open[Math.floor(Math.random() * open.length)], r = count(c);
    const t = newTile(v, cellX(c), launchY());
    t.s = 0.6; t.ty = launchY();      // stepTile turns the move into a flight
    grid[c][r] = t;
    banner = { text: v === STONE ? '🪨 A stone rolled in!' : '❄️ Snowfall! A frozen block dropped in', life: 1.3 };
  }
  // Snowfall: a frozen block worth a value from the level's range (2 … 2^spawn).
  const dropSnow = () => dropStone(F(Math.pow(2, 1 + Math.floor(Math.random() * Math.min(levelDef().spawn || 3, 5)))));

  // ---------- one-time milestone bounties (any mode, paid once ever) ----------
  // Paid outside lastEarned, so undoing the play doesn't take a bounty back.
  const BOUNTY_KEY = 'mergeQuest.bounties.v1';
  const MILESTONES = [[2048, 300], [4096, 500], [4194304, 1000], [INF, 2000]];
  function loadBounties() {
    try { return JSON.parse(store.get(BOUNTY_KEY) || '{}') || {}; } catch (e) { return {}; }
  }
  // Lifetime thaw count: the first 50 thawed blocks pay a one-time bounty.
  const THAW_KEY = 'mergeQuest.thawed.v1', THAW_GOAL = 50, THAW_PAY = 400;
  function thawMilestone() {
    const n = (parseInt(store.get(THAW_KEY) || '0', 10) || 0) + 1;
    store.set(THAW_KEY, String(n));
    const got = loadBounties();
    if (n >= THAW_GOAL && !got.thaw) {
      got.thaw = Date.now(); store.set(BOUNTY_KEY, JSON.stringify(got));
      setCoins(coins + THAW_PAY); launchCoins(THAW_PAY);
      toast(`🏅 ${THAW_GOAL} blocks thawed! +${THAW_PAY} coins`);
    }
  }
  function milestoneCheck(v) {
    const got = loadBounties();
    for (const [at, pay] of MILESTONES) {
      if (v < at || got[at]) continue;
      got[at] = Date.now();
      store.set(BOUNTY_KEY, JSON.stringify(got));
      setCoins(coins + pay); launchCoins(pay);
      toast(`🏅 First ${fmt(at)}! +${pay} coins`);
    }
  }
  let toastTimer = 0;
  function toast(text) {
    const el = $('toast');
    el.textContent = text; el.classList.add('show');
    clearTimeout(toastTimer);

  }
  function showMilestones() {

    showOverlay(`

      <ul class="ms-list">${MILESTONES.map(([at, pay]) => `
        <li class="${got[at] ? 'done' : ''}"><span>${got[at] ? '✅' : '🔒'} First <b>${fmt(at)}</b> block</span>
        <span>${got[at] ? 'Claimed' : `<span class="coin"></span> ${pay}`}</span></li>`).join('')}
        <li class="${got.thaw ? 'done' : ''}"><span>${got.thaw ? '✅' : '❄️'} Thaw <b>${THAW_GOAL}</b> frozen blocks${got.thaw ? '' : ` (${Math.min(THAW_GOAL, parseInt(store.get(THAW_KEY) || '0', 10) || 0)}/${THAW_GOAL})`}</span>
        <span>${got.thaw ? 'Claimed' : `<span class="coin"></span> ${THAW_PAY}`}</span></li></ul>
      <button class="primary" id="closeBtn">Close</button>`, '', { close: hideOverlay });

  }

  // A brand-new ∞ block: count it (saved across games) and celebrate.
  function infinityMade(t) {
    infCount++;

  // Two ∞ blocks that merge disappear, opening space, and pay 250 coins.
  function clearInfinity(t, [c, r]) {
    if (grid[c][r] !== t) return;
